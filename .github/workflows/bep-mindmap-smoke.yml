name: BEP mind-map smoke tests

on:
  push:
    branches:
      - migration/bep-map-consolidation-20261023
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend helpers and assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check mindmap/static/app.js
          node --check mindmap/static/graph-utils.js
          node --check mindmap/tests/test_frontend.js
      - name: Existing frontend regression tests
        run: node mindmap/tests/test_frontend.js
      - name: Bundled assets present
        run: |
          test -s mindmap/static/index.html
          test -s mindmap/static/style.css
          test -s mindmap/static/vendor/elk-worker.min.js

  backend:
    name: Backend portability and HTTP tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal test dependencies
        run: python -m pip install pytest PyYAML 'pydantic>=2,<3'
      - name: Python syntax
        run: python -m compileall -q mindmap
      - name: Existing owner-map and preview tests
        run: python -m pytest -q mindmap/tests/test_owner_map.py mindmap/tests/test_preview.py
