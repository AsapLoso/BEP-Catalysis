      "kind": "concept",
      "maturity": "ai_worked_out",
      "relevance": "core",
      "summary": "Surface-state equations must conserve sites while accounting for adsorption, desorption and reaction stoichiometry.",
      "explanation": "For elementary step j, let ν^s_lj be the signed stoichiometric coefficient of adsorbed species l. With rates normalized per site, dθ_l/dt=Σ_j ν^s_lj r^s_j. If r is instead per catalyst mass or external area, a site-density conversion is needed before it can be added to a fractional coverage rate. A simple monodentate lattice has θ_*+Σ_l θ_l=1; for species occupying s_l sites, θ_*+Σ_l s_l θ_l=1. This is a closure constraint, not a kinetic law.",
