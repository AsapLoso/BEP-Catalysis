  notes: "AI WORKED OUT (yellow), NOT human verified. Urmès 2019 Table 5 at source conditions: FIXED K1 = 13 Pa^-1 (not earlier narrative estimate 611 Pa^-1), K5 = 7.4 Pa, and Ns = 2e-3 mol sites/kg catalyst. FITTED K2 = 107 +/- 7 Pa^-1, k4^0 = (1.4 +/- 0.1)e8 mol/(mol Pd_surface*s), k7^0 = (3.6 +/- 0.6)e9 in same units, E4 = 48.5 +/- 4.2 kJ/mol, E7 = 54.8 +/- 11 kJ/mol.\n\nThose +/- ranges reflect reported 95% intervals under the source fitting assumptions, NOT calibration transfer uncertainty. k4^0/k7^0 are apparent/composite temperature prefactors in an effective fitted rate law, not the full set of independent forward/reverse microscopic constants.\n\nR*T in Arrhenius uses T in kelvin, E in J/mol; evaluate raw pre-exponential at temperature before using a centered Arrhenius parametrization. The source receipt 24/24 passes refer to transcription of selected original statements, NOT end-to-end reactor validation.\n\nSources are AI-attached. The present map does not certify transferable kinetics, experimentally calibrated transient surface coverages or personally verified citation claims."
