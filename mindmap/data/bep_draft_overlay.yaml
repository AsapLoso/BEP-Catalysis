- id: internal_diffusion_thiele
  parent: transport_phenomena
  title: Intraparticle Diffusion & Thiele Modulus
  tier: 1
  importance: 2
  rationale: Quantifies pore diffusion limitations and computes effectiveness factor
    eta across varying pellet radii.
  notes: 'Governed by radial Fickian diffusion: dcp/dt = Deff / r^2 * d/dr(r^2 * dcp/dr)
    + rho_cat * r_gen. High Thiele modulus (Phi > 1) lowers selectivity by starving
    interior of acetylene.'
  sources:
  - title: Berger et al. (2008)
    doi: 10.1016/j.ces.2008.08.012
    path: Academics/BEP/Catalysis/Articles/analyses/dynamic_kinetics_berger2008.md
    citation: null
    section: 'Section 5: Criteria for internal mass transport limitations'
  - title: Transport Phenomena Notes
    doi: null
    path: Academics/BEP/Catalysis/1_Transport_Phenomena/
    citation: null
    section: Thiele modulus scaling and Weisz-Prater criterion
  open_questions:
  - Measure or estimate effective Knudsen/molecular diffusivity Deff in mesoporous
    alpha/gamma-Al2O3 support.
  is_draft: true
- id: external_film_transfer
  parent: transport_phenomena
  title: External Fluid-Solid Film Transport (Mears Criterion)
  tier: 1
  importance: 2
  rationale: Checks whether boundary layer gradients exist between bulk gas flow and
    outer catalyst surface.
  notes: 'Flux J = k_g * a_v * (C_b - C_s). Evaluated via Mears criterion: if (r_obs
    * rho_b * R_p * n) / (k_c * C_b) < 0.15, external mass transport resistance is
    negligible.'
  sources:
  - title: Berger et al. (2008)
    doi: 10.1016/j.ces.2008.08.012
    path: Academics/BEP/Catalysis/Articles/analyses/dynamic_kinetics_berger2008.md
    citation: null
    section: Section 5.1 External transport diagnostics
  open_questions:
  - Confirm superficial gas velocity u_s vs interstitial velocity u_s / epsilon_b
    to correctly evaluate Sherwood (Sh) and Reynolds (Re) numbers.
  is_draft: true
- id: pbr_governing_pdes
  parent: math_mathematical_modelling
  title: 1D Dynamic Packed-Bed Reactor PDEs
  tier: 1
  importance: 3
  rationale: Formulates non-linear hyperbolic-parabolic partial differential equations
    governing axial advection, dispersion, and reaction.
  notes: 'Mass: dCb_i/dt = -u_s * dCb_i/dz + D_ax * d^2Cb_i/dz^2 - k_g*a_v*(Cb_i -
    Cs_i). Energy: rho_g*Cp_g * dT/dt = -u_s*rho_g*Cp_g * dT/dz + lambda_ax * d^2T/dz^2
    + 4*U/D_t*(T_w - T) + sum(r_j * (-dH_j)).'
  sources:
  - title: Larsen Thesis Chapter 4 Materials & Methods
    doi: null
    path: Academics/BEP/Catalysis/Articles/2 meeting Damian + Zoë/extracted/Ch4_Materials_and_Methods.txt
    citation: null
