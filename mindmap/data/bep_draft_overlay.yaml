- id: c2_urmes_2019_net_rates
  parent: c2_urmes_2019_effective_rates
  title: "Two hydrogenation rate expressions and gas sources"
  tier: 1
  importance: 3
  rationale: "AI-developed physical kinetic concept supporting the dynamic packed-bed reactor proposal, distinct from human validation or alternate literature-fit models."
  notes: "AI WORKED OUT (yellow), NOT human verified. With k4(T) = k4^0*exp[-E4/(R*T)] and k7(T) = k7^0*exp[-E7/(R*T)]: r1 = Ns*k4(T)*K1*K2*P_C2H2*P_H2/(D^2) and r2 = Ns*k7(T)*(K1/K5)*P_C2H4*P_H2/(D^2), giving mol/(kg_catalyst*s) under the published normalizations.\n\nWith gas order (H2, C2H2, C2H4, C2H6), net source vector = (-r1-r2, -r1, r1-r2, r2). This gas-only net closure assumes no independently accumulating surface inventory.\n\nFor positive relevant partial pressures, r2/r1 = [k7(T)/k4(T)]*[P_C2H4/P_C2H2]/(K2*K5). Shared D^-2 and K1*P_H2 terms cancel algebraically in this ratio, but the ratio alone does NOT establish that full model parameters are structurally unidentifiable.\n\nSources are AI-attached. The present map does not certify transferable kinetics, experimentally calibrated transient surface coverages or personally verified citation claims."
