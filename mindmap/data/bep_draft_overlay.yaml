- id: physics_catalytic_chemistry
  parent: physics
  title: "Catalytic Chemistry"
  tier: 1
  importance: null
  rationale: "C1 broad chemistry theme: chemical identities, catalyst-site chemistry and competing product pathways; AI interpretation only, proposed parent/boundary still awaiting user approval."
  notes: |-
    KNOWLEDGE STATUS: AI worked out (amber), not human reviewed. This is a proposal
    for the scientific Level-2 taxonomy, NOT an approved placement or an experimental result.

    Scope within C1: (1) net reaction network, (2) physical catalyst surface and
    active-site chemistry, (3) desired/undesired products and selectivity, (4) optional
    reaction paths and catalyst-specific alternatives.

    Net stoichiometry (C deep dive §C.1):
      desired: C2H2 + H2 -> C2H4  (r1)
      competing: C2H4 + H2 -> C2H6  (r2)
    Feed ethylene itself can enter the second reaction, not merely ethylene first
    formed from acetylene. The two-step net scheme does not specify whether the
    ethylene intermediate desorbs before further hydrogenation.

    Candidate chemical mechanism topics for later Level-3 / letter C review:
      * adsorption/desorption of hydrogen, acetylene and ethylene
      * dissociative H2 adsorption, surface site availability and competition
      * vinyl (C2H3*) and ethyl (C2H5*) intermediates
      * possible continuous adsorbed path versus gas-ethylene readsorption
      * omitted/alternative chemistry: C4+, coke/deactivation, distinct site
        families or Pd/PdAg-support effects, candidate minor parallel pathways.
    These are candidate concepts, not verified universal mechanisms or automatic
    authorisation to add every descendant now.

    Boundary: C2 Reaction Kinetics & Surface Dynamics owns mathematical
    elementary-step rates, fitted LHHW/PSSA laws, rate constants, temporal
    theta(t) equations and kinetic identifiability (also linked to S&C).
    Physics Transport/Reactor Physics owns external/intraparticle access,
    pressure, temperature, scale and experimental applicability. Experiments
    & Measurements owns how site chemistry and product streams are observed.

    Evidence limits: Existing C research compares three different implementations;
    legacy has three dynamic occupied-site states but zero default source-fit rates;
    the newer 2019-based reacting path uses algebraic steady/PSSA kinetics;
    the non-PSSA experiment has illustrative five coverage states without
    verified source parameters. Urmès 2022 full mechanism remains unresolved in
    that audit. Do NOT claim experimental kinetics, periodic yield gain, or
    direct catalyst transfer has been demonstrated by this map entry.

    STRUCTURAL DECISION (owner, 2026-10-20): C1 has TWO substantial children:
      (a) Reaction Chemistry & Pathways, and
      (b) Catalyst Chemistry & Active Sites.
    The children are concept nodes with their own notes and expandable
    descendants. User prioritised both, but did NOT verify their scientific
    explanations. The graph has NO DEPTH CAP: seven, eight or more levels
    are welcome when the concept structure warrants them. Example paths
    below the two children remain IDEAS, not approved/verified leaf nodes.

    CITATION REVIEW: sources below are AI-attached; none is recorded here as
    specifically human-verified to support its mapped claim.
  sources:
  - title: "BEP presentation deep dive C — reaction mechanism and surface physics"
    doi: null
    path: "Academics/BEP/Catalysis/presentation/deep-dives/C_reaction_mechanism_2026-10-14.md"
    citation: null
    section: "C.0–C.5 (source/code comparisons and chemistry); AI-attached, owner review pending"
  - title: "Urmès et al. (2019), Catalysts 9, 180"
    doi: "10.3390/catal9020180"
    path: null
    citation: null
    section: "Reaction mechanism and Table 3 as discussed in C deep dive; owner verification pending"
  open_questions:
  - "Review the scope of the two accepted C1 sub-branches and their eventual deeper concept hierarchy; do not infer scientific ownership."
  - "Which alternative pathways/site types deserve concept nodes, and which remain scope ideas?"
  - "Which parts of the microscopic adsorption mechanism belong in C1 versus C2 kinetics, without duplication?"
  is_draft: true
