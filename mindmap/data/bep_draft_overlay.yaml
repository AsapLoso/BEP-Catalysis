    mixture).
  is_draft: true
- id: transport_phenomena
  parent: physics_transport_phenomena
  title: Coupled Interphase & Intraparticle Transport
  tier: 1
  importance: 3
  rationale: Models multi-scale concentration and temperature gradients from bulk
    gas to pellet interior.
  notes: 'Three-level coupled transport: Bulk gas Cb(z) -> Film boundary Cs(z) ->
    Intraparticle pore cp(z,r). Explicit transient intraparticle diffusion rather
    than instant equilibrium.'
  sources:
  - title: Conventions §11 Model Architecture Decisions
