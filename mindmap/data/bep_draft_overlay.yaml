- id: reaction_thermodynamics
  parent: physics_reactor_thermodynamics
  title: Reaction Exothermicity & Heats of Hydrogenation
  tier: 1
  importance: 3
  rationale: Accounts for large heats of reaction that drive temperature hotspots
    and potential thermal runaway.
  notes: 'Hydrogenation 1: C2H2 + H2 -> C2H4 (dH = -172 kJ/mol). Hydrogenation 2:
    C2H4 + H2 -> C2H6 (dH = -136 kJ/mol). High exothermicity requires coupled bed
    energy balance.'
  sources:
  - title: Larsen Thesis Chapter 4 Materials & Methods
    doi: null
    path: Academics/BEP/Catalysis/Articles/2 meeting Damian + Zoë/extracted/Ch4_Materials_and_Methods.txt
    citation: null
