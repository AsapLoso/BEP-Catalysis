- id: c2_urmes_2019_adsorption_denominator
  parent: c2_urmes_2019_effective_rates
  title: "Competitive adsorption denominator and vacant-site closure"
  tier: 1
  importance: 3
  rationale: "AI-developed physical kinetic concept supporting the dynamic packed-bed reactor proposal, distinct from human validation or alternate literature-fit models."
  notes: "AI WORKED OUT (yellow), NOT human verified. For source partial pressures P_i in Pa, define D = 1 + sqrt(K1*P_H2) + K2*P_C2H2 + P_C2H4/K5. The fitted net rates each contain D^2, reflecting competition for the shared effective site inventory.\n\nHere K1 and K2 have dimensions Pa^-1; K5 has dimensions Pa. Replacing P_C2H4/K5 by K5*P_C2H4, or assuming all adsorption constants have Pa^-1, is a unit/model error. In the source's effective model theta_vacant can be represented as 1/D.\n\nThis is a single-site mean-field approximation under selected source conditions; it is not evidence that all PdAg catalysts have exactly one site family or that transient site blocking always equilibrates instantly.\n\nSources are AI-attached. The present map does not certify transferable kinetics, experimentally calibrated transient surface coverages or personally verified citation claims."
