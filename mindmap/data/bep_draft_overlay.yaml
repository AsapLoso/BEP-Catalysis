- id: c2_urmes_2019_effective_rates
  parent: physics_reaction_kinetics
  title: "Urmès 2019 effective single-site PSSA kinetics"
  tier: 1
  importance: 3
  rationale: "AI-developed physical kinetic concept supporting the dynamic packed-bed reactor proposal, distinct from human validation or alternate literature-fit models."
  notes: "AI WORKED OUT (yellow), NOT human verified. These are experimentally fitted effective NET rates for acetylene semi-hydrogenation and ethylene over-hydrogenation on 0.05 wt% Pd/alpha-Al2O3 at source-specific temperatures and ethylene-rich feed conditions. They share a competitive adsorption denominator and combine quasi-equilibrium assumptions with rate-determining elementary steps.\n\nThis model has algebraic, instantaneous surface-pressure dependence (PSSA). It does NOT integrate independent theta(t), although a reactor coupling the rates to time-dependent gas transport is itself dynamic.\n\nKeep this branch DISTINCT from legacy node lhhw_kinetics, which describes a different Larsen extended LHHW context including a non-integer inhibition exponent. Do not mix the papers' parameters, source catalysts or kinetics.\n\nSources are AI-attached. The present map does not certify transferable kinetics, experimentally calibrated transient surface coverages or personally verified citation claims."
