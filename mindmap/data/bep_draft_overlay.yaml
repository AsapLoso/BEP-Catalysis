- id: lhhw_kinetics
  parent: physics_reaction_kinetics
  title: Extended LHHW Reaction Kinetics
  tier: 1
  importance: 3
  rationale: Captures competitive adsorption between C2H2, C2H4, and H2 on active
    catalyst sites with non-ideal inhibition.
  notes: Extended Langmuir-Hinshelwood-Hougen-Watson formulation. Rate r1 (acetylene
    to ethylene) features squared denominator; rate r2 features non-integer fitted
    exponent n_inh.
  sources:
  - title: Larsen MSc Thesis (2024)
    doi: null
    path: Academics/BEP/Catalysis/Articles/2 meeting Damian + Zoë/extracted/Ch6_Results_and_Discussion.txt
    citation: null
    section: Equations 6.9–6.11 (Final Extended LHHW Rate Law)
  - title: BEP Catalysis Project Conventions §12.1
    doi: null
    path: Academics/BEP/Catalysis/conventions.md
    citation: null
    section: §12.1 Verified against primary text
  open_questions:
  - Confirm whether hydrogen adsorption is non-dissociative or dissociative on Ag-promoted
    Pd surface.
  - Resolve unmeasured cross-sectional area A and support density rho_support from
    Appendix F before quantitative conversion calibration.
  is_draft: true
- id: centered_arrhenius
  parent: lhhw_kinetics
  title: Centered Arrhenius Temperature Dependence
  tier: 1
  importance: 2
  rationale: "Centered Arrhenius parameterization uses k(T_ref) and can improve numerical conditioning of a chosen fit, but does not guarantee eliminating parameter correlations or a universal correlation threshold."
  notes: "AI SCIENCE CORRECTION (D5.A): k(T) = k(T_ref)*exp[-Ea/R*(1/T - 1/T_ref)] with T and T_ref in kelvin and Ea in J/mol. This is equivalent to k(T)=k0*exp[-Ea/(R*T)] ONLY if k(T_ref)=k0*exp[-Ea/(R*T_ref)]; do not substitute the raw k0 directly into the centered equation. Centering often improves practical parameter scaling/interpretability, but numerical correlation and identifiability still depend on measurement range, model, data and noise; the previous blanket claim 'eliminates correlation below 0.71' is retracted. This is a mathematical representation, NOT independent validation of a catalyst's kinetic constants. Source: BEP D_kinetic_parameters_identifiability_2026-10-14.md §D5.A, AI attached; no human source approval."
  sources:
  - title: Berger et al. (2008) Chemical Engineering Science 63
    doi: 10.1016/j.ces.2008.08.012
    path: Academics/BEP/Catalysis/Articles/analyses/dynamic_kinetics_berger2008.md
    citation: null
    section: Equation 17 - Centered Arrhenius formulation
  - title: Model Architecture Decisions §11.5
    doi: null
    path: Academics/BEP/Catalysis/conventions.md
    citation: null
    section: '§11 Item 5: Centered Arrhenius for kp(T)'
  open_questions:
  - 'Select optimal reference temperature T0 (candidate: 313 K / 40 °C matching Larsen
    benchmark).'
  is_draft: true
- id: surface_coverage_dynamics
  parent: lhhw_kinetics
  title: Dynamic Surface Coverage State θ(z,r)
  tier: 1
  importance: 3
  rationale: Tracks time-dependent fraction of vacant and occupied catalyst active
    sites under transient/forcing conditions.
  notes: 'Conservation: theta_vacant + theta_C2H2 + theta_C2H4 + theta_H = 1. Coupled
    directly into instantaneous reaction rates rather than pseudo-steady-state assumption.'
