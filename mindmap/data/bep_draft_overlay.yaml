  is_draft: true
- id: method_of_lines_mol
  parent: math_numerical_analysis
  title: Method of Lines (MOL) Semi-Discretization
  tier: 1
  importance: 3
  rationale: Transforms spatial differential operators into a coupled system of stiff
    initial-value ordinary differential equations.
  notes: Spatial axial grid Nz points; radial particle grid Nr points. Convective
    terms discretised via 1st-order upwind (backward difference) for monotonicity;
    diffusion discretised via central difference.
  sources:
