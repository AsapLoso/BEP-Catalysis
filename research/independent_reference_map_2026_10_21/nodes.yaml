      "title": "Conversion, selectivity and yield",
      "kind": "concept",
      "maturity": "ai_worked_out",
      "relevance": "core",
      "summary": "Cycle productivity, conversion, selectivity and yield answer different questions and require explicit flow and carbon accounting.",
      "explanation": "For a C₂ feed with acetylene A, define cycle conversion X_A = ∫(F_A,in−F_A,out)dt / ∫F_A,in dt and net ethylene selectivity S_E = ∫(F_E,out−F_E,in)dt / ∫(F_A,in−F_A,out)dt when the denominator is positive and accounting is complete. Their product is cycle yield Y_E on this basis. A ratio of integrated amounts is generally not the time-average of instantaneous selectivity. Net ethylene production subtracts inlet ethylene; productivity additionally needs a declared catalyst-mass or reactor-volume basis. A selectivity maximum alone may reward low throughput.",
      "assumptions": [
        "C₂ feed basis and product identity are stated; other carbon products are accounted for or reported as unclosed.",
        "Cycle metrics use settled periodic flow integrals; startup performance is separate."
