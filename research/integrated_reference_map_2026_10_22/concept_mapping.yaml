    summary_or_rationale: The product network, elementary surface pathways, side reactions and carbon balance define
      the selectivity problem.
    explanation_or_notes: This branch separates overall stoichiometry from elementary surface chemistry and observed
      products. The sequential C₂H₂→C₂H₄→C₂H₆ backbone is useful for product accounting, but a catalyst-specific
      mechanism may involve site ensembles, adsorbed intermediates, deposits or unmeasured C₄ products. Product
      selectivity is a joint outcome of pathway rates, site availability, transport and measurement limits.
    open_questions:
