- source_dataset: independent_v2
  source_node_id: ph_thermal_evolution
  source_title: Thermal coupling and catalyst evolution
  source_parent_id: physics
  source_file: Academics/BEP/Catalysis/research/independent_reference_map_2026_10_21/nodes.yaml
  integrated_node_ids:
  - u_ph_thermal
  prior_reconciliation_theme_id: u_ph_thermal
  disposition: merged
  legacy_tier: null
  legacy_is_draft: null
  source_content_preserved:
    summary_or_rationale: Thermal feedback and catalyst-state evolution are separate physical extensions that may
      couple to dynamic composition.
    explanation_or_notes: The proposal’s isothermal baseline removes temperature dynamics by assumption. Hydrogenation
      heat, wall removal and temperature-dependent rates can create a thermal response with its own lag; restructuring,
      subsurface hydrogen, deposits and deactivation can create reversible or slow memory. These effects should
      not be merged into one generic surface-memory state. Measure or bound temperature and time-on-stream changes
      before treating them as negligible.
    open_questions:
    - What temperature deviations or catalyst aging occur at the proposed bed and cycle conditions?
  prior_reconciliation_mapping:
    dataset: independent_v2
    source_node_id: ph_thermal_evolution
    proposed_node_id: u_ph_thermal
