      product pathways; AI interpretation only, proposed parent/boundary still awaiting user approval.'
    explanation_or_notes: "KNOWLEDGE STATUS: AI worked out (amber), not human reviewed. This is a proposal\nfor\
      \ the scientific Level-2 taxonomy, NOT an approved placement or an experimental result.\n\nScope within C1:\
      \ (1) net reaction network, (2) physical catalyst surface and\nactive-site chemistry, (3) desired/undesired\
      \ products and selectivity, (4) optional\nreaction paths and catalyst-specific alternatives.\n\nNet stoichiometry\
      \ (C deep dive §C.1):\n  desired: C2H2 + H2 -> C2H4  (r1)\n  competing: C2H4 + H2 -> C2H6  (r2)\nFeed ethylene\
      \ itself can enter the second reaction, not merely ethylene first\nformed from acetylene. The two-step net\
      \ scheme does not specify whether the\nethylene intermediate desorbs before further hydrogenation.\n\nCandidate\
      \ chemical mechanism topics for later Level-3 / letter C review:\n  * adsorption/desorption of hydrogen, acetylene\
      \ and ethylene\n  * dissociative H2 adsorption, surface site availability and competition\n  * vinyl (C2H3*)\
      \ and ethyl (C2H5*) intermediates\n  * possible continuous adsorbed path versus gas-ethylene readsorption\n\
      \  * omitted/alternative chemistry: C4+, coke/deactivation, distinct site\n    families or Pd/PdAg-support\
      \ effects, candidate minor parallel pathways.\nThese are candidate concepts, not verified universal mechanisms\
      \ or automatic\nauthorisation to add every descendant now.\n\nBoundary: C2 Reaction Kinetics & Surface Dynamics\
      \ owns mathematical\nelementary-step rates, fitted LHHW/PSSA laws, rate constants, temporal\ntheta(t) equations\
      \ and kinetic identifiability (also linked to S&C).\nPhysics Transport/Reactor Physics owns external/intraparticle\
      \ access,\npressure, temperature, scale and experimental applicability. Experiments\n& Measurements owns how\
      \ site chemistry and product streams are observed.\n\nEvidence limits: Existing C research compares three\
      \ different implementations;\nlegacy has three dynamic occupied-site states but zero default source-fit rates;\n\
      the newer 2019-based reacting path uses algebraic steady/PSSA kinetics;\nthe non-PSSA experiment has illustrative\
      \ five coverage states without\nverified source parameters. Urmès 2022 full mechanism remains unresolved in\n\
      that audit. Do NOT claim experimental kinetics, periodic yield gain, or\ndirect catalyst transfer has been\
      \ demonstrated by this map entry.\n\nSTRUCTURAL DECISION (owner, 2026-10-20): C1 has TWO substantial children:\n\
      \  (a) Reaction Chemistry & Pathways, and\n  (b) Catalyst Chemistry & Active Sites.\nThe children are concept\
      \ nodes with their own notes and expandable\ndescendants. User prioritised both, but did NOT verify their\
      \ scientific\nexplanations. The graph has NO DEPTH CAP: seven, eight or more levels\nare welcome when the\
      \ concept structure warrants them. Example paths\nbelow the two children remain IDEAS, not approved/verified\
      \ leaf nodes.\n\nCITATION REVIEW: sources below are AI-attached; none is recorded here as\nspecifically human-verified\
