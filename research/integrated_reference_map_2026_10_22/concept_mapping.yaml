      support interactions, pretreatment, adsorbate inventory or history.
    explanation_or_notes: Keep single-site, multisite, alloy-ensemble, hydride and changing-surface models as competing
      families. Dissociative H2 adsorption may require adjacent vacancies in a chosen mechanism; site-count and
      coverage conventions must follow that mechanism. The 2019 Pd catalyst, modeled Pd/PdAg surfaces, a studied
      PdAg/TiO2 catalyst and the BEP catalyst are not interchangeable evidence objects. Surface-state and deposit
      hypotheses should remain explicit and testable.
    open_questions:
