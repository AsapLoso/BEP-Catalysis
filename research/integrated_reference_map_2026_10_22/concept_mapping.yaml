  disposition: merged
  legacy_tier: null
  legacy_is_draft: null
  source_content_preserved:
    summary_or_rationale: Cycle-average performance may improve, match or fall below an optimized steady point;
      analyze settled periodic orbits and explicit no-gain limits.
    explanation_or_notes: A periodic input can create nonlinear rectification when surface, transport or catalyst
      states lag the gas forcing. Stable linear dynamics preserve the mean/DC relationship, and a static concave
      response cannot beat its value at the mean input. Neither special case covers a general nonlinear reactor.
      Classical periodic-operation theory gives conditional tests, not a universal acetylene gain theorem. Evaluate
      the actual model, feasible controls, metric and catalyst evidence.
    open_questions:
    - How many cycles are needed to reach a stable periodic regime for plausible parameters?
  prior_reconciliation_mapping:
