  source_node_id: c2_urmes_2019_parameter_ledger
  source_title: 'Published Table 5 values: fixed versus fitted parameters'
  source_parent_id: c2_urmes_2019_effective_rates
  source_file: Academics/BEP/Catalysis/mindmap/data/bep_draft_overlay.yaml
  integrated_node_ids:
  - c2_urmes_2019_parameter_ledger
  prior_reconciliation_theme_id: u_ph_kinetics
  disposition: corrected
  legacy_tier: 1
  legacy_is_draft: true
  source_content_preserved:
    summary_or_rationale: AI-developed physical kinetic concept supporting the dynamic packed-bed reactor proposal,
      distinct from human validation or alternate literature-fit models.
    explanation_or_notes: 'AI WORKED OUT (yellow), NOT human verified. Urmès 2019 Table 5 at source conditions:
      FIXED K1 = 13 Pa^-1 (not earlier narrative estimate 611 Pa^-1), K5 = 7.4 Pa, and Ns = 2e-3 mol sites/kg catalyst.
      FITTED K2 = 107 +/- 7 Pa^-1, k4^0 = (1.4 +/- 0.1)e8 mol/(mol Pd_surface*s), k7^0 = (3.6 +/- 0.6)e9 in same
      units, E4 = 48.5 +/- 4.2 kJ/mol, E7 = 54.8 +/- 11 kJ/mol.


      Those +/- ranges reflect reported 95% intervals under the source fitting assumptions, NOT calibration transfer
      uncertainty. k4^0/k7^0 are apparent/composite temperature prefactors in an effective fitted rate law, not
      the full set of independent forward/reverse microscopic constants.


      R*T in Arrhenius uses T in kelvin, E in J/mol; evaluate raw pre-exponential at temperature before using a
      centered Arrhenius parametrization. The source receipt 24/24 passes refer to transcription of selected original
      statements, NOT end-to-end reactor validation.


      Sources are AI-attached. The present map does not certify transferable kinetics, experimentally calibrated
      transient surface coverages or personally verified citation claims.'
    open_questions:
    - Which constants would need refitting for a different support or for dynamic non-PSSA site ODEs?
  scientific_uncertainty: Source text gives K1=611 Pa^-1 on printed p.5 while Table 5 gives K1=13 Pa^-1 on printed
    p.6; both are preserved as unresolved.
