    summary_or_rationale: The bed-plane forcing seen by catalyst particles can differ from a commanded inlet because
      of mixing, residence-time distribution, dispersion and gas–solid transport.
    explanation_or_notes: Represent axial convection and optional dispersion with a declared coordinate and flux
      convention; assess external-film and intraparticle resistance before choosing an effectiveness-factor or lumped-rate
      model. Tracer response and pellet transport can filter or phase-shift a waveform. Danckwerts boundary conditions
      are tied to a flux formulation and should not be copied into an incompatible PDE convention.
    open_questions:
    - What is the measured command-to-bed-plane transfer function?
    - Are axial, film or pellet timescales material at candidate frequencies?
- source_dataset: proposed_unified_map
  source_node_id: u_ph_thermal
  source_title: Energy balance, thermal dynamics and catalyst evolution
  source_parent_id: physics
  source_file: Academics/BEP/Catalysis/research/map_comparison_reconciliation_2026_10_21/proposed_unified_map.yaml
  integrated_node_ids:
  - u_ph_thermal
  prior_reconciliation_theme_id: null
  disposition: refined
  legacy_tier: null
  legacy_is_draft: null
  source_content_preserved:
    summary_or_rationale: An isothermal model is a falsifiable baseline; reaction heat, heat exchange and catalyst
      evolution can add memory and constrain safe operation.
    explanation_or_notes: Assess an energy balance using measured heat release, bed heat capacity, wall/jacket transfer
      and spatial temperature evidence before treating temperature as fixed. Thermal runaway limits and jacket dynamics
      couple physical chemistry to operating constraints. Deposits or aging may be slow states; if they evolve across
      cycles, a one-cycle objective can hide campaign-scale loss.
    open_questions:
    - Are temperature oscillations material to kinetic sensitivity and selectivity margins?
    - Should productivity include aging and utility costs over repeated cycles?
- source_dataset: proposed_unified_map
  source_node_id: u_ma_conservation
  source_title: Stoichiometric and continuum conservation models
  source_parent_id: mathematics
  source_file: Academics/BEP/Catalysis/research/map_comparison_reconciliation_2026_10_21/proposed_unified_map.yaml
  integrated_node_ids:
  - u_ma_conservation
  prior_reconciliation_theme_id: null
  disposition: refined
  legacy_tier: null
  legacy_is_draft: null
  source_content_preserved:
    summary_or_rationale: Gas, surface and product balances need consistent species, rate and volume bases with
      explicit initial and boundary data.
    explanation_or_notes: Connect reaction source vectors to axial gas transport and, where selected, surface-state
      dynamics. State whether concentrations are on gas-void, total-bed-volume or catalyst-mass basis; convert solid
      rates with matching porosity and density factors. Algebraic PSSA rates may feed transient gas PDEs; dynamic
      coverage adds states and possibly algebraic constraints.
    open_questions:
    - Which conserved quantities and dimensions will be checked?
    - Which boundary convention represents the inlet/outlet hardware?
- source_dataset: proposed_unified_map
  source_node_id: u_ma_scaling
  source_title: Dimensionless groups and timescale hierarchy
  source_parent_id: mathematics
  source_file: Academics/BEP/Catalysis/research/map_comparison_reconciliation_2026_10_21/proposed_unified_map.yaml
  integrated_node_ids:
  - u_ma_scaling
  prior_reconciliation_theme_id: null
  disposition: refined
  legacy_tier: null
  legacy_is_draft: null
  source_content_preserved:
    summary_or_rationale: Dimensionless ratios organize transport and forcing regimes but are not evidence of resonance
      or gain by themselves.
    explanation_or_notes: Use axial Péclet, Damköhler, forcing/residence, pellet Thiele and relevant thermal or
      adsorption timescale ratios to screen regimes and justify reductions. Define every group from the chosen dimensional
      equations; conventions can invert ratios or change prefactors. Scaling should guide experiment design and
      numerical resolution, then be checked against measured plant response.
    open_questions:
    - Which timescales are measured versus inferred?
    - Which model reductions survive target-specific screening?
- source_dataset: proposed_unified_map
  source_node_id: u_ma_numerics
  source_title: Discretization, stiff integration and numerical verification
  source_parent_id: mathematics
  source_file: Academics/BEP/Catalysis/research/map_comparison_reconciliation_2026_10_21/proposed_unified_map.yaml
  integrated_node_ids:
  - u_ma_numerics
  prior_reconciliation_theme_id: null
  disposition: refined
  legacy_tier: null
  legacy_is_draft: null
  source_content_preserved:
    summary_or_rationale: A transient discretized model needs spatial, temporal and periodic-orbit convergence evidence
      before small predicted gains can be interpreted physically.
    explanation_or_notes: The method of lines converts PDEs to potentially stiff ODE/DAE systems. Convection-dominated
      transport can cause numerical diffusion or oscillation; switching inputs challenge error control and event
      handling. Verify grid/time refinement, conservation, physical bounds, periodic residuals, tolerances and suitable
      alternative discretizations. Verification is not validation against data.
    open_questions:
    - What refinement and balance tolerances are small relative to the claimed difference?
    - Do alternative schemes converge to the same periodic objective?
- source_dataset: proposed_unified_map
  source_node_id: u_ma_periodic
  source_title: Periodic orbits, mean response and no-gain limits
  source_parent_id: mathematics
  source_file: Academics/BEP/Catalysis/research/map_comparison_reconciliation_2026_10_21/proposed_unified_map.yaml
  integrated_node_ids:
  - u_ma_periodic
  prior_reconciliation_theme_id: null
  disposition: refined
  legacy_tier: null
  legacy_is_draft: null
  source_content_preserved:
    summary_or_rationale: The sign of periodic-operation effects is conditional; mathematical limits and contrasting
      model-specific studies rule out universal benefit claims.
    explanation_or_notes: At settled periodic response, a stable LTI system has mean output equal to its DC response
      to mean input. A static concave response obeys Jensen’s no-gain bound at fixed mean. Nonlinear stateful systems
      may rectify forcing positively, negatively or not at all. A strict advantage is not implied by nonlinearity
      or a frequency window in one pellet model. Separately, if the periodic feasible set contains all steady controls
      under identical constraints and objective, its global optimum cannot be worse; this does not prove a strict
      gain or real-world feasibility.
    open_questions:
    - Which nonlinear memory/transport mechanisms survive target-specific tests?
    - Does periodic operation beat the optimized steady point after uncertainty and actuator limits?
- source_dataset: proposed_unified_map
  source_node_id: u_ma_inverse
  source_title: Identifiability, sensitivity and uncertainty
  source_parent_id: mathematics
  source_file: Academics/BEP/Catalysis/research/map_comparison_reconciliation_2026_10_21/proposed_unified_map.yaml
  integrated_node_ids:
  - u_ma_inverse
  prior_reconciliation_theme_id: null
  disposition: refined
  legacy_tier: null
  legacy_is_draft: null
  source_content_preserved:
    summary_or_rationale: A model reproducing one transient need not uniquely identify parameters or predict a robust
      optimum.
    explanation_or_notes: Separate structural and practical identifiability, sensitivity and uncertainty propagation.
      Correlated kinetic parameters, uncertain catalyst state, latent profiles and analyzer filtering can make models
      observationally similar. Excitation may improve discrimination, but must respect measurement bandwidth, noise
      and constraints. Propagate parameter and model uncertainty into the periodic-versus-steady difference.
    open_questions:
    - Which parameter combinations are practically identifiable?
    - What uncertainty bound makes a gain distinguishable from zero?
- source_dataset: proposed_unified_map
  source_node_id: u_sc_plant
  source_title: Plant, input realization and model boundary
  source_parent_id: systems_control
  source_file: Academics/BEP/Catalysis/research/map_comparison_reconciliation_2026_10_21/proposed_unified_map.yaml
  integrated_node_ids:
  - u_sc_plant
  prior_reconciliation_theme_id: null
  disposition: refined
  legacy_tier: null
  legacy_is_draft: null
  source_content_preserved:
    summary_or_rationale: The command, realized bed-plane composition, reactor states and measured outputs form
      an input–state–output boundary.
    explanation_or_notes: Trace feed commands through controllers, mixer/manifold, total-flow and pressure coupling,
      inlet volume and bed dispersion to forcing at the particles. Include output sampling and analyzer dynamics.
      Distinguish plant from equipment and observation dynamics; a reduced model is acceptable only for the question
      and bandwidth it preserves.
    open_questions:
    - Which variables are manipulated, measured and constrained?
    - Can bed-plane input be measured/reconstructed at relevant frequencies?
- source_dataset: proposed_unified_map
  source_node_id: u_sc_excitation
  source_title: Periodic excitation and kinetic discrimination
  source_parent_id: systems_control
  source_file: Academics/BEP/Catalysis/research/map_comparison_reconciliation_2026_10_21/proposed_unified_map.yaml
  integrated_node_ids:
  - u_sc_excitation
  prior_reconciliation_theme_id: null
  disposition: refined
  legacy_tier: null
  legacy_is_draft: null
  source_content_preserved:
    summary_or_rationale: Periodic inputs may reveal dynamic kinetics, but successful parameter identification is
      distinct from production improvement.
    explanation_or_notes: Specify waveform, mean, amplitude, frequency, phase, duty cycle and slew behavior at the
      plant boundary. Design excitation to distinguish kinetic closures while respecting actuators, safety and analyzer
      sampling. Modulation-excitation spectroscopy and periodic reactor experiments are methodological precedents;
      their objective and catalyst must remain distinct from this BEP performance question.
    open_questions:
    - Which excitation is safe, realizable and informative?
    - What output bandwidth and phase accuracy are required?
- source_dataset: proposed_unified_map
  source_node_id: u_sc_objective
  source_title: Cycle metric and optimized steady benchmark
  source_parent_id: systems_control
  source_file: Academics/BEP/Catalysis/research/map_comparison_reconciliation_2026_10_21/proposed_unified_map.yaml
  integrated_node_ids:
  - u_sc_objective
  prior_reconciliation_theme_id: null
  disposition: refined
  legacy_tier: null
  legacy_is_draft: null
  source_content_preserved:
    summary_or_rationale: An improvement claim needs a declared cycle metric and fully optimized steady comparator
      under matched constraints.
    explanation_or_notes: Separate conversion, selectivity, yield and productivity; state carbon basis, inlet-product
      subtraction, horizon, catalyst-mass normalization, conversion floor and resource constraints. Compare periodic
      cycle performance to the best feasible steady point, not an arbitrary nominal point. Feasible-set nesting
      gives weak no-worse ordering only if objective and constraints match; strict gain still needs evidence and
      uncertainty separation.
    open_questions:
    - Net production, selectivity at conversion floor, productivity or Pareto objective?
    - Include startup, cycle duration, energy, aging and inlet ethylene?
- source_dataset: proposed_unified_map
  source_node_id: u_sc_observation
  source_title: Measurements, observability and state estimation
  source_parent_id: systems_control
  source_file: Academics/BEP/Catalysis/research/map_comparison_reconciliation_2026_10_21/proposed_unified_map.yaml
  integrated_node_ids:
  - u_ph_measurement
  - u_sc_observation
  prior_reconciliation_theme_id: null
  disposition: split
  legacy_tier: null
  legacy_is_draft: null
  source_content_preserved:
    summary_or_rationale: Outlet analyzers observe filtered boundary signals; bed concentration and coverage profiles
      are latent without additional measurements or a validated observer.
    explanation_or_notes: Model sensor response, sampling, calibration, delay, noise and detection limits before
      fitting transients or evaluating cycles. Observability depends on model, sensors and trajectory; EKF/UKF is
      a future method, not proof that latent coverages are recoverable. Modulation spectroscopy may associate periodic
      signals with surface response but requires catalyst-specific assignments and temporal resolution.
    open_questions:
    - Which states can actual measurements distinguish?
    - What analyzer delay, bandwidth, sampling and detection limits apply?
- source_dataset: proposed_unified_map
  source_node_id: u_sc_feasibility
  source_title: Feasibility, robustness and evidence ladder
  source_parent_id: systems_control
  source_file: Academics/BEP/Catalysis/research/map_comparison_reconciliation_2026_10_21/proposed_unified_map.yaml
  integrated_node_ids:
  - u_sc_feasibility
  prior_reconciliation_theme_id: null
  disposition: refined
  legacy_tier: null
  legacy_is_draft: null
  source_content_preserved:
    summary_or_rationale: The periodic feasible set includes hardware, process, safety, uncertainty and campaign
      constraints; scientific claims need staged numerical and experimental evidence.
    explanation_or_notes: Bound inlet composition, total flow, pressure, temperature, slew, cycling frequency, runaway,
      catalyst health and sensor bandwidth from apparatus evidence. Separate numerical verification, parameter estimation,
      held-out validation and prospective performance comparison. A local optimizer solution is not global unless
      established. Model predictions are conditional on applicability; robustness across plausible parameters and
      model alternatives matters when gains are small.
    open_questions:
    - Which constraints define the admissible periodic set?
    - What held-out evidence is needed for a credible gain?
    - How should degradation and campaign duration enter?
