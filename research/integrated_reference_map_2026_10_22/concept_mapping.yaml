- source_dataset: independent_v2
  source_node_id: ph_packed_bed
  source_title: Gas–solid transport in a packed bed
  source_parent_id: physics
  source_file: Academics/BEP/Catalysis/research/independent_reference_map_2026_10_21/nodes.yaml
  integrated_node_ids:
  - u_ph_transport
  prior_reconciliation_theme_id: u_ph_transport
  disposition: merged
  legacy_tier: null
  legacy_is_draft: null
  source_content_preserved:
    summary_or_rationale: The model couples axial gas transport with distributed catalytic consumption and product
      formation.
    explanation_or_notes: 'A one-dimensional bed model averages over cross-section and pellet-scale structure. The
      primary proposal writes advection, axial dispersion and a heterogeneous source term. Its equation should be
      placed on a clear volumetric basis: gas concentration per void volume, superficial velocity per total bed
      area, bed void fraction, catalyst mass per pellet volume, and rates per catalyst mass. This accounting exposes
      where porosity factors belong and avoids mixing interstitial and superficial velocity conventions.'
    open_questions:
    - What bed geometry, particle dimensions and measured dispersion justify the 1D closure?
  prior_reconciliation_mapping:
    dataset: independent_v2
    source_node_id: ph_packed_bed
    proposed_node_id: u_ph_transport
