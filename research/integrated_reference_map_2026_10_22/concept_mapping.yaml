  source_title: Measurements and physical observability
  source_parent_id: physics
  source_file: Academics/BEP/Catalysis/research/independent_reference_map_2026_10_21/nodes.yaml
  integrated_node_ids:
  - u_ph_measurement
  - u_sc_observation
  prior_reconciliation_theme_id: u_sc_observation
  disposition: refined
  legacy_tier: null
  legacy_is_draft: null
  source_content_preserved:
    summary_or_rationale: The modeled internal surface profiles are inferred states; experimental access depends
      on explicit sensors and measurement dynamics.
    explanation_or_notes: The proposal plans to calibrate against gas chromatograph conversion/selectivity and later
      to modulate feed with mass flow controllers. Boundary gas composition is not a direct observation of all bed-local
      coverages. Modulation-excitation spectroscopy can resolve dynamic species in suitably instrumented lab systems,
      but that does not establish operando coverage measurements throughout an industrial packed bed. A model should
      distinguish physical sensors, their sampling/transport delays and noise from latent states.
    open_questions:
    - Which sensors can operate at the planned cycle frequency with known delay and bandwidth?
  prior_reconciliation_mapping:
    dataset: independent_v2
    source_node_id: ph_measurement
    proposed_node_id: u_sc_observation
