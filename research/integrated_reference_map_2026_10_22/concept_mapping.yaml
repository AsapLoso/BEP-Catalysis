    explanation_or_notes: Bed axial Pe/Da/St and pellet Thiele/modulation scales answer different questions. Large
      bed Pe does not imply negligible intrapellet diffusion; a steady Thiele modulus does not establish whether
      pellet inventory follows a periodic input. Use target geometry, dispersion, effective diffusivity and kinetic
      uncertainty instead of a threshold borrowed from another catalyst.
    open_questions:
    - What experimental values and uncertainty intervals are available for each group?
