  source_node_id: centered_arrhenius
  source_title: Centered Arrhenius Temperature Dependence
  source_parent_id: lhhw_kinetics
  source_file: Academics/BEP/Catalysis/mindmap/data/bep_draft_overlay.yaml
  integrated_node_ids:
  - centered_arrhenius
  prior_reconciliation_theme_id: u_ph_kinetics
  disposition: corrected
  legacy_tier: 1
  legacy_is_draft: true
  source_content_preserved:
    summary_or_rationale: Centered Arrhenius parameterization uses k(T_ref) and can improve numerical conditioning
      of a chosen fit, but does not guarantee eliminating parameter correlations or a universal correlation threshold.
    explanation_or_notes: 'AI SCIENCE CORRECTION (D5.A): k(T) = k(T_ref)*exp[-Ea/R*(1/T - 1/T_ref)] with T and T_ref
      in kelvin and Ea in J/mol. This is equivalent to k(T)=k0*exp[-Ea/(R*T)] ONLY if k(T_ref)=k0*exp[-Ea/(R*T_ref)];
      do not substitute the raw k0 directly into the centered equation. Centering often improves practical parameter
      scaling/interpretability, but numerical correlation and identifiability still depend on measurement range,
      model, data and noise; the previous blanket claim ''eliminates correlation below 0.71'' is retracted. This
      is a mathematical representation, NOT independent validation of a catalyst''s kinetic constants. Source: BEP
      D_kinetic_parameters_identifiability_2026-10-14.md §D5.A, AI attached; no human source approval.'
    open_questions:
    - 'Select optimal reference temperature T0 (candidate: 313 K / 40 °C matching Larsen benchmark).'
  correction: The original Berger DOI was unrelated; the Arrhenius identity is retained as an algebraic derivation
    and the incorrect DOI is mapped to a correction record.
  prior_reconciliation_mapping:
    dataset: original_devcontainer_overlay
    source_node_id: centered_arrhenius
    proposed_node_id: u_ph_kinetics
