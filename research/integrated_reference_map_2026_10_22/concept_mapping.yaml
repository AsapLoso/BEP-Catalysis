  source_content_preserved:
    summary_or_rationale: Gas and surface balances need explicit state bases, stoichiometry, and rate units.
    explanation_or_notes: The reactor equations are clearest when each source term is traced from reaction extent
      to species production and then from catalyst basis to bed-volume basis. The gas PDE and surface coverage ODE
      are coupled through partial pressures/concentrations, coverage-dependent rates, and consistent signs. Boundary/initial
      data complete the dynamical problem.
    open_questions:
