  source_content_preserved:
    summary_or_rationale: Macroscopic outputs may not uniquely determine microscopic kinetic parameters or internal
      states.
    explanation_or_notes: Parameter calibration fits model predictions to observations. If several parameters trade
      off while producing similar outlet conversion/selectivity, the inverse problem is poorly identifiable and
      uncertainty in hidden coverages may be large. Sensitivity, profile likelihood, posterior inference or structural
      identifiability analysis can reveal this. Adding transient or spectroscopic observations may improve identifiability
      but must be designed for the catalyst and time scale.
    open_questions:
    - Which combinations of adsorption and reaction parameters are practically distinguishable from available outputs?
