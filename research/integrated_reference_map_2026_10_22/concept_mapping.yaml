      instantaneously while gas-phase bed states remain transient. Explicit coverage ODEs require an elementary
      mechanism, site balances, adsorption/desorption constants and identifiable parameters. Preserve the original
      centered-Arrhenius correction and validity conditions. Parameter estimation under excitation is distinct from
      evidence of improved production.
