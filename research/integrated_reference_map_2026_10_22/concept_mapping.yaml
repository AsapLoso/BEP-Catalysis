  source_content_preserved:
    summary_or_rationale: Catalyst identity includes working surface structure and active-site ensembles, not just
      nominal bulk Pd:Ag composition.
    explanation_or_notes: Site families, nearest-neighbor ensembles, facets, support interactions, pretreatment,
      hydrogen storage and carbonaceous deposits can alter adsorption and elementary rates. Treat single-site, multi-site
      and changing-surface descriptions as alternative model families. Static working-surface characterization narrows
      mechanism hypotheses but does not itself supply transient kinetic constants.
    open_questions:
    - What composition, support, pretreatment and working surface does the BEP catalyst represent?
