  legacy_tier: null
  legacy_is_draft: null
  source_content_preserved:
    summary_or_rationale: The sequential C2H2 → C2H4 → C2H6 backbone defines the desired intermediate and principal
      over-hydrogenation loss; microscopic routes and side products remain catalyst- and condition-dependent.
    explanation_or_notes: Keep net stoichiometry, elementary pathways and measured product accounting distinct.
      Pd/PdAg calculations and catalyst-specific fits support alternatives such as vinyl, ethyl, ethylidene and
      ethylene desorption/readsorption, but do not establish the BEP working surface. Include inlet ethylene, ethane,
      C4+ products and deposits in the carbon boundary when measurements warrant. A forcing benefit is a hypothesis
      about joint pathway and transport response, not a consequence of the reaction sequence.
    open_questions:
    - Which products and carbon sinks are measurable over the forcing envelope?
    - Does the target catalyst support any proposed Pd/PdAg route?
