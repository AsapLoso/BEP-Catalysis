- id: ma_nonlinear_rectification
  parent: ma_average_gain
  title: Nonlinear Frequency Response and Mean Rectification
  summary: A nonlinear system can turn zero-mean forcing into a nonzero average shift whose sign must be determined.
  explanation: 'For a smooth stable plant near an operating point, the first-order response to a zero-mean sinusoid
    averages to zero, while second-order interactions can create a DC term. The coefficient depends on frequency-dependent
    nonlinear dynamics and cross-coupling; it can be positive, negative or negligible. Matching a time constant
    can change the coefficient but cannot determine its sign. Nonlinear frequency-response analysis in methanol
    synthesis is a methodological example, not transferable acetylene evidence. Nonlinearity alone is insufficient:
    a published ethane-ODH study found negligible mean change over its tested forcing sweep because its response
    behaved effectively linearly in that operating range.'
  assumptions:
  - Small perturbation about a stable operating point with a smooth response expansion; coefficient convention is
    model-specific.
  equations:
  - name: small-amplitude average-response structure
    expression: ȳ(ε,ω) = ȳ₀ + ε²R₂(ω) + O(ε³)
    variables: ε is forcing amplitude, ω angular frequency; R₂ is model-dependent second-order DC response.
    conditions: Schematic expansion; no universal sign or value.
