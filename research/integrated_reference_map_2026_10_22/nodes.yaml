  - Can transient measurements discriminate reversible adsorbate coverage from persistent deposit, restructuring,
    or deactivation states?
- id: c1_borodzinski_ae_effective_rates
  parent: c1_borodzinski_ae_site_hypothesis
  title: A/E model's quasi-steady rate closure and gas-source boundary
  kind: concept
  maturity: ai_worked_out
  status: integrated_ai_reference
  summary: The 2000 A/E model reduces site balances and quasi-equilibrated steps to algebraic rate laws; its rates
    are per mole of Pd per second and cannot be inserted into a mass-based bed source without an explicit catalyst-normalization
    conversion.
  explanation: 'The source model is stationary at the surface-kinetic level: Appendix A writes site fractions and
    applies equilibrium or steady-state approximations to selected elementary steps, then eliminates intermediates
    to obtain algebraic rates. It does not integrate dynamic coverages θ(t). In the A-site derivation, the full
    balance is θ_CCH₂^A + θ_CHCH₂^A + θ_CHCH₃^A + θ_H^A + θ_*^A = 1. For the tail-end condition p_H₂/p_C₂H₂ small,
    the authors further assume acetylene coverage dominates the hydrogenated intermediates and H, reducing the balance
    to θ_CCH₂^A + θ_*^A ≈ 1. Dissociative hydrogen adsorption consumes two vacant A sites in the elementary scheme.


    The reduced expressions encode different routes and site families. The A-site acetylene-to-ethylene Langmuir–Hinshelwood
    rate has a squared acetylene-competition denominator; the direct A-site acetylene-to-ethane route has a cubed
    denominator because its source mechanism uses additional H-addition steps. The E-site ethylene-to-ethane rate
    has a competitive denominator containing both acetylene and ethylene, but the 2000 paper prints inconsistent
    denominator powers for this route: power 2 in the Table 1 model-5 ethane-rate term and power 3 in Appendix A,
    Eq. (A.45). The article''s Table 1 also combines the
    positive acetylene-disappearance contributions from direct ethane, transfer hydrogenation, selective ethylene
    formation, and twice the C₄ formation rate, reflecting two acetylene molecules consumed per C₄ product in its
    accounting.


    The source table reports pressure in kPa and rates normalized per mole of Pd per second (with separate species
    bases for acetylene, ethane, and C₄). Rate constants therefore have different units according to their pressure
    powers. A packed-bed balance written per kg catalyst or per pellet/bed volume needs a consistent Pd inventory
    and catalyst-mass/volume conversion; the source-specific fitted constants are not interchangeable with a generic
    surface-site density or with the 2019 Pd/α-Al₂O₃ constants. The article''s listed hydrogen adsorption/transfer
    steps and quasi-equilibria are assumptions of this reduced closure, not evidence that the same intermediates
    or equilibria are valid under periodic conditions.

    '
  equations:
  - name: A-site occupancy and low-hydrogen reduction
    expression: θ_CCH₂^A + θ_CHCH₂^A + θ_CHCH₃^A + θ_H^A + θ_*^A = 1; if p_H₂/p_C₂H₂ is small and acetylene coverage
      dominates, θ_CCH₂^A + θ_*^A ≈ 1
    variables: Dimensionless fractional occupancies of the A-site family; θ_*^A is the vacant-site fraction.
    conditions: Borodziński and Cybulski (2000), Appendix A, Eqs. (A.1)–(A.3); source-model approximation for its
      tail-end regime, not a general identity after eliminating all intermediates.
  - name: A-site acetylene-to-ethylene rate
    expression: r₄ = k'₄ p_C₂H₂ p_H₂ /(1 + K_A,C₂H₂ p_C₂H₂)²
    variables: p_i in kPa; K_A,C₂H₂ in kPa⁻¹; r₄ in mol C₂H₄ mol Pd⁻¹ s⁻¹; k'₄ has pressure-normalization units
      kPa⁻² under the source table's rate basis.
    conditions: Source Appendix A, Eq. (A.13); quasi-equilibrated adsorption and assumed rate-determining hydrogenation
      step on A sites.
  - name: A-site acetylene-to-ethane route
    expression: r₁ = k'₁ p_C₂H₂ p_H₂² /(1 + K_A,C₂H₂ p_C₂H₂)³
    variables: p_i in kPa; K_A,C₂H₂ in kPa⁻¹; r₁ in mol C₂H₆ mol Pd⁻¹ s⁻¹; k'₁ has pressure-normalization units
      kPa⁻³ under the source table's rate basis.
    conditions: Source Appendix A, Eq. (A.27); this is a PSSA-derived effective rate, not a dynamic coverage ODE.
  - name: E-site ethylene-to-ethane route and source equation discrepancy
    expression: Table 1 model-5 ethane-rate term = k'₂ p_C₂H₄ p_H₂ /(1 + K_E,C₂H₂ p_C₂H₂ + K_E,C₂H₄ p_C₂H₄)²; Appendix A Eq. (A.45) gives r₂ = k'₂ p_C₂H₄ p_H₂ /(1 + K_E,C₂H₂ p_C₂H₂ + K_E,C₂H₄ p_C₂H₄)³
    variables: p_i in kPa; K_E,i in kPa⁻¹; r₂ in mol C₂H₆ mol Pd⁻¹ s⁻¹. Both denominators are dimensionless.
      The pressure product contributes kPa² and requires k'₂ in kPa⁻² under this rate basis; Table 1's notation
      footnote instead prints kPa⁻³ while Table 3 prints kPa⁻².
    conditions: Borodziński and Cybulski (2000), Table 1 model 5 and Appendix A Eq. (A.45), printed pp. 53 and 65.
      The denominator-exponent and k'₂-unit discrepancies are source-internal and unresolved; preserve both forms
      and do not choose one for exact reproduction.
  - name: Net acetylene and C₄ rate accounting
    expression: r_C₂H₂ = r₁ + r₃ + r₄ + 2r₅; r_C₄ = r₅; r_C₂H₆ = r₁ + r₂
    variables: Positive disappearance/formation rate magnitudes per mol Pd per second; p_i in kPa; each r term follows
      the source's model 5 route definitions.
    conditions: Table 1 model 5; r₃ is the deposit hydrogen-transfer route and r₅ is C₄ formation. This species
      accounting is source-model specific and requires consistent conversion to the chosen bed catalyst basis.
  assumptions:
  - Adsorption steps and selected elementary steps are treated as equilibrated or stationary; the derived law has
    no independent dynamic θ state.
  - A-site simplified occupancy uses the authors' low p_H₂/p_C₂H₂ approximation.
  - Pressure and rate bases are the source's kPa and mol-Pd-normalized conventions.
  limitations:
  - Source-specific rates require conversion to the chosen bed catalyst-mass or bed-volume basis using documented
    Pd inventory and catalyst normalization.
  - The paper's acetylene-pressure range is inconsistent between the results text and Table 3/Fig. 6; do not use
    a precise outer range without resolving it.
  - The printed k'₂ unit conflicts with the pressure powers in its displayed ethylene-hydrogenation rate; exact
    reproduction requires clarification or explicit treatment of the discrepancy.
  - The rate laws cannot be interpreted as elementary reversible coefficients for a non-PSSA dynamic-coverage model.
  claim_refs:
  - source_id: borodzinski2000
    locator: Full article, printed p. 53, Table 1; printed pp. 63–65, Appendix A, Eqs. (A.1)–(A.3), (A.13), and
      (A.27)
    evidence_type: source_model_result
    supports: Published source-specific A/E rate equations, site closure, approximations, and rate normalization
      for the commercial Pd/α-Al₂O₃ system.
  - source_id: borodzinski2000
    locator: Full article, printed p. 53 Table 1 and notation footnote; printed p. 60 Table 3; printed p. 65 Appendix A Eq. (A.45)
    evidence_type: derived_under_assumptions
    supports: Appendix A Eq. (A.45) gives r₂ with p_C₂H₄p_H₂ over a dimensionless competitive denominator, so k'₂
      requires kPa⁻² under the stated rate basis; Table 1's notation footnote gives kPa⁻³ while Table 3 gives
      kPa⁻². Separately, the Table 1 model-5 ethylene term uses denominator power 2 whereas Eq. (A.45) uses
      power 3; the source does not reconcile the equation forms.
  - source_id: urmes2019
    locator: Full article, printed pp. 3–6, Tables 3–5 and rate derivation
    evidence_type: source_model_result
    supports: A separate one-site PSSA closure was fitted to 0.05 wt% Pd/α-Al₂O₃ tail-end data; its catalyst, fitted
      expressions, and reported absence of C₄ products differ from the 2000 study.
  related_ids:
  - c1_borodzinski_ae_site_hypothesis
  - c2_surface_kinetic_closure_choices
  - c2_urmes_2019_effective_rates
  - ma_stoichiometry
  - ma_gas_pde
  - ma_pde_ode_coupling
  open_questions:
  - What source-compatible Pd-mass normalization is required before embedding these rates in a catalyst-bed balance?
  - Which independent elementary coefficients and adsorbate states would be needed for a dynamic-coverage extension?
- id: c1_pd_mn_adsorption_substitution
  parent: ph_mechanism_choice
  title: Pd–Mn adsorption substitution as an alternative kinetic model
  kind: concept
  maturity: ai_worked_out
  status: integrated_ai_reference
  summary: For one promoted Pd–Mn/Al2O3 system, Stytsenko et al. replace reversible Langmuir adsorption with an
    acetylene-for-ethylene substitution picture; the proposed two-regime model is source-specific and retains an
    apparent conversion dynamic, not a universal surface-state law.
  explanation: 'Stytsenko et al. studied 0.068 wt% Pd/Al2O3 samples with Mn promotion under atmospheric-pressure
    H2/C2H2/C2H4/Ar feeds at 303–323 K. In their tests, C2H2 and C2H4 were strongly retained: temperature-programmed
    desorption did not detect these molecules or their fragments through the stated heating range, whereas H2 partly
    desorbed near 523 K. A QMS displacement experiment found that supplying gas-phase acetylene to a surface pre-covered
    with ethylene caused ethylene release. The authors therefore argued that reversible competitive Langmuir adsorption
    of both hydrocarbons was inconsistent with their Pd–Mn data and proposed acetylene-driven substitution of chemisorbed
    ethylene.


    Their mechanistic interpretation introduces a strongly held C2H4Z2 intermediate (Z denotes a catalyst center/ensemble
    in the paper’s notation). Acetylene attack on it releases gas-phase ethylene and forms C2H2Z2; a parallel hydrogen
    attack can form a C2H5Z species and ultimately ethane. A fast, hypothetical step 5 replenishes C2H4Z2. The authors
    explicitly state that the nature of this step is unknown. They report high ethylene selectivity up to roughly
    75% acetylene conversion, then a fall attributed mainly to secondary hydrogenation of gas ethylene through an
    adsorbed C2H5Z route. The mechanistic switch is an interpretation of this catalyst and dataset, not an independently
    established universal conversion threshold.


    The kinetic formulation is piecewise. At lower conversion, the authors treat the C2H4Z2 coverage as approximately
    dominant and develop a conversion-versus-contact-time equation; at high conversion they derive selectivity versus
    conversion with an ethylene-loss term. They report an apparent k2 of 0.285, 0.730 and 1.40 s^-1 at 303, 313
    and 323 K and an ethylene-formation activation energy of 64.9 ± 3.1 kJ mol^-1 for their particular model and
    catalyst. These are not intrinsic target constants. The fitted conversion/contact-time relation and the selectivity/conversion
    closure do not amount to integrating a complete set of independently measured elementary coverage ODEs. Their
    activation and adsorption interpretation therefore should be kept distinct from the 2019 one-site Pd/alpha-Al2O3
    PSSA fit and from the 2000 deposit-associated A/E model.


    The low-conversion formulas are apparent contact-time relations. With X = X1 + X2, source selectivity S = X1/X,
    and initial hydrogen ratio μ_H = C_H0/C_A0, Eq. (11) gives dX/dt = k2[1 − X + (k3/k2)(μ_H − 2X + SX)].
    Under the source-reported initial parallel-route premise that S is independent of conversion, treating S as constant
    during the contact-time integration gives their Eq. (12), X(t) = ((K + μ_H){1 − exp[−k2 t(1 + 2/K − S/K)]})/(2 + K − S),
    with K = k2/k3 and t as contact time. They state Eq. (12) is valid for X < 0.8 because θ falls below one
    beyond that regime; Fig. 6 compares the low-conversion relation with data over X = 0.06–0.75. This is not a
    time-dependent packed-bed balance or a complete dynamic coverage ODE.


    For higher conversion, the source defines S = X1/X and differentiates the product balance to obtain Eq. (15),
    dS/dX = (r2 − r6)/(C_A0 X dX/dt) − S/X, with r2 = k2 θ[C2H2] for ethylene formation by step 2 and
    r6 = k6 θ_H[C2H4] for ethylene loss by step 6. The model neglects C2H2Z2 and C2H5Z coverages and imposes
    θ_H + θ = 1, using the algebraic closure θ_H = sqrt(b C_H2)/(1 + sqrt(b C_H2)) and
    θ = 1/(1 + sqrt(b C_H2)). This closure is an assumption of the source model, not a measured coverage trajectory;
    the concentration basis and units for b are not stated in the inspected equation. Eq. (18) is compared with data
    over X = 0.70–0.98, then used to estimate selectivity at X = 1 of about 62% at 313 K and 42% at 323 K.
    Those complete-conversion values are model extrapolations, not measured outcomes. The paper reports the composite
    term b^0.5 k6/k2 as 1.07 and 2.1 at 313 and 323 K, respectively, but does not state its units or recoverable
    concentration basis. The authors infer within this model that the term should be as low as possible to improve
    selectivity; that is a source-model design implication, not a validated target-catalyst rule.


    This model is valuable as a competing hypothesis because it challenges a common L–H assumption: strong chemisorption
    can make an adsorption-substitution cycle a better candidate than reversible equilibrium adsorption under some
    catalyst conditions. The source observations support the reported retention and displacement behavior in its
    apparatus; the unknown fast step, spectral assignments, active-center stoichiometry, and fitted pathway remain
    model-dependent. Do not infer the same chemisorption, selectivity transition, or kinetics for PdAg or the unidentified
    BEP catalyst.'
  equations:
  - name: source-proposed substitution sequence
    expression: C2H4Z2 + C2H2 -> C2H2Z2 + C2H4;  C2H4Z2 + H2 -> C2H5Z + ZH
    variables: Z is the source paper’s catalyst-center symbol; C2H4Z2 and C2H5Z are proposed adsorbed species.
    conditions: Proposed Pd–Mn mechanism; pathway and site stoichiometry are not universally verified.
  - name: initial parallel apparent rate
    expression: r_A = r_2 + r_3 = (k_2 c_A + k_3 c_H) θ
    variables: c_A and c_H are gas acetylene and hydrogen concentrations in the source notation; θ is the proposed
      C2H4Z2 intermediate concentration/coverage.
    conditions: Stytsenko et al. Eq. (7), with source-specific rate definitions; do not equate this directly with
      a rate per kg catalyst without source normalization.
  - name: lower-conversion conversion dynamics
    expression: dX/dt = k_2 [1 − X + (k_3/k_2)(μ_H − 2X + SX)]
    variables: X is acetylene conversion; μ_H is initial hydrogen-to-acetylene concentration ratio; S is source-defined
      ethylene selectivity; t is contact time.
    conditions: Source Eq. (11), approximate dominant intermediate coverage, source feed convention, and X below
      approximately 0.8; not a general packed-bed PDE.
  - name: integrated lower-conversion conversion relation
    expression: X(t) = ((K + μ_H){1 − exp[−k_2 t(1 + 2/K − S/K)]})/(2 + K − S); K = k_2/k_3
    variables: X is acetylene conversion; μ_H = C_H0/C_A0; K is the ratio of the source apparent rate coefficients;
      S is source-defined selectivity; t is contact time.
    conditions: Source Eq. (12), which follows from Eq. (11) when the stage-1 selectivity S is held constant under
      the authors' parallel-path premise; stated validity is X < 0.8 and data comparison is X = 0.06–0.75. This is
      not a distributed transient reactor model.
  - name: high-conversion ethylene loss term
    expression: r_2 = k_2 θ c_A;  r_6 = k_6 θ_H c_E;  θ_H + θ = 1
    variables: c_E is gas ethylene; θ_H and θ are source-model coverages of H and C2H4Z2.
    conditions: Source high-conversion model uses further approximations and a separate selectivity-versus-conversion
      equation; the displayed balance is not a full elementary dynamic coverage model.
  - name: high-conversion selectivity balance
    expression: dS/dX = (r_2 − r_6)/(C_A0 X (dX/dt)) − S/X
    variables: S = X_1/X; X is total acetylene conversion; C_A0 is initial acetylene concentration; r_2 and r_6
      are source rates for ethylene formation and hydrogenation loss.
    conditions: Source Eq. (15); high-conversion closure with selected intermediates neglected, not a complete
      dynamic coverage model.
  - name: algebraic hydrogen-coverage closure
    expression: θ_H = sqrt(b C_H2)/(1 + sqrt(b C_H2)); θ = 1/(1 + sqrt(b C_H2)); θ_H + θ = 1
    variables: θ_H and θ are source-model hydrogen and C2H4Z2-associated coverages; C_H2 is the source hydrogen
      concentration; b must have inverse concentration units under the chosen C_H2 basis for b C_H2 to be dimensionless.
    conditions: Algebraic closure in §4.3 accompanying the high-conversion model; the concentration basis and units
      of b are not stated in the inspected passage, and this does not specify coverage dynamics.
  assumptions:
  - The paper’s strong-adsorption/desorption and acetylene-displacement observations apply to its promoted Pd–Mn/Al2O3
    samples and test protocol.
  - The proposed key adsorbate and reaction sequence are an interpretation of the TPD, DRIFTS, QMS and kinetic data.
  - The fast irreversible formation of C2H4Z2 and hypothetical fast step 5 are model assumptions; step 5 is not
    chemically identified in the paper.
  - The piecewise low/high conversion closures use different approximations and should not be extrapolated across
    their stated regimes without checking.
  limitations:
  - This is a Pd–Mn/Al2O3 catalyst, not a PdAg catalyst or established BEP target.
  - Absence of detected desorption through a finite TPD window does not prove absolute irreversibility at all temperatures,
    pressures, coverages or times.
  - DRIFTS band assignments do not uniquely identify the proposed molecular structures or active-site ensemble.
  - The paper reports apparent fitted constants with a source-specific contact-time basis; these cannot be inserted
    into a mass-normalized packed-bed source without additional mapping.
  - Eq. (18) complete-conversion selectivities are extrapolated model estimates from comparison over X = 0.70–0.98;
    the reported b^0.5 k6/k2 values have no stated units or recovered concentration basis.
  - No periodic operation, dynamic outlet model, optimally steady comparison, or performance gain was tested.
  claim_refs:
