- id: ma_pellet_scaling
  parent: u_ma_scaling
  title: Pellet Diffusion Time and Thiele Scaling
  summary: Pellet diffusion is separate from bed Pe/Da and controls how much forcing reaches internal active volume.
  explanation: Fickian pore-diffusion time scales as radius squared over effective diffusivity. For a steady first-order
    isothermal spherical pellet, the Thiele modulus compares reaction and diffusion; it is only a screening group
    for nonlinear multicomponent acetylene hydrogenation. A steady Thiele modulus does not fully predict periodic
    penetration, especially when adsorption storage is present.
  assumptions:
  - Thiele modulus expression below assumes one steady, isothermal first-order reaction; not a general transient
    criterion.
  equations:
  - name: pellet diffusion time
    expression: τ_D ~ R_p²/D_eff
    variables: R_p is characteristic pellet radius; D_eff effective pore diffusivity.
    conditions: Order-of-magnitude Fickian scaling; geometry/storage modify it.
  - name: first-order Thiele modulus
    expression: φ = R_p√(k_v/D_eff)
    variables: k_v is first-order volumetric reaction coefficient.
    conditions: Steady, isothermal, single-reaction pellet screen.
  claim_refs:
