nodes:
- id: bep
  parent: null
  title: BEP scientific domain
  kind: root
  maturity: idea
  relevance: core
  summary: Dynamic acetylene semi-hydrogenation in a packed-bed reactor, organized around the conditional periodic-versus-optimized-steady
    question.
  explanation: The central scientific question is whether a physically realizable periodic inlet can improve a declared
    cycle-integrated ethylene objective over the best feasible steady operation. Answering it requires catalyst-specific
    reaction and surface kinetics, a transport-consistent reactor model, calibrated input and output dynamics, identifiable
    parameters, numerically verified predictions and a matched comparator. Existing literature already reports periodic
    acetylene experiments/modeling on Pd/α-Al₂O₃; no target-catalyst gain, fitted parameter set, optimized waveform
    or BEP experiment is established here.
  assumptions: []
  equations: []
  claim_refs:
  - source_id: proposal_main
    locator: Abstract; Introduction §1; Research Questions; Methodology §§3.1–3.5 (lines 107–284)
    evidence_type: proposal_hypothesis
    supports: Project question, proposed packed-bed setting, planned model and validation phases; not experimental
      proof.
  related_ids:
  - physics
  - mathematics
  - systems_control
  open_questions:
  - What exact catalyst, support, preparation, feed, geometry and operating window define the target plant?
  - Which integrated objective and matched feasible steady benchmark should be used?
  - What target data distinguish a PSSA closure from explicit dynamic surface coverages?
  status: integrated_ai_reference
  limitations: []
