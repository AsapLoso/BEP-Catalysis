- id: ma_concavity_bound
  parent: ma_average_gain
  title: Jensen Bound for a Static Concave Response
  summary: A memoryless concave response cannot gain by oscillating input at fixed mean over a convex feasible interval.
  explanation: For y=f(u) with f concave across the full admissible interval, Jensen's inequality gives average
    f(u(t)) no greater than f of the average input. Thus the constant input at that mean is at least as good for
    mean-y. The bound does not cover a nonconcave map, dynamic state, multivariable constraints, varying catalyst
    state or ratios of cycle-integrated products.
  assumptions:
  - Static memoryless map; concavity over the entire input interval; feasible mean input; objective is mean y.
  equations:
  - name: Jensen no-gain inequality
    expression: (1/T)∫₀ᵀ f(u(t))dt ≤ f[(1/T)∫₀ᵀu(t)dt]
    variables: u(t) is admissible and f is concave.
    conditions: Constant comparator is feasible at the same mean; not a bound for dynamic states or ratio metrics.
  claim_refs:
  - source_id: proposal_main
    locator: Research question and objective definitions
    evidence_type: derived_under_assumptions
    supports: Mathematical consequence under stated static-concavity assumptions.
