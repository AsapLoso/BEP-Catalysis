- id: sc_fair_steady_periodic_cycle_comparison
  parent: sc_benchmark_nesting
  title: Matched cycle-integrated periodic and steady optimum
  kind: concept
  maturity: ai_worked_out
  relevance: core
  summary: A periodic policy can be said to outperform steady operation only by comparing the same objective over
    the same physically feasible policies and catalyst state.
  explanation: For a declared net ethylene productivity score j, define the steady optimum J*_s = sup over feasible
    constant inputs of j at the corresponding steady state. Define the periodic optimum J*_p = sup over feasible
    periodic inputs of the cycle mean (1/T)∫₀ᵀj(x(t),u(t))dt subject to periodic-state closure x(T)=x(0) when a
    settled cycle is the objective. If every steady-feasible input is admissible as a constant periodic input, its
    corresponding steady state satisfies the same constraints, and both problems use the identical objective, catalyst
    condition, actuator limits and resource costs, then the periodic feasible set contains the steady set and J*_p≥J*_s.
    This is only a weak no-worse inequality, not a strict-gain result. A cycle-integrated selectivity or yield score
    is not interchangeable with net ethylene productivity. If deactivation makes the catalyst state drift, a settled
    periodic orbit may not exist; then compare matched finite-horizon campaigns or include catalyst age and lifecycle
    costs in both policies. One measured gain/phase curve or a transient kinetic fit cannot replace this optimization
    comparison. The empirical comparator and computed optimum also need separate evidence labels. Kaps et al. (2026)
    calculate steady and periodic Pareto fronts under a source kinetic model, then report an experimental periodic
    point against a steady laboratory reference using the same mean inlet molar flows. The reported productivity/yield
    differences are measured against that selected reference; they are not an experimental global sweep of all steady-feasible
    policies. A best-steady claim therefore requires a declared feasible set and objective and evidence that the
    steady optimization has been solved to the needed standard.
  assumptions:
  - The periodic comparator admits all steady-feasible policies as constant waveforms under the same constraints.
  - The same plant, catalyst state/history, objective definition, horizon convention and safety/resource costs are
    used.
  - For a settled-cycle score, all relevant states reach periodic closure; otherwise use a matched finite-horizon
    objective.
  equations:
  - name: steady optimum
    expression: J*_s = sup_{ū ∈ U_s} j(x_ss(ū),ū)
    variables: ū is a constant input; x_ss is a feasible steady state; j is the declared instantaneous score.
    conditions: Steady-state feasibility, identical state/operating constraints and fixed catalyst condition.
  - name: periodic-cycle optimum
    expression: J*_p = sup_{u(·) ∈ U_p, x(T)=x(0)} (1/T)∫₀ᵀ j(x(t),u(t)) dt
    variables: u(t) is an admissible period-T policy; x(t) includes all states that matter to the cycle objective.
    conditions: Settled periodic orbit and common cycle-integrated score; for aging use a finite horizon or an augmented
      catalyst-age model.
  - name: nested-feasible-set result
    expression: U_s ⊆ U_p  ⇒  J*_p ≥ J*_s
    variables: U_s and U_p are the steady and periodic feasible policy sets.
    conditions: Constant-waveform embedding and exactly matched objective and constraints; strict inequality is
      not implied.
  claim_refs:
  - source_id: proposal_main
    locator: Research question and Methodology §3.4 comparison plan (lines 250–263, 275–279)
    evidence_type: derived_under_assumptions
    supports: The weak no-worse result follows from feasible-set nesting when steady policies embed as admissible
      constant periodic policies under the same objective and constraints; this does not claim target gain.
  - source_id: dehghani2019_pdag_alphaal2o3
