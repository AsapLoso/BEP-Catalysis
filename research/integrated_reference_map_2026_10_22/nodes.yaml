- id: sc_benchmark_nesting
  parent: sc_baseline
  title: Feasible-Set Nesting and the No-Worse Comparator
  summary: If all steady controls are feasible periodic controls with identical scoring and constraints, the periodic
    optimum is at least the steady optimum.
  explanation: 'Let U_s be the admissible steady set and U_p the periodic set. If every steady control is represented
    by a constant periodic waveform, with identical plant, objective and constraints, U_s⊆U_p and maximization gives
    J*_p≥J*_s. This set-inclusion argument yields only a weak inequality: it does not imply strict improvement,
    practical attainability or model validity. If switching adds energy use, aging or hardware costs omitted from
    steady operation, comparability must be revised.'
  assumptions:
  - The periodic parameterization admits each feasible steady control as a constant.
  - Both regimes use identical objective, resources, catalyst state and comparison horizon.
  equations:
  - name: nested feasible-set benchmark
    expression: U_s ⊆ U_p ⇒ sup_{u∈U_p} J(u) ≥ sup_{u∈U_s} J(u)
    variables: U_s steady controls; U_p periodic controls including constants; J common objective.
    conditions: Identical plant/objective/constraints and constant embedding; weak inequality only.
  claim_refs:
  - source_id: proposal_main
    locator: Research question and §3.4 comparison plan
    evidence_type: derived_under_assumptions
    supports: Weak optimum ordering follows from set inclusion, not an empirical periodic gain.
