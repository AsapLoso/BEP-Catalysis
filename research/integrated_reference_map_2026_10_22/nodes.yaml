- id: internal_diffusion_thiele
  parent: ph_pellet_transport
  title: Intraparticle Diffusion and Thiele Modulus
  kind: concept
  maturity: ai_worked_out
  status: integrated_ai_reference
  summary: Couples intrapellet diffusion to local reaction and uses dimensionless groups or an effectiveness factor to quantify departures from intrinsic kinetics.
  explanation: >-
    For species A in an isothermal spherical pellet, a transient pore balance is ε_p ∂C_A/∂t = D_eff,A r⁻² ∂/∂r(r² ∂C_A/∂r) − r_A(C,T,θ), where r_A is positive for consumption and is expressed per pellet volume. The center has zero radial flux. With a finite gas film, the surface flux is coupled to the bulk-to-surface concentration difference; with negligible film resistance, the surface concentration is prescribed. For a steady, first-order, single irreversible reaction with constant D_eff, the Thiele modulus Φ = R_p√(k_v/D_eff) compares reaction and diffusion, and the spherical effectiveness factor is η = 3/Φ²(Φ coth Φ − 1). Here R_p is pellet radius (m), k_v is a first-order rate coefficient per pellet volume (s⁻¹), D_eff is effective diffusivity (m² s⁻¹), while Φ and η are dimensionless. For Φ≪1, η approaches one; for Φ≫1, only a near-surface region contributes strongly. Selectivity changes are network-dependent: different species diffusivities and reaction orders can raise or lower product selectivity, so acetylene starvation is a conditional mechanism, not a universal consequence of Φ>1.
  equations:
  - name: transient spherical pore balance
    expression: ε_p ∂C_A/∂t = D_eff,A r^-2 ∂/∂r(r^2 ∂C_A/∂r) - r_A(C,T,θ)
    variables: C_A in mol m^-3 pore fluid; r in m; ε_p dimensionless; D_eff,A in m^2 s^-1; r_A in mol m^-3 pellet s^-1, positive for consumption
    conditions: Spherical symmetry; center condition ∂C_A/∂r=0 at r=0; finite-film boundary D_eff,A ∂C_A/∂r|R_p = k_g,A(C_A,b-C_A,s); no-film limit prescribes C_A,s
  - name: first-order spherical Thiele modulus and effectiveness factor
    expression: Φ = R_p sqrt(k_v/D_eff); η = 3/Φ^2 (Φ coth Φ - 1)
    variables: R_p in m; k_v in s^-1 on pellet-volume basis; D_eff in m^2 s^-1; Φ and η dimensionless
    conditions: Steady, isothermal, spherical pellet; one irreversible first-order reaction; constant D_eff; uniform catalyst properties; negligible external-film resistance; surface concentration prescribed
  - name: Wheeler–Weisz internal-diffusion screen as reported by Berger et al. (2008)
    expression: η_in Φ^2 = [r_obs L^2/(D_e C_s)] [(n+1)/2] < 0.1
    variables: r_obs in mol m^-3_cat s^-1; L in m; D_e in m^2 s^-1; C_s in mol m^-3_gas; n is reaction order; η_in Φ^2 is dimensionless
    conditions: Berger Table 2 steady-state criterion; preserve source definitions and characteristic-length convention; not interchangeable with a Thiele modulus alone
  assumptions:
  - The closed-form η(Φ) applies only under the listed first-order spherical-pellet assumptions; non-linear Langmuir kinetics require solving the coupled pellet equations.
  - Bed-scale axial gradients and pellet radial gradients are separate model coordinates; a bed-only θ(z,t) state does not imply a resolved θ(z,r,t).
  limitations:
  - A large Thiele modulus does not by itself determine selectivity direction; the reaction network, component diffusivities, stoichiometry and local coverages matter.
  - No target-pellet radius, effective diffusivity, pore structure or internal concentration profile has been established.
  - Legacy tier values are not evidence of owner understanding. Historical source attachments require claim-specific verification.
  claim_refs:
  - source_id: berger2008
    locator: '§5/Table 2: general internal-transport screening through the Wheeler–Weisz parameter; not a Thiele-modulus derivation'
    evidence_type: prior_map_attachment_unverified
    supports: Berger supports pore-diffusion diagnostics but does not derive the Thiele equation or the closed-form spherical effectiveness factor above.
    review: ai_attached
  - source_id: legacy_ref_fd9889c943
    locator: Thiele modulus scaling and Weisz-Prater criterion
    evidence_type: prior_map_attachment_unverified
    supports: Historical source attachment for 'Intraparticle Diffusion & Thiele Modulus'. Claim-specific support is not inferred from the attachment alone.
    review: ai_attached
  related_ids: []
  open_questions:
  - What are the target pellet radius, pore-size distribution, porosity, tortuosity and species-specific effective diffusivities under reaction conditions?
  - Does the target require a radial pellet model, and how do intrapellet gradients alter the relative acetylene and ethylene rates?
  - Which original source supports the inherited Weisz–Prater/Thiele thresholds and the precise particle-volume or catalyst-mass basis?
  source_map_refs:
  - dataset: original_devcontainer_overlay
    source_node_id: internal_diffusion_thiele
- id: external_film_transfer
  parent: ph_pellet_transport
  title: External Gas–Particle Film Mass Transfer
  kind: concept
  maturity: ai_worked_out
  status: integrated_ai_reference
  summary: Compares bulk-to-particle-surface concentration driving force and film flux with the observed reaction demand.
  explanation: >-
    A gas film couples bulk concentration C_A,b to particle-surface concentration C_A,s through J_A = k_g,A(C_A,b − C_A,s), with inward flux positive and units mol m⁻² s⁻¹. Berger et al. (2008) cite the Carberry number for extraparticle mass transfer and print C_a = r_obs/(k_g a' C_b) < 0.05; their nomenclature defines a' as particle surface area per particle volume. Dimensional consistency additionally requires the r_obs catalyst-volume basis to match that particle-volume basis. This is distinct from the Mears criterion. The original map's Mears expression is retained as an inherited candidate formula, but Berger does not cite or derive it; its catalyst-density basis, apparent-order factor, geometry convention and 0.15 threshold still need a primary-source check. A transfer criterion is a screening approximation, not proof that film resistance is exactly zero.
  equations:
  - name: external-film molar flux
    expression: J_A = k_g,A (C_A,b - C_A,s)
    variables: J_A in mol m^-2 s^-1; k_g,A in m s^-1; C_A,b and C_A,s in mol m^-3
    conditions: Inward flux is positive when bulk concentration exceeds surface concentration; gas properties and hydrodynamics determine k_g,A
  - name: Carberry screening criterion as reported by Berger et al. (2008)
    expression: C_a = r_obs/(k_g a' C_b) < 0.05
    variables: r_obs is volumetric observed rate per catalyst volume; k_g in m s^-1; a' is specific particle surface area in m^2_particle/m^3_particle; C_b in mol m^-3_gas
    conditions: Use only with the source's definitions and compatible volumetric bases; the source's criterion is not the Mears formula
  - name: inherited Mears candidate awaiting original-source verification
    expression: M_e = |r'_A| ρ_p R_p n/(k_g C_A,b) < 0.15
    variables: Candidate form uses r'_A per catalyst mass, ρ_p catalyst mass per particle volume, R_p in m, n apparent order, k_g in m s^-1 and C_A,b in mol m^-3
    conditions: Retained provisionally from the legacy map; exact definitions, threshold and rate/density basis have not been verified against the original Mears source
  assumptions:
  - The Carberry screen assumes consistent observed-rate, external-area and bulk-concentration bases; Berger's notation a' is a prime, not a subscript zero.
  - The inherited Mears form is not considered source-verified until its original definition and applicable threshold are reopened.
  limitations:
  - An external-film screen depends on the actual particle geometry, gas properties, flow regime and measured rate basis.
  - Berger's review supports Carberry context, not the Mears equation or its 0.15 threshold.
  - No target gas-film coefficient or catalyst-plane concentration is available.
  - Legacy tier values are not evidence of owner understanding. Historical source attachments require claim-specific verification.
  claim_refs:
  - source_id: berger2008
    locator: '§5/Table 2: Carberry external mass-transfer criterion; not the Mears criterion'
    evidence_type: prior_map_attachment_unverified
    supports: Berger supports general gas-particle transfer screening through the Carberry number, but not the inherited Mears expression.
    review: ai_attached
  related_ids: []
  open_questions:
  - Which original source and exact convention support the inherited Mears equation, threshold and catalyst-density basis?
  - What particle diameter, gas properties, superficial/interstitial velocity and bed void fraction define the target Sherwood and Reynolds numbers and k_g?
  source_map_refs:
  - dataset: original_devcontainer_overlay
    source_node_id: external_film_transfer
