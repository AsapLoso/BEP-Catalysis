  - source_id: stytsenko2022
    locator: §§4.2–4.3, Eqs. (7)–(18), Figs. 6–7; printed pp. 4–6
    evidence_type: source_model_result
    supports: Study-specific apparent conversion/contact-time and selectivity/conversion equations, fitted constants
