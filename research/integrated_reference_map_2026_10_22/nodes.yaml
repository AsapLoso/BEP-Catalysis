- id: ph_pellet_transport
  parent: u_ph_transport
  title: Film and intraparticle transport
  kind: concept
  maturity: ai_worked_out
  relevance: supporting
  summary: Pellet reaction–diffusion and gas-film resistance may attenuate or phase-shift periodic concentration
    reaching internal sites.
  explanation: The proposal bed-scale source does not resolve intrapellet concentration. For an illustrative spherical
    isothermal pellet, a transient pore balance couples effective diffusion, pore storage and reaction. At r=0 impose
    symmetry; at r=R_p couple surface concentration to bulk concentration with a film coefficient. This template
    assumes homogenized effective diffusivity and local reaction expression; multicomponent diffusion, adsorption
    storage, nonspherical geometry and heat can require other models. A published pellet study is numerical and
    condition-specific; no target-catalyst limitation is established.
  assumptions:
  - Spherical homogeneous pellet and effective Fickian diffusivity are illustrative assumptions.
  - Do not combine a pellet-resolved source with an effectiveness factor representing the same transport resistance.
  equations:
  - name: transient intrapellet species balance
    expression: ∂ₜ(ε_p c_i + ρ_cat,p q_i) = (1/r²)∂ᵣ[r²D_eff,i ∂ᵣc_i] + ρ_cat,p Σ_j ν_ij r_j
    variables: ε_p pellet porosity; c_i pore-fluid concentration; ρ_cat,p catalyst mass per pellet volume; q_i adsorbed
      amount per catalyst mass; D_eff,i effective diffusivity; r_j intrinsic rate per catalyst mass.
    conditions: Spherical homogeneous pellet; q_i storage only where adsorption is represented; use dimensionally
      consistent diffusion and catalyst bases.
  - name: pellet center symmetry
    expression: ∂ᵣc_i(0,t)=0
    variables: c_i intrapellet concentration.
    conditions: Regular solution at center of spherical pellet.
  - name: external film boundary
    expression: D_eff,i ∂ᵣc_i(R_p,t)=k_f,i[c_i,bulk(t)−c_i,surface(t)]
    variables: k_f,i film mass-transfer coefficient; R_p pellet radius.
    conditions: Sign convention makes inward transfer positive when bulk exceeds surface; verify radial-flux convention.
