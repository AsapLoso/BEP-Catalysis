- id: sc_objective
  parent: u_sc_objective
  title: Cycle-integrated objective
  kind: concept
  maturity: ai_worked_out
  relevance: core
  summary: Optimize a clearly defined net product rate or yield over a settled cycle, with explicit constraints.
  explanation: A candidate productivity objective is cycle-integrated net ethylene molar flow divided by the cycle-integrated
    acetylene feed. A distinct selectivity objective divides net ethylene formed by acetylene converted. Maximizing
    time-averaged selectivity alone can favor negligible throughput, so consider productivity or a conversion constraint.
    Include startup/cycle cost if operation does not reach a periodic orbit quickly.
  assumptions:
  - Product and feed flow rates use the same molar basis.
  - The outlet analyzer and feed waveform are represented at the bed boundaries.
  equations:
  - name: net cycle yield
    expression: Y_E = ∫_0^T [F_E,out(t)−F_E,in(t)] dt / ∫_0^T F_A,in(t) dt
    variables: F_E and F_A are molar flow rates; T is one cycle.
    conditions: Evaluate after periodic convergence unless the startup campaign is the target.
  - name: constrained productivity
    expression: maximize (1/T)∫_0^T F_E,net,out(t) dt subject to X_A≥X_min and u(t)∈U
    variables: F_E,net,out=F_E,out−F_E,in; U is the feasible actuator/feed set.
    conditions: Choose matched constraints and include all relevant products.
  claim_refs:
  - source_id: proposal_main
    locator: Methodology §3.4 (lines 262–263, 275–279)
    evidence_type: derived_under_assumptions
    supports: Operationalizing the proposed ethylene-yield objective and steady comparison.
