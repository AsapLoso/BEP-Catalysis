  title: Axial Péclet number
  kind: concept
  maturity: ai_worked_out
  relevance: core
  summary: Pe compares axial convection and dispersion over a declared length scale.
  explanation: Using interstitial velocity u_i and bed length L, Pe=u_iL/D_ax. Large Pe means advection dominates
    over that length scale; small or order-one Pe means dispersion matters strongly. For time-dependent fronts,
    the relevant local length may be much shorter than L, so a bed-scale Pe alone may understate front smearing.
    The definition must match whether D_ax is based on interstitial or superficial flux.
  assumptions:
  - u_i=u_s/ε_b for the balance convention in this dataset.
  - This group does not quantify pellet diffusion.
  equations:
  - name: Péclet number
    expression: Pe = u_i L / D_ax
    variables: u_i [m s⁻¹] interstitial velocity; L [m] bed length; D_ax [m² s⁻¹].
    conditions: Use consistent axial-dispersion convention and specified L.
