- id: ma_lti_no_gain
  parent: ma_average_gain
  title: Stable Linear Systems Preserve the Mean
  summary: At periodic steady state a stable LTI plant maps mean input to mean output through its zero-frequency
    gain.
  explanation: A periodic input is a DC component plus zero-mean harmonics. A stable LTI system responds independently
    to these components; the nonzero-frequency terms average to zero over a period. Therefore linear lag/transport
    alone cannot produce a strict cycle-average gain at fixed mean input. This is a model-class limit, not a claim
    that the catalytic reactor is linear.
  assumptions:
  - Stable LTI dynamics, settled periodic response, same mean input and transfer model; no nonlinear constraints
    or input-dependent parameters.
  equations:
  - name: mean/DC relation
    expression: ȳ = G(0) ū
    variables: G(0) is zero-frequency gain; ū and ȳ are period means.
    conditions: After transients decay; vector form applies componentwise.
