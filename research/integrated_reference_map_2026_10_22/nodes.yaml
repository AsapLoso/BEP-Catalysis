- id: u_ph_catalyst
  parent: physics
  title: Catalyst identity, active sites and working-surface state
  kind: proposed_theme
  maturity: ai_worked_out
  summary: The catalyst is a working surface with site families and history; nominal bulk Pd:Ag composition alone
    does not determine a unique kinetic model.
  explanation: Pd ensemble size, Pd–Ag arrangement, support, preparation, pretreatment, adsorbed hydrogen and carbonaceous
    deposits can affect the active-site population and adsorption. Published one-site Pd/α-Al₂O₃, two-site PdAg/Al₂O₃,
    idealized PdAg surface and Pd₁Ag₃/TiO₂ studies are complementary system-specific models, not a contradiction
    resolved by choosing one universally. Slow restructuring/deactivation must be distinguished from within-cycle
    adsorbate relaxation.
  equations:
  - 'For a specified site family s: Σ_j θ_(j,s) = 1; multisite models need a balance for each family.'
  assumptions:
  - A site balance is model-specific; one vacancy fraction is not universal.
  - Static characterization constrains structure but does not alone determine transient rates.
  limitations:
  - The target BEP catalyst batch and working-surface state have not been supplied or independently characterized.
  open_questions:
  - What exact catalyst formulation, support and preparation define the BEP?
  - Do hydrogen storage, segregation, deposits or deactivation evolve on the forcing timescale?
