  - source_id: stytsenko2022
    locator: §4.1, Fig. 5, assumptions 1–4; printed pp. 3–4
    evidence_type: source_model_result
    supports: The authors propose a C2H4Z2-centered substitution network and later ethylene-hydrogenation path,
