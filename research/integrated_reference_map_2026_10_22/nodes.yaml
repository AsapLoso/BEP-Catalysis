- id: u_ph_reaction
  parent: physics
  title: Reaction network, pathways and products
  kind: proposed_theme
  maturity: ai_worked_out
  summary: Overall gas stoichiometry, catalyst-specific elementary pathways and measured products are separate levels
    of description.
  explanation: >-
    The minimal gas network C2H2 + H2 -> C2H4 and C2H4 + H2 -> C2H6 makes ethylene an intermediate and supports product accounting. It does not specify whether ethylene desorbs between hydrogen additions, whether a vinyl/ethylidene route is active, or whether C4 products and deposits occur. Evidence ranges from fitted supported-Pd kinetics to idealized Pd/PdAg KMC; each is conditional on catalyst, support, feed and method. The proposal’s claim that cycling strips ethylene before over-hydrogenation is a testable hypothesis, not a demonstrated target mechanism. A 2025 Pd study closes its reduced gas balance by neglecting secondary/C4+ routes under source-reported >85–90% carbon-balance conditions; that balance is high but incomplete and cannot justify the same omission for the BEP without matched product measurements.
  equations:
  - C2H2 + H2 → C2H4; C2H4 + H2 → C2H6 (net stoichiometry, not elementary mechanism)
  - R_g = N r (state the stoichiometric matrix and rate basis)
  assumptions:
  - The C2 sequence is a minimum accounting scaffold, not a complete catalyst mechanism.
  - Products below detection are unobserved, not necessarily absent.
  limitations:
  - A minimal C₂ network is not a complete carbon balance.
  - The accessible literature does not establish the target catalyst’s elementary route or a periodic gain.
  open_questions:
  - Which products and carbon sinks are measurable over the forcing envelope?
  - Does the target catalyst support any proposed Pd/PdAg route?
  status: integrated_ai_reference
