- id: ma_stoichiometry
  parent: u_ma_conservation
  title: Stoichiometric matrix and rate basis
  kind: concept
  maturity: ai_worked_out
  relevance: core
  summary: The stoichiometric matrix converts reaction rates into signed species sources and preserves elemental
    bookkeeping.
  explanation: For n gas species and m reactions, define ν_ij positive for products and negative for reactants.
    Gas source S_i=Σ_j ν_ij r_j. If r_j is mol reaction per catalyst mass per time, multiply by catalyst mass per
    bed volume. Elemental conservation requires the stoichiometric matrix to satisfy Aν=0 for the included species
    and reactions, where A maps species to atom counts. A truncated network that omits coke or oligomers cannot
    close the carbon balance.
  assumptions:
  - Use a complete species/reaction set for any claimed elemental closure.
  - Do not use an unsigned scalar species rate r_i where reactant sinks and product sources are needed.
  equations:
  - name: gas source vector
    expression: S = ν r
    variables: ν_ij signed stoichiometric coefficient; r_j reaction extent rate.
    conditions: Reaction rates share a declared basis; species vector contains all products needed for closure.
  - name: elemental conservation
    expression: A ν = 0
    variables: A maps species amounts to elemental inventories.
    conditions: Only for a chemically balanced reaction set including all represented species.
