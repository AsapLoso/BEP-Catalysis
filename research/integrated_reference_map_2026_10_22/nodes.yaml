- id: ph_residence_time_distribution
  parent: u_ph_transport
  title: Residence-Time Distribution and Input Propagation
  summary: The mixer and bed transform an actuator command into a distributed, delayed and attenuated concentration
    history.
  explanation: A residence-time distribution describes the spread of times experienced in continuous flow; ideal
    plug flow is one limiting case. A tracer step or pulse can characterize the inlet/mixer/bed independently of
    reactive kinetics. For linear nonreactive conditions an impulse response can be convolved with the realized
    bed-inlet signal. Reaction, changing total flow and composition-dependent hydraulics require the coupled reactor
    model. RTD and the axial-dispersion PDE are connected but not interchangeable evidence. For a stationary passive
    blender, Danckwerts also relates outlet variance to the inlet autocorrelation weighted by overlap of E with
    a delayed copy; this is transport smoothing, not a reaction-rate or yield result.
  assumptions:
  - Tracer data must use representative flow and gas properties; transfer can change with total flow or pressure.
  equations:
  - name: linear tracer input-output response
    expression: c_out(t) = ∫₀∞ h(τ)c_bed,in(t−τ)dτ
    variables: h is an impulse-response kernel at a specified operating condition; c_bed,in is composition at the
      bed boundary.
    conditions: Linear time-invariant tracer approximation; reaction and changing hydraulics require a coupled model.
  - name: outlet variance under stationary inlet fluctuations
    expression: σ_o²/σ_i² = 2∫₀∞ R(τ)G(τ)dτ;  G(τ)=∫₀∞ E(θ)E(θ+τ)dθ
    variables: R(τ) is normalized inlet-concentration autocorrelation; E(θ) is exit-age density [s⁻¹]; G(τ) is the
      overlap of E with its shifted copy [s⁻¹]; σ_i² and σ_o² are inlet/outlet concentration variances. The paper
      calls G(τ) I(τ) in Eq. (48), reusing I previously used for internal age density.
    conditions: Constant flow, fixed time-invariant E, stationary no-trend input with finite variance, passive blending
      and no reaction; source Eqs. (46)–(49).
  claim_refs:
  - source_id: danckwerts1953
    locator: Abstract
    evidence_type: source_observation
    supports: RTD describes deviations from ideal plug flow/mixing and can affect reactor performance.
