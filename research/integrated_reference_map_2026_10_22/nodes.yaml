  open_questions:
  - Which frequency/amplitude range remains resolvable at measured bed input and outlet above sensor noise?
  - What sensitivity-rank and practical-conditioning analysis fits the eventual semidiscrete target model?
  - Can actual sensors distinguish adsorption, pellet diffusion, bed residence-time and analyzer timescales?
  status: integrated_ai_reference
  limitations:
  - Periodic forcing or many samples do not guarantee a sufficient information matrix.
  - The 1994 periodic-excitation paper was reviewed only through its bibliographic record and abstract.
  - No target PE, observability or practical-estimation analysis was performed.
