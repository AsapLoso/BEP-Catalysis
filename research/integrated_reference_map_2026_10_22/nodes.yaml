- id: reaction_thermodynamics
  parent: u_ph_thermal
  title: Reaction Exothermicity & Heats of Hydrogenation
  kind: concept
  maturity: ai_worked_out
  status: integrated_ai_reference
  summary: Forward acetylene and ethylene hydrogenation release heat; local temperature rise depends on rates and heat removal, not reaction enthalpy alone.
  explanation: 'The local Larsen thesis reports ΔH₁ = −172 kJ mol⁻¹ for C₂H₂ + H₂ → C₂H₄ and ΔH₂ = −136 kJ mol⁻¹
    for C₂H₄ + H₂ → C₂H₆ (printed p. 16). These are source-reported values, not independently checked thermochemical
    data. For forward reaction rates rⱼ and enthalpies on the same reaction-progress basis, the reaction heat source
    is q̇_rxn = −Σⱼ ΔHⱼ rⱼ. Its volumetric or catalyst-mass basis follows the rate definition. Exothermicity supplies
    a heat source to the energy balance; a hotspot or thermal runaway requires coupled reaction sensitivity, heat
    capacity, heat transfer, boundary conditions and operating feedback, and is not established by ΔH alone.'
  equations:
  - name: reaction heat source
    expression: q̇_rxn = −Σ_j ΔH_j r_j
    variables: ΔH_j [J mol⁻¹ reaction]; r_j is reaction progress per matching basis and time; q̇_rxn has corresponding energy-per-basis-per-time units.
    conditions: Forward reaction rates are positive; enthalpy and rate use the same stoichiometric reaction-progress and material basis.
  assumptions: []
  limitations:
  - The Larsen values are copied as reported by a local BEP thesis and have not been independently checked against
    a thermochemical database or primary calorimetry.
  - A negative reaction enthalpy alone does not establish a hotspot, ignition, multiplicity or runaway; a coupled
    energy balance and heat-removal model with target data are required.
