  status: integrated_ai_reference
  summary: Source-scoped AI-developed distinction for surface kinetics in the initial transient reactor proposal;
    scientific validation remains open.
  explanation: 'Interpretation: provisional AI synthesis; no owner-understanding status is asserted. A non-PSSA
    mechanism may track d(theta_i)/dt from adsorption, desorption and elementary hydrogen-addition fluxes with total
    occupied + vacant site balance equal to one. Surface occupancy dynamics store H and C2Hx and may create memory
    at fixed instantaneous gas conditions.


    The legacy project scaffold evolves three occupied states but had zero default kinetic constants; the experimental
    five-coverage, seven-step bridge is an uncalibrated illustrative model. Neither can be made predictive by simply
    inserting Urmès 2019 steady effective composite constants as microscopic forward/reverse coefficients.


    Under explicit site storage, the correct gas-phase source terms use adsorption/desorption fluxes and combined
    gas+site elemental conservation, rather than applying only the PSSA net two-rate stoichiometric source vector
    at arbitrary transient coverage. Details are shared with the mathematics/balance branches.


