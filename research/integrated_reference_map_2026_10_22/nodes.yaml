- id: ph_site_ensembles
  parent: u_ph_catalyst
  title: Site Families, Ensembles and Occupancy
  summary: Elementary steps may require distinct site counts or local ensembles, making one coverage denominator
    inadequate.
  explanation: >-
    Elementary steps may require distinct site counts or local ensembles, making one coverage denominator inadequate. Dissociative H2 adsorption requires an adjacent-site pair in the elementary scheme, while hydrocarbon adsorption and reaction may use other ensembles. The 2019 Pd/α-Al2O3 fit adopts one site family for its reported conditions; the PdAg/Al2O3 study selected a two-site model among 77 expressions. Site count, family count and catalyst structure are related but not interchangeable. Alternative models must conserve sites and be discriminated by data. A 2025 Pd/α-Al2O3 study supports a single-site rate representation only for its near-atmospheric, CO-free conditions; this does not establish a universal site count or negate the catalyst-specific PdAg model.
  assumptions:
