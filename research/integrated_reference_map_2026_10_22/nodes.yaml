  - Can global gas-plus-surface carbon and hydrogen inventory be verified when coverage states store adsorbed species?
  - Do rates evaluated at cell averages adequately represent nonlinear kinetics on a coarse mesh?
  status: integrated_ai_reference
  limitations:
