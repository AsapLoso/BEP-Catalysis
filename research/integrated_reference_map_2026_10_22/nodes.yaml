- id: u_ma_periodic
  parent: mathematics
  title: Periodic orbits, mean response and no-gain limits
  kind: proposed_theme
  maturity: ai_worked_out
  summary: Periodic response and average performance depend on the attractor and objective; several model classes
    rigorously exclude a strict mean gain.
  explanation: A stable LTI plant at settled periodic response preserves the DC output for fixed mean input. A memoryless
    concave response cannot improve average output under a fixed mean input by Jensen’s inequality. If every feasible
    steady control is embedded as a constant periodic control under identical scoring and constraints, set inclusion
    guarantees only a weak no-worse optimum. Nonlinear dynamic rectification may have either sign; memory or a matching
    period alone is insufficient. Silveston et al. (1995) define a rate ratio against steady operation at the
    time-average composition and a second ratio against the maximum steady rate over composition at fixed temperature
    and pressure. These are rate criteria, not ethylene yield or selectivity metrics; the second denominator is not
    automatically the best feasible steady BEP point when flow, pressure, safety, campaign, or other constraints
    differ. Silveston et al. state that many studies reported rates above steady values under identical mean-feed
    conditions, but that comparison does not establish superiority over the maximum steady rate; their §8 also
    summarizes a historical mismatch between model predictions and experimental support. A BEP comparison must
    state one product-specific objective and use the same admissible resource and operating constraints for its
    steady and periodic cases.
  equations:
  - 'Silveston mean-composition rate ratio: ψ = r̄ / r_ss(x̄), where r̄ is the periodic time-average rate and the denominator is the steady rate at mean reactant composition'
  - 'Silveston global rate ratio: ψ* = r̄ / max_x r_ss(x; T,P), with temperature and pressure fixed'
  - 'Stable LTI: mean(y)=G(0) mean(u) at settled periodic response'
  - 'Static concave f: E[f(u)]≤f(E[u])'
  - U_s⊆U_p ⇒ max_(u∈U_p)J(u)≥max_(u∈U_s)J(u), for identical objective/constraints
  assumptions:
  - LTI result requires stability and settled periodic response.
  - Jensen requires a memoryless concave response and fixed-mean input.
  - Set inclusion requires matched resource, safety and campaign constraints.
  - Rate ratios require the numerator and denominator to use the same reaction-rate basis; the source global ratio holds temperature and pressure fixed.
  limitations:
  - These mathematical limits do not predict the target packed-bed response or a strict gain.
  - Silveston's rate ratios do not by themselves measure ethylene yield/selectivity or identify the best feasible steady BEP operating point.
  open_questions:
  - Which nonlinear memory/transport mechanisms survive target-specific tests?
  - Does periodic operation beat the optimized steady point after uncertainty and actuator limits?
  status: integrated_ai_reference
