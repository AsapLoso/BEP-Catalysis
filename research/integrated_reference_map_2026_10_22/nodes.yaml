- id: ma_conservative_finite_volume
  parent: u_ma_numerics
  title: Conservative finite-volume balance for a packed-bed cell
  kind: concept
  maturity: ai_worked_out
  relevance: core
  summary: Integrating the bed PDE over each cell produces a flux-difference ODE whose sum telescopes to inlet minus
    outlet flux plus total reaction production.
  explanation: For ε_b ∂_t C_i + ∂_z J_i = S_i, integrate over cell k with width Δz and approximate C_i,k as a cell
    average. With constant ε_b in that cell, ε_b Δz dC_i,k/dt = J_i,k−1/2 − J_i,k+1/2 + Δz S_i,k. Neighboring internal
    face fluxes cancel when cell balances are summed, leaving the boundary flux difference plus the integrated reaction
    source. This discrete conservation identity depends on using one shared numerical flux at each face; separately
    discretizing advection and dispersion without a consistent face flux can break it. A method-of-lines implementation
    then forms M_h ẏ = F_h(y,u,t), coupled to local coverage ODEs or to algebraic PSSA constraints. The identity
    is a verification property of the discretization, not proof that the kinetic or transport model represents the
    catalyst.
  assumptions:
  - One-dimensional finite-volume cells and a consistent conservative face flux.
  - ε_b and Δz are constant within the displayed cell; variable porosity is represented by integrating ε_b C_i over
    the cell.
  - Rate r_j is mol per catalyst mass per second and ρ_p is catalyst mass per pellet-envelope volume; if density
    is per bed volume, do not multiply by (1−ε_b) again.
  - Boundary face fluxes use the selected physical boundary/domain model.
  equations:
  - name: bed-volume component balance
    expression: ε_b ∂_t C_i + ∂_z J_i = S_i
    variables: C_i [mol m⁻³ void]; J_i [mol m⁻² s⁻¹]; S_i [mol m⁻³ bed s⁻¹].
    conditions: Conservative one-dimensional balance under the stated bed-volume accumulation basis.
  - name: finite-volume cell balance
    expression: ε_b Δz dC_i,k/dt = J_i,k−1/2 − J_i,k+1/2 + Δz S_i,k
    variables: ε_bΔz C_i,k [mol m⁻²]; face flux [mol m⁻² s⁻¹]; ΔzS_i,k [mol m⁻² s⁻¹].
    conditions: Shared flux on each cell face; rightward flux is positive.
  - name: global telescoping balance
    expression: d/dt Σ_k(ε_b Δz C_i,k) = J_i,in − J_i,out + Σ_k Δz S_i,k
    variables: Areal gas inventory [mol m⁻²]; boundary component fluxes [mol m⁻² s⁻¹].
    conditions: Fixed cell widths and bed void fraction; use exact cell-integrated accumulation for nonuniform/variable
      porosity.
  claim_refs:
  - source_id: proposal_main
    locator: Methodology §3.1, gas-phase accumulation, transport and source equation (lines 180–185)
    evidence_type: derived_under_assumptions
    supports: The conservative cell and global balance follow by integrating the proposal's continuum species balance
      over finite cells using a shared face-flux convention.
  - source_id: di_giuliano_pellegrino2019
    locator: Methods §§3.1–3.2
    evidence_type: source_model_result
    supports: The source demonstrates a method-of-lines reduction of a transient axial-dispersion packed-bed model
      to spatially discretized ODEs; its own spatial scheme is central finite differences with ghost-point boundary
      treatment, not the finite-volume scheme derived here.
  related_ids:
  - ma_gas_pde
  - ph_axial_balance
  - ph_danckwerts
  - ma_surface_balance
  - ma_numerical_checks
  - ma_numerical_stability
  open_questions:
