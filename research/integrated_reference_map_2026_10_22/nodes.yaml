- id: ma_explicit_transport_step_bound
  parent: u_ma_numerics
  title: Explicit transport stability and positivity limits
  kind: concept
  maturity: ai_worked_out
  relevance: core
  summary: For a stated upwind-advection/centered-diffusion scheme, an explicit step bound follows from nonnegative
    update weights; the full reactor adds reaction and coverage time scales.
  explanation: For scalar linear transport with constant positive velocity u, constant dispersion D, a uniform mesh
    and forward Euler in time, first-order upwind advection and centered second-order diffusion give a three-point
    update. Let Co = u Δt/Δz and Fo = D Δt/Δz². If Co+2Fo≤1, the three transport weights are nonnegative and sum
    to one; this is a sufficient monotonicity/positivity condition for this scalar transport update. It is not a
    universal stability criterion for nonuniform meshes, variable flow, a nonlinear reaction network, or a surface-coverage
    DAE. Reaction eigenvalues, adsorption timescales, boundary treatment and discontinuous inputs add restrictions.
    Di Giuliano and Pellegrino report severe explicit-Euler step requirements for their own semi-discrete carbonation
    model, illustrating why a spatial refinement can make an explicit time method costly; their reported solver
    behavior does not establish the BEP stiffness ratio or solver choice.
  assumptions:
  - Scalar linear advection-diffusion equation; u>0; uniform grid; constant u and D.
  - First-order upwind convective derivative, second-order centered diffusion derivative, forward Euler time update.
  - The displayed condition concerns nonnegative transport update weights, not accuracy or all eigenvalue stability
    limits.
  equations:
  - name: dimensionless explicit transport numbers
    expression: Co = u Δt/Δz;   Fo = D Δt/(Δz)²
    variables: u [m s⁻¹]; Δt [s]; D [m² s⁻¹]; Δz [m]; Co and Fo are dimensionless.
    conditions: Uniform one-dimensional mesh and constant coefficients.
  - name: explicit upwind-central update and sufficient positivity condition
    expression: C_i,k^(n+1) = (Co+Fo) C_i,k−1^n + (1−Co−2Fo) C_i,k^n + Fo C_i,k+1^n;   Co+2Fo ≤ 1
    variables: C_i,k^n is the concentration at cell/node k and time step n.
    conditions: Scalar transport-only update with positive u and D; a reaction source requires separate positivity/stability
      analysis.
  claim_refs:
  - source_id: proposal_main
    locator: Methodology §3.2, candidate upwind spatial scheme and temporal integration plan (lines 202–208)
    evidence_type: derived_under_assumptions
    supports: The explicit coefficient condition is derived for the proposal's candidate upwind-type transport discretization;
      it is not a reported proposal equation.
  - source_id: di_giuliano_pellegrino2019
    locator: Methods §3.2, explicit Euler stability discussion; Results and Conclusions
    evidence_type: source_model_result
    supports: The authors report severe time-step constraints for explicit Euler on their own semidiscrete carbonation
      case and use another ODE integration strategy for the reported comparison.
  related_ids:
  - ma_MOL
  - ma_convection_scheme
  - ma_stiff_solver
  - ma_numerical_stability
  - ma_numerical_checks
  open_questions:
