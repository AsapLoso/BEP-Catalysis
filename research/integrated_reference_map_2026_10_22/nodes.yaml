- id: c1_borodzinski_ae_site_hypothesis
  parent: ph_mechanism_choice
  title: Deposit-associated A and E site-family hypothesis
  kind: concept
  maturity: ai_worked_out
  status: integrated_ai_reference
  summary: Borodziński and Cybulski's 2000 two-family A/E model explains source-specific rate patterns through narrow
    acetylene-selective and larger competitive site classes; the deposit-created physical geometry is a hypothesis
    inferred from kinetics.
  explanation: 'Borodziński and Cybulski measured acetylene–ethylene hydrogenation rates over a commercial Pd/α-Al₂O₃
    catalyst in a gradientless reactor and proposed two effective site families for that system. A sites are modeled
    as narrow spaces associated with carbonaceous deposits: acetylene and hydrogen can occupy them, while ethylene
    is sterically excluded. The paper combines earlier A1 and A2 proposals into A sites; it does not preserve A1
    competitive hydrogen adsorption and A2 hydrogen transfer as two separately estimated populations. E sites are
    larger spaces where acetylene, ethylene, and hydrogen compete; ethylene hydrogenation is assigned mainly to
    E sites.


    The measured kinetic signatures motivating the model include a maximum of acetylene disappearance and C₄ formation
    versus acetylene partial pressure, little or no measured ethylene-pressure effect on those two rates over the
    reported tests, and an ethylene-pressure effect on ethane formation. The model attributes the first two channels
    principally to A-site chemistry and ethylene-to-ethane hydrogenation to E sites. It includes routes for direct
    acetylene-to-ethane, acetylene-to-ethylene by Langmuir–Hinshelwood addition, acetylene-to-ethylene by hydrogen
    transfer from carbonaceous deposits, and hydro-oligomerization to C₄ products.


    This is a catalyst- and data-conditioned mechanistic model, not a universal description of palladium. In this
    study the carbonaceous-deposit explanation and A/E populations are inferred through rate behavior and a fitted
    kinetic model; the reported site coverages are calculated model outputs, not direct coverage measurements. A
    2019 study selected a one-site PSSA closure for 0.05 wt% Pd/α-Al₂O₃ under its tail-end conditions and reported
    no detected C₄ products there. These different closures are not a direct contradiction: their catalyst preparation,
    feed regime, reaction set, observed channels, and candidate model families differ.


    The authors'' regression comparison favored their model among the four comparator equations they tested (Table
    2 reports the largest F_c value for their model), while explicitly cautioning that this is not decisive proof
    of full adequacy because other untested models could describe the data equally well or better. Two fitted parameter
    pairs remained correlated above 0.8. Therefore, the reported ranking supports adequacy within that experiment
    and candidate set; it does not uniquely identify microscopic sites or justify transfer to PdAg, another support,
    or periodic BEP operation.

    '
  equations: []
  assumptions:
  - A/E are effective site-family labels in a kinetic model; they are not direct measurements of crystallographic
    site counts.
  - The model attributes surface heterogeneity to carbonaceous deposits and groups A1/A2 behavior into one fitted
    A family.
  - Candidate-model ranking is conditional on the measured outputs, weights, fitted parameters, and comparator set.
  limitations:
  - The study concerns a commercial Pd/α-Al₂O₃ catalyst and acetylene–ethylene mixtures, not an identified BEP PdAg
    batch.
  - Calculated A/E coverages are not operando coverage measurements; causal deposit-induced site geometry is not
    established by this kinetic fit alone.
  - A conflicting acetylene-pressure range appears in the article's results text versus Table 3/Fig. 6 and remains
    open.
  - The authors report two parameter correlations above 0.8 and state that the model comparison is not decisive
    proof of a unique mechanism.
  claim_refs:
  - source_id: borodzinski2000
    locator: Full article, printed p. 55, Figs. 2–3 and §3.2; printed pp. 56–58, §§3.3–3.4
    evidence_type: source_observation
    supports: Under the reported commercial Pd/α-Al₂O₃ tests, acetylene disappearance and C₄ formation display maxima
      versus acetylene pressure and little ethylene-pressure dependence, while ethane formation responds to ethylene;
      these rate patterns motivate, but do not directly image, A/E site families.
  - source_id: borodzinski2000
    locator: Full article, printed pp. 59–62, Table 2 and §§3.5–3.7
    evidence_type: source_model_result
    supports: The proposed A/E model had the highest reported F_c among the four comparator equations fitted to
      the source data; the authors note this is not decisive proof and report parameter correlations above 0.8.
  related_ids:
