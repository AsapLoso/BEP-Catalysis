- id: ph_boundary_model_interpretations
  parent: ph_danckwerts
  title: Boundary conditions depend on the modeled external domain
  kind: concept
  maturity: ai_worked_out
  relevance: core
  summary: Flux matching at the bed face is a conservation statement; selecting a Danckwerts or revised boundary
    closure also encodes assumptions about the upstream and downstream domains.
  explanation: The standard inlet condition u_s C_i,in = J_i(0) equates the imposed upstream convective feed flux
    to the bed's convective-plus-dispersive flux. A commonly used outlet condition ∂_zC_i(L)=0 assumes the downstream
    side is convective with negligible return dispersion in the chosen model. If tubing, a mixing volume, a valve,
    a catalyst-free section, or an analyzer line is part of the physical system, its balance may be included explicitly
    or represented by a coupled interface condition. Mott and Green's publisher abstract proposes revised conditions
    requiring concentration continuity and flux conservation at both boundaries and reports different hypothetical
    concentration profiles for a serpentine-reactor example. Because only the abstract was accessible, the proposed
    equation and its applicability cannot be independently checked here. Thus the proposal's phrase Danckwerts-type
    does not by itself identify a unique physical boundary model.
  assumptions:
  - Flux continuity assumes no interfacial accumulation, reaction, or selective membrane at the modeled interface.
  - A zero-gradient exit is a closure for a selected external-domain idealization, not a universal consequence of
    conservation.
  - A finite upstream mixer or downstream analyzer volume may require separate dynamic states.
  equations:
  - name: interface component-flux matching
    expression: J_i,left = J_i,right
    variables: J_i,left and J_i,right are the component molar fluxes on the two sides of a chosen interface [mol
      m⁻² s⁻¹].
    conditions: No interfacial accumulation, reaction, or selective transfer; apply with the actual flux law on
      each side.
  - name: two-domain inlet and outlet matching
    expression: J_i,upstream(0⁻,t) = J_i,bed(0⁺,t);   J_i,bed(L⁻,t) = J_i,downstream(L⁺,t)
    variables: Each J includes the convective and dispersive contributions used in that domain.
    conditions: A domain-coupling alternative to imposing an isolated-bed boundary condition; exterior states must
      be measured or modeled.
  claim_refs:
  - source_id: proposal_main
    locator: Methodology §3.1 (line 185)
    evidence_type: proposal_hypothesis
    supports: The proposal selects Danckwerts-type boundary conditions but does not specify the external-domain
      equations or write the inlet/outlet formulas.
  - source_id: mott_green2015
    locator: Publisher abstract
    evidence_type: source_model_result
    supports: The authors propose revised boundary conditions framed around concentration continuity and flux conservation
      at both faces and describe hypothetical calculations showing differing profiles; full equations and derivation
      were not accessed.
  related_ids:
