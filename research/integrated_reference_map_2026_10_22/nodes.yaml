- id: u_sc_excitation
  parent: systems_control
  title: Periodic excitation and kinetic discrimination
  kind: proposed_theme
  maturity: ai_worked_out
  summary: Dynamic excitation can discriminate models and estimate parameters; identification value and production
    performance are separate questions.
  explanation: Periodic inputs vary amplitude, period, waveform, phase and manipulated components. They can probe
    relaxation modes and parameter combinations, but actuators and transport reshape them before they reach the
    bed. Square waves, piecewise controls, splines and Fourier series have different bandwidth, event and approximation
    tradeoffs; no representation is categorically invalid. Silveston et al. distinguish forcing strategy from cycle
    variables, describe quasi-steady and fast-cycling limits, and note that pulsed operation can reveal mechanisms
    before cycle-invariant response; that review-level rationale is not a formal identifiability result. The direct
    acetylene periodic precedent uses a different Pd/α-Al₂O₃ system and accessible abstract-level scope.
  equations:
  - 'Two-level input mean: δu_H+(1−δ)u_L, with both levels and duty fraction stated.'
  assumptions:
  - Command and bed-plane waveforms may differ.
  - Excitation quality is judged against discrimination and observation limits.
  limitations:
