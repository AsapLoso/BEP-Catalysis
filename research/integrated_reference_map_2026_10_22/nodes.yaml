- id: ph_metrics
  parent: ph_reaction_network
  title: Conversion, selectivity and yield
  kind: concept
  maturity: ai_worked_out
  relevance: core
  summary: Cycle productivity, conversion, selectivity and yield answer different questions and require explicit
    flow and carbon accounting.
  explanation: For a C₂ feed with acetylene A, define cycle conversion X_A = ∫(F_A,in−F_A,out)dt / ∫F_A,in dt and
    net ethylene selectivity S_E = ∫(F_E,out−F_E,in)dt / ∫(F_A,in−F_A,out)dt when the denominator is positive and
    accounting is complete. Their product is cycle yield Y_E on this basis. A ratio of integrated amounts is generally
    not the time-average of instantaneous selectivity. Net ethylene production subtracts inlet ethylene; productivity
    additionally needs a declared catalyst-mass or reactor-volume basis. A selectivity maximum alone may reward
    low throughput.
  assumptions:
  - C₂ feed basis and product identity are stated; other carbon products are accounted for or reported as unclosed.
  - Cycle metrics use settled periodic flow integrals; startup performance is separate.
  equations:
  - name: cycle-integrated acetylene conversion
    expression: X_A = ∫₀ᵀ(F_A,in−F_A,out)dt / ∫₀ᵀF_A,in dt
    variables: F_A,in and F_A,out are molar flow rates; T is one cycle.
    conditions: Positive integrated acetylene feed; same molar basis and integration window.
  - name: cycle-integrated net ethylene selectivity
    expression: S_E = ∫₀ᵀ(F_E,out−F_E,in)dt / ∫₀ᵀ(F_A,in−F_A,out)dt
    variables: F_E,in/out and F_A,in/out are molar flow rates.
    conditions: Positive net acetylene consumption; define carbon products and measurement corrections.
  - name: cycle yield identity on acetylene feed basis
    expression: Y_E = X_A S_E = ∫₀ᵀ(F_E,out−F_E,in)dt / ∫₀ᵀF_A,in dt
    variables: Net ethylene yield per mole of acetylene fed.
    conditions: Algebraic identity from the two preceding integrated definitions; not an independent selectivity
      definition.
  claim_refs:
  - source_id: proposal_main
    locator: Abstract; §§3.4–3.5 (lines 257–284)
    evidence_type: proposal_hypothesis
    supports: Proposal intends an ethylene objective and steady/dynamic comparison; denominator and closure need
