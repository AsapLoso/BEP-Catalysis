- id: ph_lh_rates
  parent: ph_surface_states
  title: Elementary Rates and Langmuir–Hinshelwood Reduction
  summary: A kinetic rate law follows from elementary steps plus explicit site-balance, quasi-equilibrium and rate-determining-step
    assumptions.
  explanation: For a lattice mechanism, a surface-reaction rate may be proportional to the product of reactant coverages;
    dissociative adsorption introduces a different hydrogen-pressure dependence through free-site pairs. If adsorption
    is assumed at quasi-equilibrium, coverages can be eliminated into a Langmuir–Hinshelwood form. The reduction
    changes with multiple site families, adsorbate blocking, non-ideal interactions or dynamic coverage. These are
    symbolic examples, not a fitted BEP mechanism.
  assumptions:
  - Illustrative ideal single-site lattice; temperature and pressure are local.
  - Forward elementary-rate form only; a reversible net rate needs reverse terms and thermodynamic consistency.
  equations:
  - name: illustrative surface step
    expression: r_s = k_s θ_A θ_H
    variables: θ_A and θ_H are adsorbed acetylene-like and H fractions; k_s is a surface-step coefficient.
    conditions: Illustrative mass action when species occupy compatible sites; not a universal acetylene rate law.
  - name: illustrative dissociative adsorption equilibrium
    expression: θ_H/θ_* = (K_H p_H₂)^(1/2)
    variables: θ_* is vacant fraction; K_H is dimensionally consistent.
