- id: u_sc_feasibility
  parent: systems_control
  title: Feasibility, robustness and evidence ladder
  kind: proposed_theme
  maturity: ai_worked_out
  summary: A predicted optimum is relevant only if the realized waveform, catalyst history, process limits and validation
    protocol are feasible.
  explanation: Constraint sets may include component flows, total flow, H₂/acetylene ratio, valve/MFC bandwidth
    and slew, pressure, temperature, catalyst aging, safety interlocks and analyzer resolution. Periodic benefit
    is a hypothesis until a target-specific model and measured bed input are tested against a matched optimized
    steady baseline. Calibration, held-out prediction and performance experiments are separate evidence stages.
    Silveston et al. describe added operational complexity and cost, switching arrangements, pressure-surge concerns,
    and mixing distortion in specific historical apparatus; those examples motivate measuring the realized waveform
    but do not supply the BEP hardware envelope.
  equations:
  - U_p should encode amplitude, mean feed, flow, pressure, slew, temperature and safety; U_s uses compatible resource
    accounting.
  assumptions:
  - Operating limits and uncertainty distributions are target-specific.
  - Evidence stages answer different questions and are not interchangeable.
  limitations:
