- id: ph_axial_balance
  parent: u_ph_transport
  title: Axial convection–dispersion and reaction source
  kind: concept
  maturity: ai_worked_out
  relevance: core
  summary: A species balance combines accumulation, axial flux divergence and a stoichiometric reaction source.
  explanation: With C_i in mol m⁻³ of gas void, u_s in m s⁻¹ superficial velocity, ε_b dimensionless bed void fraction,
    D_ax in m² s⁻¹ under the flux convention below, ρ_p in kg catalyst m⁻³ pellet, and r_j in mol reaction kg_cat⁻¹
    s⁻¹, a conservative bed-volume balance is ε_b∂tC_i+∂z(u_s C_i)=∂z(ε_bD_ax∂zC_i)+(1−ε_b)ρ_pΣ_jν_ijr_j. Products
    have positive ν; reactants negative. For constant ε_b, u_s and D_ax, division by ε_b gives an interstitial-velocity
    form with u_i=u_s/ε_b. The proposal's r_i must therefore be interpreted as a signed species source or expanded
    through a stoichiometric matrix.
  assumptions:
  - C_i is defined per gas void volume; u_s is superficial, not interstitial.
  - ρ_p is per catalyst-pellet volume; a bulk-bed catalyst density may be used instead if its definition replaces
    (1−ε_b)ρ_p.
  - No pellet effectiveness factor or radial variation is supplied in the core equation.
  equations:
  - name: conservative gas species balance
    expression: ε_b ∂C_i/∂t + ∂(u_s C_i)/∂z = ∂[ε_b D_ax,i ∂C_i/∂z]/∂z + (1−ε_b) ρ_p Σ_j ν_ij r_j
    variables: C_i [mol m⁻³ void]; ε_b [1]; u_s [m s⁻¹ bed area]; D_ax,i [m² s⁻¹]; ρ_p [kg_cat m⁻³ pellet]; r_j
      [mol kg_cat⁻¹ s⁻¹].
    conditions: 1D cross-sectional averaging; consistent flux convention; constant bed properties only when simplified;
      ν_ij product-positive.
  claim_refs:
  - source_id: proposal_main
    locator: Methodology §3.1, Eq. at lines 180–185
    evidence_type: derived_under_assumptions
    supports: A dimensionally explicit conservative form derived from the proposal's intended advection–dispersion/source
      balance; this is a clarified formulation, not a verbatim proposal equation.
