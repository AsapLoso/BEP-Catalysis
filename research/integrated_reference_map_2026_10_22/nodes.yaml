- id: ma_average_gain
  parent: u_ma_periodic
  title: Conditions for a Periodic Average Gain
  kind: theme
  relevance: core
  summary: A strict gain requires favorable nonlinear/dynamic response after matching the benchmark; periodicity
    alone is not a mechanism.
  explanation: 'Stable LTI plants preserve the mean/DC relation at fixed mean input, and a static concave response
    cannot gain by oscillating about its mean. Neither case covers a general nonlinear stateful reactor. Surface/transport
    lag can rectify oscillations into a DC shift, but the sign depends on higher-order dynamics and cross-coupling.
    Classical theory supplies conditional sufficient tests, not an acetylene-specific guarantee. A full-text ethane-ODH
    profile-reactor study supplies a useful counterexample: its nonlinear catalyst-state model and periodic parameter
    sweep predicted no mean-performance change in the tested range, and experiments reported stable averaged conversion/selectivity.
    It is a distinct oxidation system and illustrates a model-specific null result, not a universal no-gain theorem.'
  claim_refs:
