- id: u_ph_thermal
  parent: physics
  title: Energy balance, thermal dynamics and catalyst evolution
  kind: proposed_theme
  maturity: ai_worked_out
  summary: The isothermal baseline removes thermal states; exothermicity alone does not establish a hot spot or
    the adequacy of that reduction.
  explanation: A non-isothermal extension couples heat storage, axial and interphase transport, reaction enthalpy
    and heat removal to temperature-dependent rates. Thermal pulsing of Pt for CO oxidation is a different stimulus/reaction/catalyst
    and does not establish acetylene concentration-pulse kinetics. Isothermal adequacy must be assessed from target
    temperature histories and rate sensitivity; safety limits require apparatus-specific evidence.
  equations:
  - C_eff ∂T/∂t + heat transport = heat exchange + (−ΔH_r) r (schematic; consistent basis required)
  assumptions:
  - Isothermal operation is a comparison model, not established target behavior.
  - Thermal and aging states can be omitted only when their effects and timescales are bounded.
  limitations:
  - No BEP temperature trajectories, heat-transfer coefficients or verified thermal operating envelope are supplied.
  open_questions:
  - Are temperature oscillations material to kinetic sensitivity and selectivity margins?
  - Should productivity include aging and utility costs over repeated cycles?
  status: integrated_ai_reference
