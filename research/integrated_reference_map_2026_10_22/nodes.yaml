- id: centered_arrhenius
  parent: lhhw_kinetics
  title: Centered Arrhenius parameterization
  kind: concept
  maturity: ai_worked_out
  status: integrated_ai_reference
  summary: Re-centering the Arrhenius law at a reference temperature is an exact algebraic reparameterization; it
    does not guarantee identifiable parameters.
  explanation: For k(T)=A exp(−E_a/(RT)), define k_ref=k(T_ref). Then k(T)=k_ref exp[−E_a/R(1/T−1/T_ref)]. T and
    T_ref are in kelvin; E_a and R must share energy units. The conversion A=k_ref exp(E_a/(RT_ref)) is required
    before substituting an uncentered pre-exponential. Centering can improve parameter scaling and interpretation
    but cannot remove structural non-identifiability or a correlation caused by the experimental range/noise. The
    formula is derived from Arrhenius algebra; the old Berger DOI was incorrect and is not the evidence for the
    identity.
  equations:
  - name: centered Arrhenius law
    expression: k(T)=k(T_ref) exp[−E_a/R (1/T−1/T_ref)]
    variables: k has the same units as k(T_ref); T,T_ref in K; E_a in J mol⁻¹; R in J mol⁻¹ K⁻¹.
    conditions: Equivalent to k=A exp(−E_a/(RT)) only when A=k(T_ref)exp(E_a/(RT_ref)).
  assumptions: []
  limitations:
  - This identity does not establish a target activation energy or cure parameter correlation.
  - The historical Berger DOI attached to this node identified an unrelated paper; the corrected Berger source is
    not needed to derive the identity.
  claim_refs:
  - source_id: proposal_main
    locator: Methodology §3.1, temperature dependence discussion
    evidence_type: derived_under_assumptions
    supports: Algebraic equivalence of centered and pre-exponential Arrhenius forms; no catalyst parameter values.
    review: ai_attached
  related_ids: []
  open_questions:
  - 'Select optimal reference temperature T0 (candidate: 313 K / 40 °C matching Larsen benchmark).'
