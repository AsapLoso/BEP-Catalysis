- id: u_sc_objective
  parent: systems_control
  title: Cycle metric and optimized steady benchmark
  kind: proposed_theme
  maturity: ai_worked_out
  summary: Define net product, yield, selectivity or productivity and compare periodic operation against the best
    feasible steady control on the same basis.
  explanation: A cycle-integrated ratio uses integrated molar amounts and subtracts inlet ethylene. It is not generally
    the average of instantaneous selectivity. An arbitrary nominal steady point cannot establish a gain; optimize
    the steady comparator over the same catalyst, feed, hardware, safety and resource constraints. Set inclusion
    gives weak mathematical ordering only when every steady control is feasible as a constant periodic waveform
    under identical scoring.
  equations:
  - N_E,net=∫(F_E,out−F_E,in)dt; N_A,cons=∫(F_A,in−F_A,out)dt
  - S_E=N_E,net/N_A,cons under a stated carbon/selectivity convention; productivity=N_E,net/(m_cat T)
  assumptions:
  - Both cases use matched feed, conversion, pressure, thermal, safety and campaign constraints.
  - Integrate after a declared periodic-orbit/startup criterion.
  limitations:
  - The primary performance metric, conversion floor, campaign horizon and added cycling costs are project decisions.
  open_questions:
