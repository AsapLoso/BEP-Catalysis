- id: ph_energy_balance
  parent: u_ph_thermal
  title: Packed-Bed Energy Balance as an Extension
  summary: A non-isothermal model couples thermal storage, axial transport, heat of reaction and heat removal to
    temperature-dependent kinetics.
  explanation: A local-thermal-equilibrium pseudo-homogeneous balance can screen temperature feedback before a two-temperature
    gas/solid or pellet model is justified. Heat release and wall/coolant exchange can create phase-shifted thermal
    histories under composition forcing. This is a derived template requiring measured heat capacities, enthalpies,
    transfer coefficients and boundary conditions; it is not asserted necessary for the selected BEP regime.
  assumptions:
  - One-dimensional bed and local gas/solid thermal equilibrium; constant effective properties and declared catalyst
    density per bed volume.
  - Axial conduction and wall exchange are lumped; radial pellet gradients are omitted.
