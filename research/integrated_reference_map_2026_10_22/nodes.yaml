- id: ma_fisher_information_model_based_design
  parent: ma_sensitivity
  title: Fisher information and model-based experiment design
  kind: concept
  maturity: ai_worked_out
  relevance: core
  summary: Weighted output sensitivities define local parameter information; experiment design can target precision
    without optimizing reactor performance.
  explanation: Let μ(θ;d) be the vector of model-predicted measured means for parameters θ and experiment design
    d (operating trajectory, sample times, selected outputs and run duration). Under additive zero-mean Gaussian
    errors with fixed known covariance Σ, y=μ+ε and the local expected Fisher information is F=JᵀΣ⁻¹J, J=∂μ/∂θ.
    For independent measurements, this is the sum of sensitivity outer products weighted by inverse variance. Under
    regularity conditions F⁻¹ approximates local covariance; the Cramér–Rao inequality bounds covariance for unbiased
    estimators, not a guarantee that a nonlinear fit attains that bound. Singular F exposes a locally uninformative
    parameter direction; poor conditioning signals weak practical precision but depends on units and parameter scaling.
    D-optimality maximizes log det F (or minimizes det F⁻¹), A-optimality minimizes tr(F⁻¹), and E-optimality maximizes
    the least eigenvalue after parameter scaling. These criteria target different uncertainty summaries; D-optimality
    minimizes local confidence-ellipsoid volume, not every parameter variance or prediction error. Waldron et al.
    used a weighted sensitivity/Fisher approximation and bounded ramp-design optimization for homogeneous benzoic-acid/ethanol
    esterification in a PFR. The study found higher precision for its designed transients than its compared intuitive
    ramps and showed predictions of additional experiments, but warned that nominal designs depend on initial parameter
    estimates and can be suboptimal when these are uncertain. For the BEP, F must use the realized bed-plane input,
    declared measured-output and analyzer-noise model, and a candidate kinetic model. Parameter-precision design,
    discrimination among mechanisms and maximizing production are distinct design objectives. Robust design should
    account for unresolved catalyst models and parameter uncertainty rather than treating one fitted model as certain.
  assumptions:
  - Differentiable model-predicted means near the nominal parameters/design.
  - The displayed FIM equation assumes zero-mean Gaussian measurement error with fixed known covariance; parameter-dependent
    noise requires additional information terms.
  - Inverse-FIM covariance is a local approximation under regularity and nonsingular F; finite nonlinear estimates
    may be biased, multimodal or poorly approximated.
  - Feasible design must include feed, actuator, safety, pressure, temperature, sampling and analyzer constraints.
  equations:
  - name: Gaussian-observation Fisher information
    expression: y = μ(θ;d)+ε, ε∼N(0,Σ); F(θ;d) = JᵀΣ⁻¹J, J=∂μ/∂θ
    variables: y and μ are measurement vectors; θ unknown parameters; d the experimental design; Σ measurement covariance;
      J the output-sensitivity matrix.
    conditions: For independent errors, F=Σᵢ σᵢ⁻²(∂μᵢ/∂θ)(∂μᵢ/∂θ)ᵀ; covariance units must match each measured output.
  - name: local covariance and design summaries
    expression: 'Cov(θ̂) ≈ F⁻¹; D-opt: maximize log det F; A-opt: minimize tr(F⁻¹); E-opt: maximize λ_min(F_scaled)'
    variables: F inverse is in chosen parameter coordinates; F_scaled uses explicit dimensionless parameter scaling.
    conditions: Local/asymptotic precision criteria; different criteria encode different design goals.
  claim_refs:
  - source_id: waldron2020_transient_flow_mbdoe
    locator: Full text §§2–3, equations (16)–(21)
    evidence_type: source_model_result
    supports: The article forms a weighted sensitivity/Fisher information approximation for local parameter covariance
      and optimizes a bounded transient design with a D-optimal criterion.
  - source_id: waldron2020_transient_flow_mbdoe
    locator: Full text §§4–5, parameter estimates and validation results
    evidence_type: source_model_result
    supports: In its homogeneous esterification PFR case study, designed transient ramps gave more precise parameter
      estimates than the compared intuitive designs and were used to predict additional experiments; no heterogeneous
      acetylene transfer is established.
  - source_id: villaverde2016_structural_identifiability
    locator: 'Methods and Discussion: structural versus practical identifiability'
    evidence_type: review_synthesis
    supports: Ideal structural uniqueness is distinct from finite, noisy-data practical precision.
  - source_id: proposal_main
    locator: Methodology §3.4 and proposed model-identification phases
    evidence_type: derived_under_assumptions
    supports: The BEP proposal includes transient model calibration; no target information matrix or precision result
      is asserted.
  related_ids:
  - ma_identifiability
  - sc_periodic_frequency_response_identification
  - sc_persistent_excitation_condition
  - sc_co_design
  - sc_fair_steady_periodic_cycle_comparison
  open_questions:
  - Which bed-plane inputs, outlet analytes and noise covariances are actually available?
  - Which parameters or combinations are identifiable under each candidate target catalyst mechanism?
  - Should a target campaign estimate parameters, discriminate competing mechanisms, or robustly reduce uncertainty
    across models?
  - How much design information survives actuator, bed residence-time and analyzer filtering?
  status: integrated_ai_reference
  limitations:
  - No BEP sensitivity matrix, FIM, confidence region, posterior, or optimal experiment was computed.
  - Information precision for one model does not establish that the model structure or mechanism is correct.
  - Waldron et al. studied homogeneous esterification; no parameter or performance result transfers to acetylene
    hydrogenation.
