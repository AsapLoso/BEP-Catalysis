    source partial pressures P_i in Pa, define D = 1 + sqrt(K1*P_H2) + K2*P_C2H2 + P_C2H4/K5. The fitted net rates
    each contain D^2, reflecting competition for the shared effective site inventory.


    Here K1 and K2 have dimensions Pa^-1; K5 has dimensions Pa. Replacing P_C2H4/K5 by K5*P_C2H4, or assuming all
    adsorption constants have Pa^-1, is a unit/model error. In the source''s effective model theta_vacant can be
    represented as 1/D.


