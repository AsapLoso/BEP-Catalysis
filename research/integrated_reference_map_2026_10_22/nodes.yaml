- id: ma_gas_pde
  parent: u_ma_conservation
  title: Gas-phase packed-bed PDE
  kind: concept
  maturity: ai_worked_out
  relevance: core
  summary: A conservative advection–dispersion–reaction PDE is the continuous baseline for distributed gas composition.
  explanation: 'Choose C_i as molar concentration per gas void volume, u_s as superficial velocity, ε_b as bed void
    fraction, and D_ax under the axial flux convention. The balance is ε_b∂tC_i+∂z(u_sC_i)=∂z(ε_bD_ax,i∂zC_i)+(1−ε_b)ρ_pΣν_ijr_j.
    If properties are constant, divide by ε_b and write the convective term with interstitial velocity u_i=u_s/ε_b.
    If the model instead uses a bulk-bed concentration or a rate per total bed volume, the porosity factors change;
    mixing conventions creates dimensional errors.


    Integrated source-map detail (pbr_governing_pdes): Formulates non-linear hyperbolic-parabolic partial differential
    equations governing axial advection, dispersion, and reaction.


    Preserved source-map note (pbr_governing_pdes): Mass: dCb_i/dt = -u_s * dCb_i/dz + D_ax * d^2Cb_i/dz^2 - k_g*a_v*(Cb_i
    - Cs_i). Energy: rho_g*Cp_g * dT/dt = -u_s*rho_g*Cp_g * dT/dz + lambda_ax * d^2T/dz^2 + 4*U/D_t*(T_w - T) +
    sum(r_j * (-dH_j)).'
  assumptions:
  - Cross-sectionally averaged 1D bed; no gas-phase radial gradients.
  - Coefficient/basis definitions are part of the model, not notation details.
  equations:
  - name: conservative bed-volume balance
    expression: ε_b ∂_t C_i + ∂_z(u_s C_i) = ∂_z(ε_b D_ax,i ∂_z C_i) + (1−ε_b)ρ_p Σ_j ν_ij r_j
    variables: C_i [mol m⁻³ void], u_s [m s⁻¹], D_ax [m² s⁻¹], ρ_p [kg_cat m⁻³ pellet], r_j [mol kg_cat⁻¹ s⁻¹].
    conditions: Fixed void fraction and density conventions; variable properties remain inside flux derivatives.
  claim_refs:
