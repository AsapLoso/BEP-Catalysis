- id: c1_pdag_descriptor_mkm
  parent: ph_pd_ag_surface
  title: PdAg surface descriptors and steady microkinetic screening
  kind: concept
  maturity: ai_worked_out
  status: integrated_ai_reference
  summary: Wang et al. combine DFT, a steady-state Langmuir–Hinshelwood microkinetic model, and steady fixed-bed
    tests to rank specific PdAg surface configurations; their assumed equilibrated adsorption and dθ/dt=0 closure
    are distinct from the transient surface ODEs considered for the BEP.
  explanation: 'Wang et al. (ACS Catalysis, 2023) explicitly vary atomic arrangement as well as composition: Ag
    substituted into a Pd host, isolated/substitutional Pd in an Ag host, and bulk-composition PdAg alloys. Their
    DFT/microkinetic workflow follows a Horiuti–Polanyi-like sequence: acetylene adsorption and first hydrogen addition
    form vinyl, then paths form ethylene or continue through an ethylidene/ethyl branch toward ethane; adsorbed
    ethylene can either desorb or hydrogenate. DFT transition-state barriers feed transition-state-theory rates.
    The microkinetic model imposes a total coverage sum of one, treats C2H2 and H2 adsorption/desorption as equilibrated,
    and sets intermediate coverage derivatives to zero. It is therefore a steady-state surface closure even though
    the resulting calculated rates depend on assumed gas conditions.


    They analyze H and hydrocarbon coverages, reaction energetics, and correlations between adsorption energies
    and structural descriptors intended to capture ligand and strain effects. Their calculations indicate that Pd1Ag3
    is favorable among the specific configurations studied under their chosen ethylene-production criterion; a separate
    suite of alumina-supported Ag–Pd catalysts was tested in a steady fixed bed. The tests used 0.2 MPa, a feed
    of 0.713 vol% C2H2, 13.01 vol% H2 and 39.88 vol% C2H4, 350 mL min^-1 and 323–343 K; reported product data were
    collected after one hour on stream. The authors compare the descriptor/microkinetic ranking with their own test
    results and prior sources. This is a useful structure–kinetics–steady-performance link for PdAg, not evidence
    that an atomic model uniquely describes a working supported catalyst or that periodic forcing improves performance.


    Their measured C2H4 yield is defined as acetylene conversion multiplied by one minus the fraction of converted
    acetylene exiting as ethane. Other possible carbon sinks do not appear in Eq. (3), so the metric alone is not a
    complete carbon balance. The tested alumina-supported catalyst series has 1 wt% Pd and XPS-reported surface
    Pd:Ag ratios 1:1, 1:3 and 1:5; the 1:3 sample has the highest plotted steady yield among that series and Pd.
    The tests report average yield over 50–70 °C after sampling steady data at each stated temperature. They are
    source-specific steady comparisons, not dynamic excitation or a search for the best feasible steady operating
    point.


    A key modeling qualification is that the authors state that including H/C2H2 precoverage can change calculated
    C2H4 production rates by orders of magnitude, even where relative rank among the sampled configurations changes
    little. Their descriptor screen is consequently a ranking tool conditional on chosen surface models, reaction
    network, adsorption assumptions, gas chemical potentials and candidate subset. The article’s calibrated/steady
    tests do not identify finite surface relaxation times or justify replacing dθ/dt=0 with a particular dynamic
    law. Nor can its per-site/DFT rate descriptors be inserted into the proposal’s bed-scale source term without
    a documented catalyst inventory and normalization.


    The descriptor definitions are explicit in the main article: phi_H = (V/E)(sum V1/sum E1), and
    phi_CH3 = [(V/E)(sum V1/sum E1)(sum V2/sum E2)]/R, where V/E denote active-site occupied s–d valence-electron
    count/electronegativity, V1/E1 and V2/E2 are first- and second-neighbor sums, and R is the empirical radius of
    core-layer metal atoms. The SI-referenced numerical radius convention and descriptor-regression tables were not
    locally available in this audit; phi_CH3 should therefore not be assumed dimensionless or exactly reproducible
    from the main-text formula alone. The activity function is a barrier for the rate-determining step on the main
    path; its high-selectivity region is defined by two source-specific barrier-difference sign criteria.


    Conditions for the DFT/descriptor energy calculations are listed as 333 K and p(C2H2)=0.2 atm, p(H2)=4 atm,
    p(C2H4)=9 atm, while the fixed-bed tests report total pressure 0.2 MPa. These are distinct absolute pressure
    scales. The paper presents qualitative rank correspondence, but this does not by itself establish quantitative
    rate or coverage agreement at the test pressure. The detailed microkinetic equations, descriptor fit coefficients,
    outlier details and the atomic-radius convention are referred to Supporting Information that was not present in
    the local article inventory.


    This source gives a better-supported PdAg-specific bridge from atom arrangement to assumed adsorption, coverages,
    surface reaction barriers, microkinetic outputs and steady tests. It does not establish a target surface because
    support, synthesis, pretreatment and reaction atmosphere condition the Pd/Ag distribution; the authors themselves
    model surface segregation under adsorbates. The BEP target catalyst and its working state still require direct
    identification.'
  equations:
  - name: transition-state rate expression
    expression: k_i = (k_B T / h) exp(−ΔG_i^‡ / (k_B T))
    variables: k_i elementary rate coefficient; k_B Boltzmann constant; T temperature; h Planck constant; ΔG_i^‡
      calculated activation free energy.
    conditions: Source uses transition-state theory for modeled elementary steps; rate expressions also require
      coverages, gas activities and consistent standard states.
  - name: source microkinetic surface closure
    expression: Σ_i θ_i + θ_* = 1;  dθ_i/dt = Σ_j ν_ij r_j = 0
    variables: θ_i intermediate site fractions; θ_* vacant-site fraction; ν_ij surface stoichiometric coefficient;
      r_j elementary rate.
    conditions: Wang et al. steady L–H calculation with quasi-equilibrated C2H2/H2 adsorption; not a dynamic coverage
      model.
  - name: dynamic alternative not imposed by the source
    expression: dθ/dt = N_s r_s(p, θ, T),   θ_* = 1 − Σ_i σ_i θ_i
    variables: θ_i adsorbate fractions; σ_i site occupancy; N_s surface stoichiometric matrix; r_s elementary rates.
    conditions: General dynamic extension requires explicit site occupancy and calibrated elementary kinetics; it
      must not be attributed to the source’s dθ/dt=0 results.
  - name: hydrogen-binding structure descriptor
    expression: phi_H = (V/E) * (ΣV1/ΣE1)
    variables: V/E are active-site occupied s–d valence-electron count/electronegativity; V1/E1 are corresponding
      first-neighbor sums.
    conditions: Source Eq. (8), fitted for selected ideal PdAg surface models; not a coverage or kinetic state.
  - name: methyl-binding structure descriptor
    expression: phi_CH3 = [(V/E) * (ΣV1/ΣE1) * (ΣV2/ΣE2)] / R
    variables: V/E active-site properties; V1/E1 and V2/E2 first-/second-neighbor sums; R empirical core-layer
      metal-atom radius.
    conditions: Source Eq. (9); the main text does not state the numerical unit/normalization convention for R,
      and the regression data are in unavailable local Supporting Information.
  - name: reported experimental ethylene-yield metric
    expression: Y_C2H4 = [(C2H2_in - C2H2_out)/C2H2_in] * [1 - C2H6_out/(C2H2_in - C2H2_out)]
    variables: source-reported inlet/outlet acetylene and outlet ethane values on a consistent basis.
    conditions: Source Eq. (3) for its steady fixed-bed test. Only ethane appears as a non-target product correction;
      other carbon sinks and bed-normalized productivity are not established by this expression alone.
  assumptions:
  - The modeled periodic table of PdAg surface configurations adequately samples the chosen structure families;
    unmodeled reconstructions/segregation may change them.
  - A site-fraction sum of one and the selected adsorption equilibrium and L–H reaction scheme are assumed for the
    steady microkinetic comparison.
  - Descriptor relations predict ranking only within their fitted/modelled structure set and chosen reaction conditions.
  - The source-reported descriptor-energy pressures (0.2, 4 and 9 atm partial pressures at 333 K) differ from its
    supported fixed-bed test total pressure (0.2 MPa); qualitative rank agreement is not a matched-pressure
    validation of absolute microkinetic rates or coverages.
  limitations:
  - The experimental catalyst is supported on Al2O3 and measured under one steady fixed-bed feed and temperature
    window; results do not automatically transfer to another support, preparation, pretreatment or periodic regime.
  - Adsorption precoverage changes predicted production rates by orders of magnitude in the reported analysis; a
    stable relative ordering in sampled cases does not make absolute rates robust.
  - The microkinetic closure solves steady surface coverages; it supplies no surface relaxation time or independently
    tested dynamic coverage law.
  - Descriptor correlations and DFT energetics are model outputs, not direct in situ images of all working active
    sites.
  - No comparison with an optimized feasible steady policy under periodic forcing is made.
  - The Supporting Information containing detailed microkinetic rate laws, descriptor fit parameters and numerical
    error tables was not present in the local article inventory; exact model reproduction remains open.
  claim_refs:
  - source_id: wang2023_pdag_descriptors
    locator: §2.1–2.2, printed p. 434
    evidence_type: source_model_result
    supports: The paper’s DFT-to-microkinetic workflow and its explicit L–H, equilibrium-adsorption and steady-state
      coverage assumptions.
  - source_id: wang2023_pdag_descriptors
    locator: §2.3–2.4, printed p. 434; §3.1, printed pp. 435–436
    evidence_type: source_observation
    supports: Catalyst preparation/testing context and the surface-configuration families studied; the measured
      supported catalyst is distinguished from ideal slab models.
  - source_id: wang2023_pdag_descriptors
    locator: §2.4, printed p. 434; §§3.2–3.3, printed pp. 436–441
    evidence_type: source_model_result
    supports: The reported steady experiments and conditional DFT/microkinetic/descriptor rankings for the source
      feed and catalyst set; not an independent dynamic or target-performance result.
  related_ids:
  - ph_pd_ag_surface
  - c1_pdag_support_transfer
  - c1_microscopic_surface_path
  - c1_horiuti_polanyi_family
  - c1_adsorbed_ethylene_fork
  - c2_surface_kinetic_closure_choices
  - c2_urmes_2019_effective_rates
  - ma_pde_ode_coupling
  - sc_baseline
  open_questions:
  - Does the BEP catalyst use an Ag-rich Pd-isolated, Pd-rich alloy, core–shell or segregated working surface under
    its actual feed and pretreatment?
  - Can target transient data identify non-equilibrium coverages or finite surface memory that the source’s steady
    L–H model cannot represent?
  - How sensitive is descriptor ranking to the selected surface ensemble, lateral adsorbate interactions, support,
    segregation and standard-state assumptions?
  - What precise carbon/yield metric and catalyst normalization reconcile the source’s DFT rate ranking with a bed-scale
    cycle-integrated objective?
  - Can the reported microkinetic model and descriptor fits be reproduced under the fixed-bed test conditions, and
    how much does the rank change when the listed pressure scale and precoverage assumptions are varied?
- id: c1_pdag_industrial_lhhw_decay
  parent: ph_catalyst_memory
  title: 'Industrial Pd–Ag α-alumina: fitted LHHW rates and campaign-time activity decay'
  kind: concept
  maturity: ai_worked_out
  status: integrated_ai_reference
  summary: Dehghani et al. report an industrial OleMax 201 Pd–Ag/α-Al2O3 catalyst, empirical LHHW-style rate fits
    and a slow activity-decay state; their quasi-steady axial model does not represent finite within-cycle surface-coverage
    dynamics.
  explanation: 'Dehghani et al. (2019) characterize and test OleMax 201, an industrial Pd–Ag/α-Al2O3 catalyst supplied
    by a petrochemical complex. Table 1 reports 300 ppm Pd, an Ag:Pd ratio of 6 (the ratio basis is not clearly
    specified there), 2–4 mm spherical pellets, 60–70% pellet porosity and tortuosity 2.5. The catalyst was dried/purged
    and reduced before tests. A laboratory reactor used 9 mm internal diameter and 300 mm length. Their factorial
    kinetic plan spans H2/C2H2 ratios 0.5–1.5, 15–20 bar, 35–60 °C, and GHSV 2600–6200 h^-1, with the paper reporting
    216 planned conditions. It is a specific tail-end industrial-catalyst source case, not the same material as
    the Pd/α-Al2O3 2019 Urmès study or the PdAg/SiO2 Larsen BEP PDF.


    The authors construct an effective network for acetylene-to-ethylene, ethylene-to-ethane, butadiene and butene
    products. C4 and heavier products matter because oligomer/green-oil deposition is treated as a deactivation
    route. Fresh/spent characterization reports Pd particle-size growth from 6.2 to 11.5 nm and deposits; this supports
    catalyst evolution in that run, while the exact active-site mechanism remains inferred. The authors fit algebraic
    LHHW-style partial-pressure rate laws to product data, including denominator inhibition powers. These are empirical
    catalyst-specific closures: they do not integrate individual adsorbate fractions, and their reported coefficients
    cannot be transferred without resolving rate and pressure units and the catalyst-mass/volume basis.


    A separate campaign-time activity factor a(t) is coupled to the reactor model. The balance and energy profiles
    are solved in a pseudo-steady plug-flow formulation; stated assumptions include negligible internal pellet concentration/temperature
    gradients, negligible radial and longitudinal mass/heat diffusion, and adiabatic operation. The dynamic quantity
    is the scalar activity decay across catalyst runtime, fitted against plant history, rather than fast within-cycle
    adsorbate coverage response. The paper’s fitted Eq. (29) is `da/dt = -0.21 exp[-9504.4/(RT)] a^2.4 C^0.13`,
    but the general Eq. (22) is printed with a positive sign, the symbol C is not defined clearly in the nomenclature,
    and parameter dimensions/standard units are not fully stated. Preserve these as source ambiguities; do not treat
    the printed fitted law as a directly reusable equation until its signs and units are resolved.


    This source adds a useful distinction among timescales: a reactor can be dynamic over a catalyst campaign because
    activity changes while its gas profiles are treated quasi-steadily. That fact does not demonstrate dynamic coverages
    or transient performance gains at the forcing period. It also supplies a concrete pellet/thermal extension case
    whose assumptions differ from the BEP’s candidate axial-dispersion transient model. The industrial source catalyst,
    support, pellet size, feed and plant are not established as the BEP target.'
  equations:
  - name: empirical source LHHW-style rate family
    expression: r_i = k_i(T) Π_j p_j^(n_ij) / [1 + Σ_k K_k(T) p_k]^(m_i)
    variables: r_i source reaction rate; p_j partial pressures; n_ij and m_i empirical powers; K_k adsorption/inhibition
      coefficients.
    conditions: Source Eq. (21) and Table 5; fitted algebraic closure for one Pd–Ag/α-Al2O3 catalyst and test set.
      Pressure units, reaction-rate basis and portable normalization must be checked before reuse.
  - name: source campaign-time activity law (general form)
    expression: da/dt = k_d exp[−E_d/(RT)] a^n C^m  (Eq. 22 as printed); Eq. 29 prints da/dt = −0.21 exp[−9504.4/(RT)]
      a^2.4 C^0.13
    variables: a scalar catalyst activity; E_d source activation parameter; R gas constant; T temperature; C source-symbol
      for a feed/deactivation concentration, not clearly defined in nomenclature.
    conditions: The printed general and fitted equations have a sign discrepancy; units and C basis are unresolved.
      Do not numerically reuse until checked.
  - name: pseudo-steady axial balance architecture
    expression: dF_i/dz = ρ_cat,bed a Σ_j ν_ij r_j;  gas/energy axial profiles are quasi-steady, while da/dt retains
      campaign-time evolution
    variables: F_i species molar flow; ρ_cat,bed catalyst mass per bed volume; a activity; ν_ij stoichiometric coefficient;
      r_j rate per declared catalyst basis.
    conditions: This expression states the conservative model architecture in a declared basis; it is not asserted
      to be the exact source Eq. (23) normalization, whose symbols and units require reconstruction.
  assumptions:
  - The catalyst batch and catalyst descriptor table apply to the source’s OleMax 201 material; Ag:Pd ratio convention
    is not inferred.
  - The kinetic rate family is an empirical fitted LHHW closure; no full dynamic θ state vector is present.
  - The process model uses pseudo-steady axial mass and energy balances, plug flow, adiabaticity and negligible
    intrapellet/radial/axial dispersion terms; these are study choices.
  - The scalar activity a(t) represents campaign-scale change calibrated to the source’s plant data and is distinct
    from reversible adsorbate coverage.
  limitations:
  - The source catalyst/support and operating window do not establish the BEP catalyst identity.
  - The paper’s pellet-gradient and longitudinal-dispersion assumptions differ from a model that resolves pellet
    transport or axial dispersion.
  - Table 5’s rate units and catalyst normalization are not sufficiently explicit for direct source-term insertion.
  - The general decay equation and fitted equation differ in sign; C and the fitted kinetic/deactivation parameter
    units are not fully defined.
  - Long-term plant model fit is not evidence of a periodic operating advantage or of a within-cycle surface relaxation
    time.
  claim_refs:
  - source_id: dehghani2019_pdag_alphaal2o3
    locator: §2.1, Table 1; §§2.3–2.4, Tables 2–3; printed pp. 3–5
    evidence_type: source_observation
    supports: Reported OleMax 201 catalyst descriptors, preparation, laboratory reactor and planned kinetic-test
      envelope; table leaves Ag:Pd ratio basis unclear.
  - source_id: dehghani2019_pdag_alphaal2o3
    locator: §3.2; §§6.2–6.3; printed pp. 5–7 and 10–20
    evidence_type: source_observation
    supports: Product characterization and fresh/spent particle-size and deposit observations for the source catalyst;
      source interpretation of deactivation remains bounded.
  - source_id: dehghani2019_pdag_alphaal2o3
    locator: §3.3, Eq. (21), Table 5, Eqs. (27)–(28); printed pp. 7 and 16–17
    evidence_type: source_model_result
    supports: Source-fitted algebraic LHHW-style rates for its catalyst and design range; units and basis need resolution
      before transfer.
  - source_id: dehghani2019_pdag_alphaal2o3
    locator: §3.4, Eq. (22); §4; §6.2.5, Eq. (29); printed pp. 7–8 and 16–17
    evidence_type: source_model_result
    supports: Pseudo-steady axial process model coupled to campaign-time scalar activity and fitted plant trends;
      its dynamic state is catalyst activity, not an explicit within-cycle coverage model.
  related_ids:
  - ph_deposits
  - ph_dynamic_memory
  - ph_pellet_transport
  - ph_energy_balance
  - c1_catalyst_identity
  - c1_pdag_support_transfer
  - lhhw_kinetics
  - ma_gas_pde
  - ma_pde_ode_coupling
  - ma_surface_balance
  - sc_identification_vs_performance
  open_questions:
  - Does the BEP catalyst match OleMax 201 in composition, support, shape, porosity, pretreatment and reactor regime?
  - What are the units and basis for the source Table 5 rates, partial pressures, and adsorption constants?
  - What does C represent in the fitted decay equation, and why does Eq. (22) print a different sign from Eq. (29)?
  - How do slow campaign deactivation, pellet diffusion and within-cycle adsorbate dynamics separate under repeated
    periodic and steady tests?
- id: ph_variable_superficial_velocity
  parent: ph_axial_balance
  title: Variable superficial velocity and total-flow closure
  kind: concept
  maturity: ai_worked_out
  relevance: core
  summary: If reaction changes total gas molar flow, superficial velocity may vary in space and time and must remain
    inside the conservative flux divergence.
  explanation: 'Define total component flux as J_i = u_s C_i − ε_b D_ax,i ∂_z C_i. In the balance ε_b ∂_t C_i +
    ∂_z J_i = S_i, a variable u_s(z,t) stays inside ∂_z(u_s C_i): expanding gives u_s∂_zC_i + C_i∂_z u_s. Replacing
    this by u_s∂_zC_i drops a term unless u_s is spatially constant. In an ideal-gas, fixed-pressure, fixed-temperature,
    fixed-area convective-flow closure, u_s = F_tot RT/(P A_c); reaction net stoichiometry, gas uptake/release,
    pressure drop and thermal expansion can affect F_tot or volumetric flow. For a transient dispersed model, the
    total-flow/velocity relation must be consistent with the summed component balances and chosen mixture-dispersion
    closure. Di Giuliano and Pellegrino demonstrate the modeling distinction in CO2 carbonation, not the magnitude
    or sign of the effect for the BEP acetylene network.'
  assumptions:
  - u_s is defined from convective volumetric flow divided by bed cross-sectional area; it is not the interstitial
    velocity.
  - The displayed ideal-gas relation assumes fixed local P and T, ideal behavior, and a defined total convective
    molar flow; nonideal and pressure-drop models require a modified state relation.
  - A component-wise axial-dispersion model must state how summed diffusive flux and total continuity are closed.
  equations:
  - name: variable-velocity conservative flux
    expression: ε_b ∂_t C_i + ∂_z J_i = S_i,   J_i = u_s(z,t) C_i − ε_b D_ax,i ∂_z C_i
    variables: C_i [mol m⁻³ void]; J_i [mol m⁻² s⁻¹]; u_s [m s⁻¹]; ε_b [1]; D_ax,i [m² s⁻¹]; S_i [mol m⁻³ bed s⁻¹].
    conditions: One-dimensional cross-sectional average; coefficient variation is retained inside the flux divergence.
  - name: ideal-gas convective velocity closure
    expression: u_s = F_tot R T / (P A_c)
    variables: F_tot [mol s⁻¹]; R [Pa m³ mol⁻¹ K⁻¹]; T [K]; P [Pa]; A_c [m²].
    conditions: Ideal gas, local fixed P,T, fixed cross-section, and convective molar flow definition; this is a
      closure relation, not a consequence of species equations alone.
  - name: total gas reaction source
    expression: S_tot = Σ_i S_i = (1−ε_b) ρ_p Σ_j (Σ_i ν_ij) r_j
    variables: S_tot [mol m⁻³ bed s⁻¹]; ν_ij gas-phase stoichiometric coefficient; r_j [mol kg_cat⁻¹ s⁻¹]; ρ_p [kg_cat
      m⁻³ pellet].
    conditions: Gas-phase reaction source only; include adsorption uptake and any gas/surface inventory coupling
      consistently.
