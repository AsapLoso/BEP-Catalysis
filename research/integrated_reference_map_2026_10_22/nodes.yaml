- id: ph_adsorbate_balance
  parent: ph_surface_states
  title: Coverage balance and site conservation
  kind: concept
  maturity: ai_worked_out
  relevance: core
  summary: Surface-state equations must conserve sites while accounting for adsorption, desorption and reaction
    stoichiometry.
  explanation: For elementary step j, let ν^s_lj be the signed stoichiometric coefficient of adsorbed species l.
    With rates normalized per site, dθ_l/dt=Σ_j ν^s_lj r^s_j. If r is instead per catalyst mass or external area,
    a site-density conversion is needed before it can be added to a fractional coverage rate. A simple monodentate
    lattice has θ_*+Σ_l θ_l=1; for species occupying s_l sites, θ_*+Σ_l s_l θ_l=1. This is a closure constraint,
    not a kinetic law.
  assumptions:
  - Rate basis, site density and occupancy convention must match.
  - Numerical integration should preserve nonnegative coverages and site closure, or quantify violations.
  equations:
  - name: coverage dynamics
    expression: dθ_l/dt = Σ_j ν^s_lj r^s_j( p, θ, T )
    variables: θ_l dimensionless; p partial pressures; normalized r^s_j in s⁻¹ per site.
    conditions: Only if the kinetic rate is expressed per site; otherwise convert using the stated active-site density.
  - name: site balance
    expression: θ_* + Σ_l s_l θ_l = 1
    variables: θ_* vacancy fraction; s_l number of sites occupied by adsorbate l.
    conditions: One site family and a declared adsorption lattice; multiple site families need separate balances.
