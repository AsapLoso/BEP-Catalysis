  title: Mechanism choice and catalyst specificity
  kind: concept
  maturity: ai_worked_out
  relevance: core
  summary: Published acetylene mechanisms use different site descriptions; these are catalyst- and condition-specific
    alternatives.
  explanation: >-
    Published acetylene mechanisms use different site descriptions; these are catalyst- and condition-specific alternatives. The 2012 Pd–Ag/Al2O3 abstract reports a selected two-site Langmuir–Hinshelwood model among 77 kinetic equations. The 2019 full-text study of 0.05 wt% Pd/α-Al2O3 reports a one-site description for both acetylene and ethylene hydrogenation under tested tail-end conditions. The 2022 Pd/α-Al2O3 periodic study uses a single-site microkinetic description for dynamic data. A 2025 Pd/α-Al2O3 kinetic study also judges a single-site representation applicable at 1–2 bar without CO and introduces reversible ethylene adsorption. Composition, support, preparation, operating window, CO, model reduction and data can explain distinct representations; these are not a universal contradiction and do not establish transfer to the BEP catalyst.
  assumptions:
