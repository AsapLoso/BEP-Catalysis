- id: lhhw_kinetics
  parent: u_ph_kinetics
  title: 'Larsen BEP thesis: extended empirical LHHW closure'
  kind: concept
  maturity: ai_worked_out
  status: integrated_ai_reference
  summary: A local BEP thesis reports an extended empirical LHHW fit with a cap on acetylene consumption and an
    acetylene inhibition factor for ethylene hydrogenation.
  explanation: The located PDF is titled “Semihydrogenation of acetylene to ethylene with a PdAg catalyst” and labels
    the work BEP; its inspected title page gives no year or institution. The repository filename says 2024 and the
    PDF metadata creation date is 2026-06-26, neither of which establishes the completion year or awarding
    institution. Table 4.1 (printed p. 15) reports 0.025, 0.05 and 0.1 wt% Pd with 5 wt% Ag; “Pd0 Ag” is the
    lowest-Pd sample label, not a Pd-free catalyst. The abstract and §6.1/Table 6.1 (printed pp. 1 and 23) report
    tests at 100 °C and 1000 mbar, but §4.2 (printed p. 15) says the reactor was maintained at 80 °C during
    experiments. The source-internal temperature discrepancy is unresolved. The thesis reports overall fit RMSE
    values 5.10, 5.43 and 7.14 percentage points for Pd0 Ag, Pd2 Ag and Pd3 Ag. In §6.2.3 (printed p. 37), its
    final fitted closure uses a squared adsorption denominator for r₁, a saturating cap
    r₁=r₁,raw/(1+r₁,raw/r₁,max), and an acetylene-inhibition factor (1+K_inh p_C₂H₂)^n_inh for r₂. These are
    source-specific empirical steady-model modifications, not elementary microkinetic laws, explicit transient
    coverage equations, or evidence of periodic gain. Rate and adsorption-parameter units depend on the thesis
    normalization and were not found for transfer to the target catalyst. The date, institution, working catalyst
    match, temperature actually used, and balance basis remain unresolved.
  equations:
  - name: source-specific raw acetylene rate
    expression: r₁,raw = k₁ K_A p_A K_H₂ p_H₂ / (1 + K_A p_A + K_E p_E + K_H₂ p_H₂)²
    variables: A=C₂H₂; E=C₂H₄; p_i are partial pressures; k₁ and adsorption constants are fitted in the thesis normalization.
    conditions: Larsen local BEP thesis, printed p. 37, Eq. (6.9); not transferable without matching catalyst, feed,
      units and fit scope.
  - name: source-specific empirical rate cap
    expression: r₁ = r₁,raw / (1 + r₁,raw/r₁,max)
    variables: r₁,max is an empirical maximum-rate parameter in the source fit.
    conditions: Larsen local BEP thesis, printed p. 37, Eq. (6.10); positive raw rate saturates asymptotically at
      r₁,max.
  - name: source-specific ethylene over-hydrogenation rate
    expression: r₂ = k₂ K_E p_E K_H₂ p_H₂ / [(1 + K_A p_A + K_E p_E)(1 + K_inh p_A)^n_inh]
    variables: p_A and p_E are acetylene and ethylene partial pressures; n_inh is a fitted inhibition exponent.
    conditions: Larsen local BEP thesis, printed p. 37, Eq. (6.11); denominator and parameter normalization are
      source-specific.
  assumptions:
  - The final LHHW forms are empirical closures fitted to this thesis's catalyst-specific steady data.
  - Rate and adsorption-parameter units follow the source's normalization, which must be recovered before transfer.
  limitations:
  - The PDF title page labels the work BEP but does not verify the 2024 date or awarding institution.
  - §4.2's 80 °C statement conflicts with the abstract and §6.1's 100 °C test conditions; the source does not resolve
    which value describes the experiments.
  - The equations are empirical fits; no explicit dynamic surface-coverage equations or matched periodic-operation
    comparison is reported.
  - RMSE combines conversion and selectivity fit errors in the source's chosen percentage scale; it is not yield,
    productivity, out-of-sample validation, or a performance comparison against optimized steady operation.
  - Fitted parameters are not transferable without the catalyst identity, experimental temperature, pressure/rate
    basis, and fitting normalization.
  claim_refs:
  - source_id: larsen_bep_pdf
    locator: Abstract, printed p. 1; §6.2.3, printed p. 37, equations (6.9)–(6.11)
    evidence_type: source_model_result
    supports: Source-specific PdAg/SiO₂ steady test conditions, empirical rate-form modifications and reported fit
      RMSE values.
    review: ai_attached
  related_ids: []
  open_questions:
  - The thesis calls H₂ adsorption dissociative, but its displayed denominator uses K_H₂ p_H₂ rather than the
    square-root dependence expected from the simple equivalent-site quasi-equilibrium dissociative Langmuir form;
    what site and rate convention did the author use?
  - Determine whether §4.2's 80 °C or the abstract/§6.1's 100 °C is the actual experimental temperature.
  - Resolve the rate units and the definitions of ρ_support and cross-sectional area A in §4.3 Eqs. (4.6)–(4.9).
    Appendix F is titled “Standard LHHW model code”; its code pages are raster images and the available OCR did not
    establish those quantities.
  - Confirm the thesis completion year, institution and whether its catalyst batch matches the current BEP target.
  source_map_refs:
