    on 0.05 wt% Pd/alpha-Al2O3 at source-specific temperatures and ethylene-rich feed conditions. They share a competitive
    adsorption denominator and combine quasi-equilibrium assumptions with rate-determining elementary steps.


    This model has algebraic, instantaneous surface-pressure dependence (PSSA). It does NOT integrate independent
    theta(t), although a reactor coupling the rates to time-dependent gas transport is itself dynamic.


    Keep this branch DISTINCT from legacy node lhhw_kinetics, which describes a different Larsen extended LHHW context
    including a non-integer inhibition exponent. Do not mix the papers'' parameters, source catalysts or kinetics.


    Evidence boundary: source links are AI-attached; no transferable kinetics, calibrated transient coverages or
    human-verified citation claims are asserted. The inspected printed p. 4 derives the reduced rate expressions
    from quasi-equilibrated adsorption and irreversible rate-determining H additions; Table 5 parameter values are
    source-specific and K₁ conflicts with the preceding p. 5 estimate. See the separate denominator and parameter-ledger
    concepts.'
