- id: sc_unknown_input_reconstructibility
  parent: sc_observability
  title: Reconstructibility of an unmeasured bed-plane input
  kind: concept
  maturity: ai_worked_out
  relevance: core
  summary: If the realized inlet waveform is unknown, it is an unknown time-varying input that can confound internal
    states and kinetic parameters.
  explanation: Distinguish the commanded actuator signal u_c(t) from the actual bed-plane component-flow/composition
    input u_b(t). A model can write xdot=f(x,u_c,w,p), y=h(x,w,p), where w(t) represents unmeasured actuation, mixing
    or transfer-line distortion; x are internal states and p are constant kinetic/transport parameters. State observability,
    parameter identifiability and reconstruction of w are different inverse questions. A joint analysis can reveal
    structural confounding even when an optimizer fits the outlet trajectory. Villaverde, Tsiantis and Banga's FISPO
    method treats unknown time-varying inputs, parameters and states jointly, using smooth-input and derivative-augmentation
    assumptions for its structural test and a separate optimization for estimation. Its synthetic biological examples
    do not establish that a packed-bed inlet signal can be recovered from outlet data. Measuring or independently
    calibrating the bed-plane input is therefore essential before assigning observed lag to adsorption, transport
    or analyzer dynamics.
  assumptions:
  - The actuator command and bed-plane input are distinct signals unless measurement establishes otherwise.
  - Unknown inputs are represented with explicit time dependence and stated smoothness/parameterization assumptions.
  - Structural reconstructibility and numerical estimation from noisy finite data are assessed separately.
  equations:
  - name: known-command and unknown-realized-input model
    expression: xdot = f(x,u_c,w,p),   y = h(x,w,p),   pdot = 0
    variables: u_c commanded input; w(t) unknown bed-plane deviation or unmodeled disturbance; x dynamic states;
      p constant parameters; y measured output.
    conditions: Use only when the actual bed input is not independently known; an explicit actuator/mixer state
      model is an alternative.
  - name: joint unknown set
    expression: z(t) = [x(t), p, w(t)]
    variables: Unknown states, time-invariant parameters and time-varying inputs.
    conditions: A joint structural test must include the chosen input-function class; it cannot assume arbitrary
      unknown functions are recoverable.
  claim_refs:
