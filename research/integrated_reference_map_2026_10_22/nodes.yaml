    scientific review; the parent taxonomy and user-approved C1 branch split do not imply validation of this node.


    Preserved source-map note (c1_net_reaction_network): AI SCIENTIFIC SYNTHESIS — AI worked out; not human-reviewed.
    The starting point is TWO net reactions: acetylene + hydrogen produces ethylene (desired), and ethylene + hydrogen
    produces ethane (competing). This net scheme identifies gas species and stoichiometry but does not specify the
    detailed sequence of occupied Pd sites.


    A net two-rate closure is a conditional first model. It must not be interpreted as proof that all ethane arose
    from free gas ethylene or that other routes are chemically impossible.


    Epistemic status: AI-attached repository/source references; specific claims have not been human-verified. Chemical
    mechanism is not experimental validation or a calibrated kinetic parameter set.'
