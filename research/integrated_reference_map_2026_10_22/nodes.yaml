- id: sc_persistent_excitation_condition
  parent: u_sc_excitation
  title: Persistent excitation and information content of a periodic input
  kind: concept
  maturity: ai_worked_out
  relevance: core
  summary: An input is informative only relative to model parameters, measured outputs and sensor noise; periodicity
    alone is not sufficient.
  explanation: 'For a selected linear regression y_k=φ_kᵀθ+ε_k, a common finite-window persistency condition is
    that the regressor Gram matrix remains uniformly positive definite: there exist N and α>0 such that Σ_{k=t}^{t+N}φ_kφ_kᵀ⪰αI
    over relevant windows. Its order and scaling depend on the model parameterization. In a nonlinear reactor, local
    experiment information is instead built from output sensitivities along a declared input trajectory and weighted
    by the measurement-error model. Full local rank addresses sensitivity directions under that model; it does not
    itself prove global uniqueness, practical precision, or correctness of the mechanism. A single sinusoid may
    estimate a local first-harmonic response at its frequency, yet does not generally identify all kinetic, transport
    and sensor parameters. A multisine or several periods can cover more modes only if independent sensitivities
    reach the catalyst and are resolved by sensors. Schoukens et al. discuss practical advantages of periodic excitation
    versus noise for estimation uncertainty, model validation, initial-state estimation and frequency coverage,
    but only their abstract was accessible here and it supplies no reactor-specific theorem. Urmès et al. used periodic
    ethylene adsorption on Ni/Al₂O₃ to estimate an equilibrium adsorption constant; this source-specific identification example does not establish a formal persistent-excitation condition or full target identifiability and small flow oscillations over Pd/α-Al₂O₃
    to fit an acetylene model. These are identification examples, not evidence that the target input is sufficiently
    exciting or improves product output. Design must account for actuator/line transfer, bed residence-time filtering,
    analyzer bandwidth and aliasing, nonlinear harmonics, coupled composition/flow, and safety constraints.'
  assumptions:
  - The finite-window Gram condition applies to the chosen regression parameterization, not automatically to a nonlinear
    distributed packed bed.
  - Input/output boundaries, clocks and sensor noise are declared; actuator commands are not assumed to be bed-plane
    inputs.
  - A local first-harmonic transfer response requires a declared steady point and sufficiently small perturbations.
  equations:
  - name: finite-window excitation condition for a regression
    expression: '∃N, α>0: Σₖ₌ₜ^{t+N} φₖφₖᵀ ⪰ αI for every relevant t'
    variables: φₖ regressor; N a window length; α a positive information lower bound in the selected parameter scaling.
    conditions: A condition for the specified regression model, not a blanket nonlinear reactor identifiability
      theorem.
  - name: local output sensitivity information
    expression: F_T(d,θ)=Σᵢ SᵢᵀΣᵢ⁻¹Sᵢ, Sᵢ=∂μ(tᵢ;d,θ)/∂θ
    variables: Sᵢ is measured-output sensitivity at sample time tᵢ; Σᵢ its observation covariance.
    conditions: Local information for a declared model, input and fixed Gaussian covariance; target rank and conditioning
      are not computed.
  claim_refs:
  - source_id: schoukens1994_periodic_excitation_identification
    locator: VUB institutional record, Abstract
    evidence_type: source_model_result
    supports: The conference paper analyzes periodic versus noise excitation with respect to estimate uncertainty,
      model validation, initial-state estimation and frequency coverage; full text was not available.
  - source_id: waldron2020_transient_flow_mbdoe
    locator: Full text §3, equations (18)–(21), and initial-parameter discussion
    evidence_type: derived_under_assumptions
    supports: Input trajectories and measurement samples determine weighted sensitivity information, and nominal
      experiment design depends on parameter starting estimates.
  - source_id: urmes2020_ni_periodic_estimation
    locator: Publisher abstract, first and third paragraphs
    evidence_type: source_observation
    supports: Periodic molecular ethylene adsorption over supported Ni/Al2O3 was used to estimate an equilibrium
      adsorption constant; this is an identification example, not a formal persistent-excitation theorem or target result.
  - source_id: urmes2022
    locator: Publisher abstract
    evidence_type: source_observation
    supports: Small-amplitude periodic flow perturbations supplied dynamic data to estimate a source-specific Pd/α-Al₂O₃
      acetylene model; this does not establish complete target identifiability or performance gain.
  related_ids:
  - ma_fisher_information_model_based_design
  - sc_periodic_frequency_response_identification
  - sc_unknown_input_reconstructibility
  - sc_co_design
