- id: c2_urmes_2019_net_rates
  parent: c2_urmes_2019_effective_rates
  title: Two hydrogenation rate expressions and gas sources
  kind: concept
  maturity: ai_worked_out
  status: integrated_ai_reference
  summary: The two fitted net rates define a gas-only acetylene→ethylene→ethane source vector when no surface inventory
    or side products are modeled.
  explanation: 'Interpretation: provisional AI synthesis; no claim-specific human verification is recorded. With
    k4(T) = k4^0*exp[-E4/(R*T)] and k7(T) = k7^0*exp[-E7/(R*T)]: r1 = Ns*k4(T)*K1*K2*P_C2H2*P_H2/(D^2) and r2 =
    Ns*k7(T)*(K1/K5)*P_C2H4*P_H2/(D^2), giving mol/(kg_catalyst*s) under the published normalizations.


    With gas order (H2, C2H2, C2H4, C2H6), net source vector = (-r1-r2, -r1, r1-r2, r2). This gas-only net closure
    assumes no independently accumulating surface inventory.


    For positive relevant partial pressures, r2/r1 = [k7(T)/k4(T)]*[P_C2H4/P_C2H2]/(K2*K5). Shared D^-2 and K1*P_H2
    terms cancel algebraically in this ratio, but the ratio alone does NOT establish that full model parameters
    are structurally unidentifiable.


    Evidence boundary: source links are AI-attached; no transferable kinetics, calibrated transient coverages or
    human-verified citation claims are asserted.'
  equations:
  - name: two-reaction gas source vector
    expression: (S_H₂,S_C₂H₂,S_C₂H₄,S_C₂H₆)=(-r_A-r_E,-r_A,r_A-r_E,r_E)
    variables: r_A is positive acetylene consumption; r_E is positive ethane production; each rate is mol kg_cat⁻¹
      s⁻¹.
    conditions: Derived for the two net gas reactions C₂H₂+H₂→C₂H₄ and C₂H₄+H₂→C₂H₆; no independent surface accumulation,
      C₄ products, deposits or other carbon products.
  - name: source model rate ratio
    expression: r_E/r_A = [k₇(T)/k₄(T)] [p_C₂H₄/p_C₂H₂] /(K₂K₅)
    variables: The ratio is dimensionless; k_i(T)=k_i⁰ exp(−E_i/RT).
    conditions: For positive pressures and shared one-site denominator/source equations; cancellation does not by
      itself establish global structural non-identifiability.
  assumptions:
  - The two net hydrogenation reactions close the gas carbon balance.
  - Surface states are algebraically eliminated under PSSA; no dynamic coverage inventory is present.
  limitations:
  - Legacy tier values are not evidence of owner understanding. Historical source attachments require claim-specific
    verification.
  - A two-reaction gas closure is not a complete carbon balance where C₄ products or deposits are present.
  - The rate ratio cancellation is local algebra, not an identifiability proof.
