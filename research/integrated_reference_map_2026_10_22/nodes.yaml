    data are fixed?
  - Will BDF/Radau meet positivity, event-alignment, cycle-closure and output-tolerance requirements at acceptable
    cost?
  status: integrated_ai_reference
  limitations:
  - This scalar bound is illustrative and cannot be substituted for a stability, accuracy, or positivity study of
    the coupled target equations.
  source_map_refs: []
- id: sc_nonlinear_observability_identifiability
  parent: sc_observability
  title: Local observability and structural identifiability
  kind: concept
  maturity: ai_worked_out
  relevance: core
  summary: State observability, parameter identifiability and practical estimability are distinct; local nonlinear
    rank tests require a declared model and input.
  explanation: Write a deterministic model as xdot=f(x,u,p), y=h(x,u,p), with state x, known input u, constant parameters
    p and measured output y. Local observability concerns whether nearby initial states can be distinguished from
    ideal output trajectories under the specified or admissible inputs. For analytic nonlinear systems, gradients
    of output components and their iterated Lie derivatives generate an observability codistribution; full state
    rank is a local weak-observability condition under the theorem's regularity and input assumptions. Structural
    parameter identifiability can be studied by augmenting the state with constant parameters, pdot=0, and testing
    the corresponding observability-identifiability matrix for rank n_x+n_p. This is a noiseless structural property,
    not a guarantee of finite-data accuracy, global uniqueness, good conditioning, or a usable estimator. Rank can
    depend on measured outputs, initial conditions, excitation and whether generic or specified parameter values
    are tested. Periodically forced models require analysis along the declared input trajectory, or an appropriate
    phase-augmented representation; an autonomous rank test that ignores the waveform does not establish observability
    under that experiment.
  assumptions:
  - The model structure and output map are exact and analytic where the cited nonlinear rank conditions require
    analyticity.
  - The input is known or its unknown-input structure is separately modeled; local rank is not a practical-noise
    metric.
  - Full local rank implies a local structural result under theorem hypotheses, not necessarily global identifiability
    or robust numerical estimation.
  equations:
  - name: nonlinear state-space and observation model
    expression: xdot = f(x,u,p),   y = h(x,u,p)
    variables: x ∈ R^n_x states; u(t) known input; p ∈ R^n_p unknown constant parameters; y measured output.
    conditions: Declared initial state, input trajectory, measured channels and model class.
  - name: parameter augmentation
    expression: x_tilde = [x,p],   xdot_tilde = [f(x,u,p), 0]
    variables: x_tilde contains physical states and constant kinetic/transport parameters.
    conditions: Parameters are constant over the inference interval and are included in the state model with zero
      dynamics.
  - name: local structural rank condition
    expression: rank(O_I(x_tilde_0,u)) = n_x + n_p
    variables: O_I is the observability-identifiability matrix built from output derivatives/Lie derivatives for
      the chosen model and input.
    conditions: Sufficient local criterion under the cited analytic nonlinear ODE framework; rank deficiency may
      identify unobservable combinations but not by itself quantify noise sensitivity.
  claim_refs:
  - source_id: villaverde2016_structural_identifiability
    locator: 'Methods: local observability and structural identifiability as augmented observability'
    evidence_type: source_model_result
    supports: The full-text method paper defines local state distinguishability and analyzes structural identifiability
      by augmenting unknown parameters as zero-dynamics states and testing a generalized observability matrix.
  - source_id: villaverde2019_fispo
    locator: §2.2, observability-identifiability condition
    evidence_type: source_model_result
    supports: The authors state a local full-rank condition for jointly observable states and structurally identifiable
      parameters in their analytic model framework.
  - source_id: proposal_main
    locator: Methodology §3.4, Phase 1 parameter-estimation plan (lines 270–273)
    evidence_type: proposal_hypothesis
    supports: The project proposes estimating kinetic parameters from steady/transient response; no structural rank
      test or target parameter result has been performed.
  related_ids:
