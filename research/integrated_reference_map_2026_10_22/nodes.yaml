    expression: D = 1 + √(K₁ p_H₂) + K₂ p_C₂H₂ + p_C₂H₄/K₅; r_A = N_S k₄⁰ exp(−E₄/RT) K₁K₂ p_C₂H₂p_H₂ / D²; r_E
