- id: u_ma_inverse
  parent: mathematics
  title: Identifiability, sensitivity and uncertainty
  kind: proposed_theme
  maturity: ai_worked_out
  summary: Parameter identifiability is a property of model outputs, experiment inputs and noise; a good fit does
    not uniquely determine a mechanism.
  explanation: >-
    Parameter identifiability is a property of model outputs, experiment inputs and noise; a good fit does not uniquely determine parameters. Structural identifiability asks whether ideal noiseless outputs uniquely determine parameters; practical identifiability asks whether the available noisy finite data constrain them. Sensitivity collinearity and parameter compensation can leave output-equivalent combinations. The Urmès 2019 fit fixed adsorption/site quantities after observing correlation, and the thesis LHHW fit uses a different empirical closure. The 2025 Pd model reports approximate 95% intervals only for selected parameters and attributes some wide intervals to a narrow temperature range and coupled Arrhenius terms. Periodic excitation may add information but does not guarantee uniqueness or transfer.
  equations:
  - S_ij = ∂y_i/∂p_j; rank/conditioning is local and conditional on model, outputs and trajectory
  assumptions:
  - Identifiability depends on model, input, output and noise assumptions.
  - Parameter confidence is not model adequacy.
  limitations:
  - No BEP data, sensitivity matrix, Fisher information analysis or posterior uncertainty has been computed.
  open_questions:
  - Which parameter combinations are practically identifiable?
  - What uncertainty bound makes a gain distinguishable from zero?
