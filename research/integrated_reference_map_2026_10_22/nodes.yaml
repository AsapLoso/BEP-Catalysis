- id: ma_stability
  parent: u_ma_periodic
  title: Steady-state and periodic stability
  kind: concept
  maturity: ai_worked_out
  relevance: core
  summary: A steady-state Jacobian and a periodic orbit's Floquet multipliers answer different stability questions.
  explanation: For a steady solution x*, eigenvalues of ∂f/∂x locally characterize perturbation evolution in an
    autonomous model. For a period-T solution, linearize the one-cycle map DP(x*) or compute Floquet multipliers;
    magnitudes below one indicate local cycle-to-cycle decay in a discrete-time representation. A concentration-forced
    reactor is not adequately described by only a steady-state Jacobian. Stability also does not imply optimality
    or robustness to model mismatch.
  assumptions:
  - Linear stability is local.
  - The chosen discretization and periodic orbit must be converged before interpreting multipliers.
  equations:
  - name: steady local linearization
    expression: δẋ = J(x*) δx,  J=∂f/∂x|_(x*)
    variables: J is the state Jacobian.
    conditions: Autonomous steady operating point.
  - name: periodic stability
    expression: μ_k ∈ eig(DP(x*))
    variables: μ_k are Floquet multipliers of the one-period map.
    conditions: Periodic orbit is a fixed point of P; local asymptotic cycle stability requires |μ_k|<1 for all
      modes.
  claim_refs:
  - source_id: proposal_main
    locator: Methodology §3.4 and §3.5 (lines 262–284)
    evidence_type: derived_under_assumptions
    supports: Analysis needed to distinguish the proposed periodic optimum from a steady operating point.
  related_ids:
