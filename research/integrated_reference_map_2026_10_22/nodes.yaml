- id: sc_periodic_frequency_response_identification
  parent: u_sc_excitation
  title: Periodic gain and phase as identification measurements
  kind: concept
  maturity: ai_worked_out
  relevance: core
  summary: A small periodic input estimates a frequency-specific input-output response; it does not alone identify
    catalyst states or prove average-product improvement.
  explanation: Near a steady operating point, a locally linear model xdot=Aδx+Bδu, δy=Cδx+Dδu maps a sinusoid at
    angular frequency ω to a complex output amplitude through G(jω)=C(jωI−A)⁻¹B+D. The first-harmonic gain is |G|
    and phase is arg(G); for multiple inputs/outputs this becomes a transfer matrix. The measured response includes
    actuator, mixer, line, bed and analyzer dynamics unless the input and output boundaries are separately calibrated.
    A single frequency probes only one slice of the dynamics and one input direction; multiple frequencies or multisine
    inputs can help separate timescales only if the realized bed input, sampling rate and noise are adequate. Nonlinear
    periodic operation can generate harmonics and a DC shift, so first-harmonic gain/phase is not a cycle-average
    product objective. Urmès et al. (2020) report estimating an adsorption equilibrium constant from periodic ethylene
    adsorption over Ni/Al2O3 with an IR analyzer acquiring outlet data up to 30 Hz; that rate does not establish analyzer bandwidth or phase fidelity, while Urmès et al. (2022) report a fitted transient acetylene/Pd
    model reproducing tested outlet trajectories. These are source-specific identification/modeling results, not
    evidence of BEP performance gain.
  assumptions:
  - The transfer-function equation is a local linearization about a stable steady state and applies to sufficiently
    small perturbations.
  - Input/output harmonic amplitudes use consistent units, clock, phase reference and measurement location.
  - For nonlinear/large-amplitude forcing, harmonics, cycle means, state periodicity and constraints require the
    nonlinear model.
  equations:
  - name: linearized state-space frequency response
    expression: δxdot = Aδx + Bδu,   δy = Cδx + Dδu,   G(jω)=C(jωI−A)⁻¹B + D
    variables: A,B,C,D are local Jacobian matrices; ω [rad s⁻¹]; δu and δy are input/output perturbations.
    conditions: Linear time-invariant approximation around a stable operating point; include actuator and sensor
      states if measuring the complete rig.
  - name: first-harmonic gain and phase
    expression: Ĝ_1(ω)=Y_1(ω)/U_1(ω),   gain=|Ĝ_1|,   phase=arg(Ĝ_1)
    variables: U_1 and Y_1 are complex harmonic coefficients at the stated input/output planes.
    conditions: Single-input/single-output estimate; for MIMO systems use the measured vector/matrix relation and
      independent excitation directions.
  claim_refs:
  - source_id: urmes2020_ni_periodic_estimation
    locator: Publisher abstract, third paragraph
    evidence_type: source_observation
    supports: The abstract reports continuous-flow Ni/Al2O3 ethylene adsorption with IR data acquisition up to 30 Hz and
      periodic outlet-signal estimation of an equilibrium adsorption constant; the sampling rate is not analyzer bandwidth.
  - source_id: urmes2020_ni_periodic_estimation
    locator: Publisher Highlights and abstract; selected indexed Introduction and numerical-tools excerpts
    evidence_type: source_model_result
    supports: The article reports gain/phase methods and modeled mass-transfer effects on phase lag and gain loss; selected
      text compares time-/frequency-domain PDE solutions with steady-state-linearized analytical frequency responses for
      simple adsorption/desorption and assumes linear response only for small-amplitude modulation. Full equations remain inaccessible.
  - source_id: urmes2022
    locator: Publisher abstract
    evidence_type: source_model_result
    supports: The abstract reports that an optimized single-site transient model reproduces measured outlet molar-fraction
      histories over tested small-amplitude flow modulation frequencies and amplitudes.
  - source_id: proposal_main
    locator: Methodology §3.4, waveform parameterization and Phase 3 actuation/measurement plan (lines 257–260,
      278–279)
    evidence_type: derived_under_assumptions
    supports: Frequency-domain interpretation requires defining realized input and measured output at physical boundaries;
      the proposal does not report identified transfer functions.
