- id: ma_Damkohler
  parent: u_ma_scaling
  title: Damköhler numbers and source scaling
  kind: concept
  maturity: ai_worked_out
  relevance: core
  summary: Da compares chemical-source time to transport/residence time; its form changes with kinetic order and
    source basis.
  explanation: For a pseudo-first-order effective gas source κ in s⁻¹, Da=κL/u_i=κτ_res. For nonlinear rates, define
    a reference source S_ref in mol m⁻³ void s⁻¹ and concentration C_ref; then κ_ref=S_ref/C_ref. If the source
    originates per catalyst mass, convert it to void-volume basis before computing κ. Multiple reactions generally
    need multiple Da values or a local state-dependent source ratio.
  assumptions:
  - A single scalar Da is only representative near its reference composition and temperature.
  - The rate law and catalyst-mass basis must be declared.
  equations:
  - name: reference Damköhler number
    expression: Da_ref = (S_ref/C_ref) L/u_i = κ_ref τ_res
    variables: S_ref [mol m⁻³ void s⁻¹]; C_ref [mol m⁻³ void]; τ_res=L/u_i.
    conditions: Reference state and source basis explicitly declared.
