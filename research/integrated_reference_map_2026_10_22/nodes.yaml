- id: u_ph_kinetics
  parent: physics
  title: Kinetic law, thermal dependence and surface-memory closures
  kind: proposed_theme
  maturity: ai_worked_out
  summary: Rate laws are closures derived from a selected mechanism and rate basis; surface PSSA, explicit coverage
    ODEs and empirical LHHW fits are distinct model choices.
  explanation: An elementary-step model specifies adsorption, desorption, site occupancy and reaction fluxes. Quasi-equilibrium/PSSA
    elimination can yield algebraic Langmuir–Hinshelwood rates while the gas reactor remains transient. Explicit
    coverages add chemical storage and require independently justified elementary parameters and consistent gas-plus-surface
    balances. Empirical fitted closures such as the local Larsen BEP thesis model can be useful within their tested
    catalyst/feed range but are not automatically microkinetic or transferable. Arrhenius reparameterization is
    an algebraic choice, not a remedy for structural or practical non-identifiability.
  equations:
  - dθ/dt = S_s r_s(θ,c,T), subject to site balance
  - k(T)=k(T_ref) exp[−E_a/R (1/T−1/T_ref)] (reference-rate Arrhenius form)
  assumptions:
  - PSSA is a local closure, not a claim that the whole reactor is steady.
  - Rate basis and gas/adsorbate coupling must be dimensionally and stoichiometrically consistent.
  limitations:
  - No target-specific transient surface coefficients or validated dynamic coverage model are available.
  open_questions:
  - Which closure is identifiable from target-catalyst transient data?
  - Are adsorption and surface relaxation times comparable to feasible forcing periods?
  status: integrated_ai_reference
  claim_refs:
