- id: u_ma_numerics
  parent: mathematics
  title: Discretization, stiff integration and numerical verification
  kind: proposed_theme
  maturity: ai_worked_out
  summary: Spatial discretization creates a stiff finite-dimensional system whose conservation, stability and convergence
    must be checked independently of physical validity.
  explanation: Finite-volume or conservative method-of-lines schemes keep bed fluxes explicit; upwind convection
    is robust but numerically diffusive at high Péclet number, while higher-order schemes need boundedness checks.
    BDF/Radau are candidate implicit integrators for stiffness, not proof that the system is stiff before target
    rates are known. Discontinuous inputs can be integrated with event-aligned steps; splines and Fourier series
    introduce different approximation errors. Verify mesh/time convergence, species/site closure, positivity and
    limiting cases before fitting or optimizing.
  equations:
  - 'MOL: dx_h/dt = F_h(x_h,u,t)'
  - 'Periodic residual: ||x(T)−x(0)|| ≤ stated tolerance'
  assumptions:
  - Solver choice follows stiffness and smoothness diagnostics.
  - Input switching times are represented consistently.
  limitations:
  - No simulator, solver benchmark, fitted model or mesh-convergence result was produced in this data task.
  open_questions:
  - What refinement and balance tolerances are small relative to the claimed difference?
  - Do alternative schemes converge to the same periodic objective?
