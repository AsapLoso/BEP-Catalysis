  title: Surface states and site inventory
  kind: theme
  maturity: ai_worked_out
  relevance: core
  summary: Coverage states represent a catalyst-specific site inventory and retain memory only on modes slower than
    local forcing.
  explanation: A surface model augments gas concentrations with coverages θ_l. For one site family, vacant plus
    occupied sites obey a site balance; multidentate adsorbates require occupancy factors and multiple site families
    require distinct balances. Dynamic coverage ODEs follow selected adsorption, desorption and surface-reaction
    steps. Quasi-steady elimination is justified only if relevant coverage modes are fast relative to local gas
    changes and the reduction preserves outputs of interest. Stoichiometry alone does not select a coverage state
    list.
  assumptions:
  - Coverage states are latent unless a surface-sensitive measurement is available.
  - Site family, occupancy and ideal-activity assumptions require catalyst-specific support.
  equations:
  - name: single-lattice site balance
    expression: θ_* + Σ_l s_l θ_l = 1
    variables: θ_* vacant-site fraction; θ_l adsorbate fraction; s_l occupied sites per adsorbate.
    conditions: One site family; fractions share the same site-density basis.
  - name: surface state balance
    expression: dθ/dt = N_s r_s(c_g, θ, T)
    variables: θ surface-fraction vector; N_s signed surface stoichiometry; r_s elementary rates on compatible site
      basis.
    conditions: Mechanism-specific states; rates conserve sites and feasible coverages.
