- id: ma_numerical_stability
  parent: u_ma_numerics
  title: Numerical stability, positivity and invariant constraints
  kind: concept
  maturity: ai_worked_out
  status: integrated_ai_reference
  summary: A stable time integrator does not by itself preserve nonnegative concentrations, site closure, conservation
    or accuracy in a stiff semidiscrete reactor.
  explanation: Spatial discretization converts advection–dispersion PDEs and surface ODEs into a finite-dimensional
    system. Explicit methods are restricted by stability limits that scale with grid spacing and transport/reaction
    rates; implicit BDF or Radau methods can handle many stiff systems more efficiently but still require tolerances,
    Jacobian treatment and step control. High-Péclet central differences may oscillate, upwind fluxes add numerical
    diffusion, and positivity can fail for some schemes or large steps. Integrate across square-wave switches with
    event-aligned intervals. Verify mass/element balance, θ_*+Σs_lθ_l=1, nonnegativity, and convergence under mesh
    and tolerance refinement; none of these checks proves physical model validity.
  equations:
  - name: semi-discrete MOL system
    expression: M_h ẏ = F_h(y,u,t)
    variables: y collects cell/element gas states and any coverage/thermal states; M_h is the discrete accumulation/volume
      matrix; F_h contains boundary fluxes, transport and reaction sources.
    conditions: Conservative spatial discretization; algebraic closures may yield a DAE rather than an explicit
      ODE.
  assumptions:
  - The spatial scheme and time integrator are stated separately.
  - Observed solver stability is checked under refinement and balances.
  limitations:
  - No target Jacobian spectrum, stiffness ratio, solver workload or positivity result is computed.
  claim_refs:
