  summary: Explicit coverages store adsorbate inventory; reactor transients can also arise from gas, pellet, thermal,
    actuator or analyzer dynamics.
  explanation: 'Relevant modes include adsorption/desorption and surface reaction, gas residence and axial dispersion,
    pellet diffusion/storage, actuator/mixer, analyzer filtering, thermal response, and slower restructuring/deactivation.
    If coverage modes relax much faster than local gas changes, quasi-steady coverage may be reasonable; comparable
    or slower modes can retain history. A timescale match or resonance window is not sufficient for improvement:
    sign depends on nonlinear response, objective, constraints and transport. Stiffness is numerical, not a synonym
    for fast physical response.


