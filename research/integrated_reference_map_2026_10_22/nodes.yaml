  title: Surface-state ODE and algebraic closure
  kind: concept
  maturity: ai_worked_out
  relevance: core
  summary: Dynamic coverages add memory states; site balances and rate conventions close the surface subsystem.
  explanation: For surface species l, dθ_l/dt=Σ_jν^s_lj r^s_j when elementary rates are normalized per active site.
    A site balance constrains vacancies and adsorbates. A quasi-steady surface model instead sets dθ/dt=0 and solves
    algebraic equations; that reduction should be assessed against forcing frequencies, stiffness and identifiability.
    Algebraic constraints or quasi-steady variables can produce a DAE or nonlinear algebraic solve after spatial
    discretization.
  assumptions:
  - Kinetic mechanism and active-site density must be explicit.
  - PSSA is a model assumption, not a universal property of catalytic kinetics.
  equations:
  - name: surface balance
    expression: dθ/dt = ν^s r^s(p, θ, T)
    variables: θ dimensionless coverages; ν^s signed surface stoichiometry; r^s normalized per-site rates [s⁻¹].
    conditions: Rates normalized to active-site basis; choose a separate inventory equation for each site family.
  - name: algebraic site constraint
    expression: θ_* + Σ_l s_l θ_l = 1
    variables: θ_* vacancy fraction; s_l occupancy count.
