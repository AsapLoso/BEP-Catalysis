- id: sc_identification_vs_performance
  parent: u_sc_excitation
  title: Kinetic Identification Is Not Performance Improvement
  summary: Periodic data that identify transient kinetics do not show that periodic operation beats an optimized
    steady state.
  explanation: Urmès et al. (2022) use small periodic flow perturbations to estimate a Pd/α-Al₂O₃ kinetic model
    and reproduce tested outlet compositions. That addresses dynamic identification/prediction. Performance improvement
    requires a separate comparison of net product over a settled or stated finite horizon against an optimized steady
    point with matched constraints. Kaps et al. (2026) report a laboratory methanol CSTR experiment with 4.4% higher
    productivity and 4.6% higher yield than a selected steady reference using the same mean inlet molar flows. The
    article separately calculates model-optimized Pareto fronts; the measured reference is not an empirical global
    search over every steady-feasible condition. Catalyst deactivation across the three-month campaign reduced performance
    in both modes and weakened quantitative agreement. These works answer different questions, and neither outcome
    transfers quantitatively to the BEP catalyst. A complementary full-text fixed-bed ODH study reports no average
    conversion/selectivity change in its tested dynamic conditions, illustrating that periodic profiling can be
    useful even where measured performance is unchanged.
  assumptions:
  - A dynamic model publication is not evidence that its input maximizes product.
  - Cross-reaction FPO cases inform methods, not target-system parameters.
