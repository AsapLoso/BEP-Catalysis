- id: ph_danckwerts
  parent: u_ph_transport
  title: Inlet and outlet flux boundary conditions
  kind: concept
  maturity: ai_worked_out
  relevance: core
  summary: Boundary conditions must match the conservative axial flux and the physical entrance/exit assumptions.
  explanation: 'For positive axial superficial flow and total gas-phase flux J_i=u_s C_i−ε_bD_ax,i∂zC_i, a Danckwerts
    inlet matches the imposed upstream feed flux to the bed-face total flux: u_sC_i,in=J_i(0). A common outlet condition
    is zero dispersive gradient, ∂zC_i(L)=0. Danckwerts (1953) directly derives analogous boundaries for a steady
    first-order packed-tube model: feed-flux matching at the inlet and zero concentration gradient at the outlet.
    The source uses its own apparent-D and mean-velocity basis, assumes no volume change and spatially constant
    k, and does not validate the generalized ε_b/u_s convention for the BEP apparatus.'
  assumptions:
  - Use the same velocity, dispersion and porosity convention as the PDE.
  - The outlet condition assumes negligible back-dispersion into an external downstream domain.
  equations:
  - name: Danckwerts inlet
    expression: u_s C_i,in = u_s C_i(0) − ε_b D_ax,i ∂C_i/∂z|_(0)
    variables: u_sC is convective flux; −ε_bD_ax∂zC is dispersive flux.
    conditions: Positive z flow; upstream feed specified; coefficient convention matches the conservative balance.
  - name: dispersive-flux outlet
    expression: ∂C_i/∂z|_(L) = 0
    variables: C_i is gas-phase concentration.
    conditions: Common exit approximation for a downstream convective outlet.
  - name: Danckwerts 1953 steady source model
    expression: D d²c/dy² − u dc/dy − k c = 0
    variables: c is concentration (the paper does not assign an absolute unit; mol m⁻³ is one possible chosen basis);
      y [m] axial coordinate; D [m² s⁻¹] apparent longitudinal diffusivity; u [m s⁻¹] mean axial velocity; k [s⁻¹]
      implied for a first-order rate constant, with no explicit unit printed.
    conditions: 'Source Eqs. (30)–(32): steady 1-D first-order model, constant mean velocity and no volume change;
      not a transient catalytic PDE.'
  - name: Danckwerts 1953 source boundaries
    expression: u c* = u c(0) − D ∂c/∂y|₀;  ∂c/∂y|L = 0
    variables: c* is feed concentration; outlet concentration is f c* after its zero-gradient condition.
    conditions: Source Eq. (31) matches inlet total flux; Eq. (32) imposes zero concentration gradient at y=L under
      the stated steady model. Coefficient basis differs from generalized ε_b/u_s equation above.
  claim_refs:
  - source_id: proposal_main
    locator: Methodology §3.1 (line 185)
    evidence_type: proposal_hypothesis
    supports: Proposal selects Danckwerts-type boundary conditions but does not write their equations.
  - source_id: danckwerts1953
    locator: Printed p. 10, § Reactors, Eqs. (30)–(32)
    evidence_type: source_model_result
    supports: The article directly derives a steady first-order packed-tube balance with inlet feed-flux matching
      and a zero-gradient outlet; its apparent-D/mean-velocity basis and fixed-flow assumptions do not validate
      the integrated map’s generalized porosity/velocity convention or select boundaries for the BEP apparatus.
  related_ids:
  - ph_axial_balance
  - ma_initial_boundary
  - ma_numerical_checks
  open_questions:
