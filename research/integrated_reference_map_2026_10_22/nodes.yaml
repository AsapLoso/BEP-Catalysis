- id: u_sc_plant
  parent: systems_control
  title: Plant, input realization and model boundary
  kind: proposed_theme
  maturity: ai_worked_out
  summary: Separate the input command, actual bed-plane composition, distributed reactor states and measured output.
  explanation: A plant boundary includes gas supplies, flow controllers, mixer and line volumes, packed bed, downstream
    analyzer and data acquisition. Composition, component molar flow and total flow are coupled through dilution
    and switching; the command is not the bed inlet. A measured outlet response combines kinetics with transport
    and measurement dynamics. Simple course control examples are foundations, not validation of a catalyst or reactor
    model.
