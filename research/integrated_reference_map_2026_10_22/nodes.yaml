- id: ma_periodic_orbit
  parent: u_ma_periodic
  title: Periodic orbit and Poincaré map
  kind: concept
  maturity: ai_worked_out
  relevance: core
  summary: A settled periodic state is a fixed point of the period map; settled-cycle and startup objectives differ.
  explanation: For a declared periodic input u(t+T)=u(t), let P(x₀)=Φ_T(x₀) be the period map for the complete modeled
    state. A periodic solution is a fixed point P(x*)=x*. A cycle-average objective is meaningful after measured
    and modeled outputs settle into a repeatable orbit, unless startup itself is the finite-horizon objective. Local
    asymptotic stability of a differentiable orbit requires ρ(DP(x*))<1; this is a local criterion and proves neither
    existence, uniqueness nor convergence from every initial state. Fast gas, coverage or thermal states may appear
    periodic while catalyst deactivation drifts over a longer campaign; omitting that slow state changes the physical
    question. Kaps et al. (2026) judged a particular CSTR experiment cyclically settled from similarity of at least
    two responses, while documenting slower catalyst deactivation across the campaign. That empirical check is source-specific,
    not a universal stability test.
  assumptions:
  - The full state includes each state whose evolution materially affects cycle-to-cycle output; omitted aging requires
    an explicit quasi-steady campaign approximation.
  - Input and parameters repeat each cycle for the period map.
  - The spectral-radius condition is local and uses a differentiable finite-dimensional period map.
  equations:
  - name: Poincaré map
    expression: x_{n+1}=P(x_n)=Φ_T(x_n); periodic orbit satisfies P(x*)=x*
    variables: x is the full semi-discrete bed/surface state; T is input period.
    conditions: The same periodic input and parameters apply each cycle.
  - name: local stability of a periodic orbit
    expression: x*=P(x*); ρ(DP(x*))<1
    variables: P is the one-period state map; DP(x*) its Jacobian at a periodic fixed point; ρ spectral radius.
    conditions: Local asymptotic stability criterion; not an existence or global-convergence theorem.
  claim_refs:
  - source_id: proposal_main
    locator: Methodology §3.4 (lines 257–263, 275–279)
    evidence_type: derived_under_assumptions
