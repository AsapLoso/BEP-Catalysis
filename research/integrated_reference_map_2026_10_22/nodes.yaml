    evidence_type: source_model_result
    supports: A source-specific process model includes catalyst campaign activity evolution, illustrating why comparisons
      under deactivation may need matched finite-horizon or lifecycle objectives; it does not validate a BEP periodic
      comparator.
  - source_id: kaps2026
    locator: §3.2 modeled Pareto comparison; §4.4 EXP1/EXP1SS; §5 conclusions
    evidence_type: source_observation
    supports: For methanol CSTR, the paper reports experimental FPO against a selected reference with matching time-average
      inlet molar flows; model-based optimized Pareto fronts are a separate analysis under the source model/constraints.
