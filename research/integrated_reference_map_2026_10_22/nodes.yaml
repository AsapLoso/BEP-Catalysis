- id: u_ma_conservation
  parent: mathematics
  title: Stoichiometric and continuum conservation models
  kind: proposed_theme
  maturity: ai_worked_out
  summary: A consistent coupled model starts from gas and surface inventories, stoichiometric production rates and
    declared volume/mass bases.
  explanation: The gas PDE and coverage ODE must use the same reaction extents, signs and catalyst inventory basis.
    A per-catalyst-mass rate multiplied by catalyst mass per bed volume gives a volumetric source; if a rate is
    per bed volume, the solid fraction must not be multiplied again. With explicit adsorbate storage, gas adsorption/desorption
    and surface accumulation must close elemental inventories together. The compact equation in the proposal is
    clarified below as a derived convention, not reproduced as a uniquely defined formula.
  equations:
  - ∂(εc)/∂t + ∂J/∂z = (1−ε)ρ_cat N r
  - dθ/dt = S_s r_s (or justified algebraic closure)
  assumptions:
  - Continuum averaging and one-dimensional geometry are model reductions.
  - Initial and boundary conditions are part of the model.
  limitations:
  - The final target model basis and catalyst-density convention remain undecided.
  open_questions:
  - Which conserved quantities and dimensions will be checked?
  - Which boundary convention represents the inlet/outlet hardware?
  status: integrated_ai_reference
