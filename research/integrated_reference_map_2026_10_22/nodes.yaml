    under the measured forcing?
  - Which parameter combinations remain structurally confounded after the actual inlet and analyzer dynamics are
    included?
  - Does a generic rank result persist for target-specific initial states and feasible periodic inputs?
  status: integrated_ai_reference
  limitations:
  - The cited mathematical methods use general or biological ODE examples; no BEP observability calculation is reported.
