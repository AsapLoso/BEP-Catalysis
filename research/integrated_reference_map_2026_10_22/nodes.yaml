  title: Mathematical optimization and optimal-control formulations
  kind: theme
  maturity: ai_worked_out
  status: integrated_ai_reference
  summary: Optimization methods solve a declared constrained objective over steady controls or dynamic trajectories;
    algorithm output is not a global-optimality proof.
  explanation: 'The mathematical layer distinguishes a nonlinear program over steady inputs, an optimal-control
    problem over time-varying inputs, the chosen finite-dimensional transcription, and the numerical solver. Direct
    shooting, multiple shooting and collocation make different state/constraint tradeoffs; adjoint or indirect methods
    require differentiability and boundary conditions. Nonconvexity, periodic closure and hardware constraints can
    produce multiple stationary solutions. A local search does not inevitably return a local minimum for a maximization
    problem, and a feasible candidate does not establish a global optimum.


