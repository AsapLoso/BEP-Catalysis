  summary: The desired intermediate sits between reactant and over-hydrogenated product, with competing pathways
    that complicate selectivity.
  explanation: 'Acetylene semi-hydrogenation is commonly represented by C₂H₂ + H₂ → C₂H₄ followed by C₂H₄ + H₂ →
    C₂H₆. Ethylene is both desired product and reactant for the second step. The two-step chain is a minimal network
    for explaining an intermediate-yield optimum; real catalysts can also form oligomers, carbonaceous deposits,
    methane or other products. Product metrics must specify feed ethylene and a carbon/molar basis.


