- id: ma_pde_ode_coupling
  parent: u_ma_conservation
  title: Coupling distributed gas balances to local surface kinetics
  kind: concept
  maturity: ai_worked_out
  status: integrated_ai_reference
  summary: At each axial location, local gas composition and temperature drive catalyst rates; those rates feed
    gas balances and, under dynamic closure, surface inventory equations.
  explanation: A bed-scale model may be represented as ε_b∂ₜC_i+∂z(u_sC_i)=∂z(ε_bD_ax,i∂zC_i)+(1−ε_b)ρ_pΣ_jν_ijr_j
    and ∂ₜθ=ν_s r_s(p,θ,T). Here C_i is mol per void-gas volume, u_s superficial velocity, ε_b bed void fraction,
    D_ax axial dispersion, ρ_p catalyst mass per pellet volume and r_j per catalyst mass. With constant properties,
    dividing by ε_b gives an interstitial-velocity form. The algebraic PSSA alternative substitutes r_j(C,T) without
    an independent θ state. If pellet radial transport is resolved, C_i gains an additional radial field and may
    require quasi-steady or transient coupling. Use one consistent basis; do not multiply a rate by a solid fraction
    twice.
  equations:
