  summary: A forcing-to-residence ratio describes how many temporal cycles occur over one reactor residence time.
  explanation: Following the proposal's verbal convention, St=τ_res/T_pulse=L/(u_iT_pulse). If angular frequency
    ω=2π/T_pulse is used, the alternative ωτ_res equals 2πSt; these should not be conflated. St≪1 means slow forcing
