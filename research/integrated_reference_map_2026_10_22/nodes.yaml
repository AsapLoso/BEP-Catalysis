- id: u_ph_transport
  parent: physics
  title: Packed-bed, pellet and interphase transport
  kind: proposed_theme
  maturity: ai_worked_out
  summary: Gas, pellet, film and residence-time dynamics filter inlet forcing and couple local reaction rates to
    outlet response.
  explanation: The proposal’s core is a one-dimensional bed model; pellet diffusion and external film resistance
    are supporting extensions unless target criteria or data justify them. A conservative bed balance must identify
    void-gas concentration, superficial/interstitial velocity, dispersion flux, catalyst mass per bed volume and
    rate normalization. Danckwerts-type flux boundaries, measured residence-time response and actuator/analyzer
    transfer functions determine the realized waveform. A plug-flow approximation is a limit to justify, not a synonym
    for every packed bed.
  equations:
  - ∂(ε c_i)/∂t + ∂(u_s c_i)/∂z = ∂/∂z(D_ax ∂c_i/∂z) + (1−ε)ρ_cat R_i (stated basis required)
  assumptions:
  - One-dimensional axial geometry is a reduction.
  - Neglect of dispersion, film or pellet gradients requires a scale argument or data.
  limitations:
  - No target bed geometry, tracer response, particle transport coefficients or film-transfer evidence is present.
  open_questions:
  - What is the measured command-to-bed-plane transfer function?
  - Are axial, film or pellet timescales material at candidate frequencies?
  - Determine catalyst pellet geometry (spherical vs egg-shell impregnated layer).
  status: integrated_ai_reference
