- correction_id: CORR-B12-PROPOSAL-001
  record_type: proposal_thermodynamic_state_scope_correction
  source_id: proposal_main
  claim_ids: [CLM-ph_metrics-001]
  passage_id: BEP-PROP-B12-P02-STEADY-YIELD-ASSERTION
  locator: main.tex §1.1, line 117
  source_as_written: The proposal says steady-state surface coverages remain locked at fixed thermodynamic equilibrium and asserts an unavoidable cap on intermediate yield.
  finding: This passage documents a proposal rationale, not evidence for its universal limit. Stationary reactor operation, time-invariant surface coverage and thermodynamic equilibrium are distinct; a steady flow balance can coexist with transport and reaction source terms.
  disposition: Preserve the proposal as provenance for the hypothesis, but do not promote its cap/equilibrium wording to general physical fact. Require catalyst-specific kinetics and a matched optimized-steady benchmark before evaluating gain.
