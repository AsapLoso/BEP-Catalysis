  locator: §4.3, printed p. 16 prose and printed p. 17 Eqs. (4.12)–(4.13)
  source_findings: The prose describes dissociative H2 adsorption; Eqs. (4.12)–(4.13) show a linear K_H2 p_H2 term
    in the adsorption denominator. For simple quasi-equilibrium dissociative adsorption on equivalent sites, the
    adsorbed-H term normally scales with the square root of hydrogen pressure, but the thesis does not define its
    site convention or fitted parameter normalization.
  disposition: Record a source-model-form ambiguity rather than inferring molecular adsorption or silently replacing
    the printed expression. Keep the source's kinetic closure empirical until the underlying site balance/code is
    clarified.
