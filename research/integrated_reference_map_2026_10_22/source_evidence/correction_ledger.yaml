  disposition: Retain the 40-fold statement as proposal wording but mark its quantitative citation unresolved, not disproven. Reopen the full article or the underlying cited source before using the number. Do not transfer this thermal CO-oxidation result to acetylene feed-composition forcing, ethylene yield/selectivity or PdAg.
