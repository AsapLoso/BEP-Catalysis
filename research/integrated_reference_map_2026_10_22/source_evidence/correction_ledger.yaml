- correction_id: CORR-B14-DG19-001
  record_type: source_specific_numerical_method_scope
  source_id: di_giuliano_pellegrino2019
  claim_ids:
  - CLM-ma_explicit_transport_step_bound-002
  - CLM-ma_conservative_finite_volume-002
  locators:
  - Methods §3.1, Eqs. (37)–(42)
  - Methods §3.1.2, Eqs. (43)–(45)
  source_as_written: The article uses central finite differences and false-boundary ghost points for the method-of-lines spatial discretization; a forward spatial difference is separately used to calculate the velocity profile. Explicit Euler is also evaluated as a time integrator for the semidiscrete ODE system, where the authors report a severe case-specific stability restriction. Their reported simulations use ode23tb.
  finding: Spatial differencing used to calculate u(z,t), time integration of the semidiscrete state, and the distinct cell-integrated finite-volume derivation in the map are separate numerical choices. The paper's dimensionless Eq. (45) bound and reported J scale cannot be transferred to the BEP scheme.
  disposition: Preserve the source's two explicit-Euler roles and ode23tb simulation choice. Keep the finite-volume node's derivation distinct from this source's finite-difference implementation; do not generalize the reported time-step bound.
  human_verification_status: not_verified

- correction_id: CORR-SP-B14-DG19-001
  record_type: distinct_simulation_metric_trends
  source_id: di_giuliano_pellegrino2019
  claim_ids:
  - CLM-ph_variable_superficial_velocity-003
  passage_id: DG19-B14-P04-VELOCITY-COMPARISON-RESULTS
  locators:
  - Results §4.3, Figs. 6–7
  - Conclusions
  previous_statement: The first-pass batch compressed the constant-u inert-flow and cumulative CO2-balance diagnostics as artifacts that worsen together as inlet CO2 dilution falls.
  source_as_written: The article reports that outlet CO2-profile differences and the constant-u inert-N2-flow artifact increase with higher inlet CO2 concentration; separately, the constant-u cumulative CO2-balance deviation trends inversely with inlet CO2 mole fraction and is larger at lower y_CO2.
  finding: The two balance diagnostics have different trends with inlet composition. The source's conclusion that variable-u is more physically reasonable is a model-based interpretation of these diagnostics, not independent experimental validation.
  disposition: Keep the outlet-profile, inert-flow and cumulative-CO2-balance results distinct. Replace the compressed first-pass summary; do not state that every artifact worsens in the less-dilute feed direction.
  human_verification_status: not_verified

