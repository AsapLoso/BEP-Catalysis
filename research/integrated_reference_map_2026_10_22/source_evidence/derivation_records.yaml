- derivation_id: DRV-B1-DESIGN-216
  input_source_id: dehghani2019_pdag_alphaal2o3
  input_locator: printed p. 5, Table 3
  claim_ids:
  - CLM-c1_pdag_industrial_lhhw_decay-001
