- derivation_id: DRV-B2-K5-RECIPROCAL
  input_source_id: urmes2019
  input_locator: printed p. 5 ethylene adsorption text; printed p. 6 Table 5; printed p. 4 denominator
  claim_ids:
  - CLM-c2_urmes_2019_adsorption_denominator-003
  - CLM-c2_urmes_2019_parameter_ledger-001
  method: Invert the fixed denominator parameter K5 and compare the resulting adsorption-strength value with the
    text-reported ethylene equilibrium constant.
  hypotheses:
  - K5 is the reciprocal denominator convention shown as P_C2H4/K5 in the source equation.
  - Both source values use consistent Pa and Pa^-1 units.
  equation: 1/(7.4 Pa) = 0.135135 Pa^-1, which rounds to 0.14 Pa^-1 at two significant figures.
  units: Pa^-1 for the reciprocal adsorption strength
  conclusion: K5=7.4 Pa and the text's 0.14 Pa^-1 ethylene adsorption value are reciprocal-consistent to reported precision;
    this does not resolve the separate K1 conflict.
  limitations:
  - This checks internal unit/arithmetic consistency only; it is not an independent adsorption measurement or a parameter refit.
  human_verification_status: not_verified
- derivation_id: DRV-B3-K2-UNIT-DIMENSION
  input_source_id: borodzinski2000
  input_locator: printed p. 53 Table 1 model 5 and notation footnote; printed p. 60 Table 3; printed p. 65 Appendix A Eq. (A.45)
  claim_ids:
  - CLM-c1_borodzinski_ae_effective_rates-002
  method: Check dimensions of the Appendix A Eq. (A.45) ethylene-hydrogenation rate using the source's pressure basis and adsorption-constant units; compare the denominator power and printed parameter units with Table 1 and Table 3.
  hypotheses:
  - p_C2H4 and p_H2 are both expressed in kPa as stated in the Table 1 footnote.
  - The adsorption terms K_C2H2^E p_C2H2 and K_C2H4^E p_C2H4 are dimensionless because the K values are in kPa^-1.
  equation: "Appendix A.45: r2 = k2' p_C2H4 p_H2/(dimensionless denominator)^3; Table 1 model-5 ethylene term uses the same pressure product over a dimensionless denominator squared; either form requires [k2']=[r2]/kPa^2."
  units: k2' = mol_C2H6 mol_Pd^-1 s^-1 kPa^-2 under the stated assumptions
  conclusion: The dimensional requirement and Table 3 give k2-prime units kPa^-2, while the Table 1 footnote gives kPa^-3. Independently, Table 1 model 5 and Appendix A Eq. (A.45) print denominator powers 2 and 3 for the k2-prime term. Preserve both source conflicts; the denominator discrepancy does not alter this dimensional result because both denominators are dimensionless.
  limitations:
  - This checks dimensional consistency of the printed expression, not the authors' regression implementation or intended unit convention.
  - No author erratum or implementation code was checked.
  human_verification_status: not_verified
- derivation_id: DRV-B4-SPHERE-THIELE
  input_locator: Integrated node internal_diffusion_thiele, stated first-order spherical-pellet model and boundary conditions
  claim_ids:
  - CLM-internal_diffusion_thiele-001
  method: Solve the steady isothermal diffusion-reaction equation for a sphere with a first-order volumetric consumption rate, then integrate the local rate over the pellet and normalize by the rate at the external surface concentration.
  hypotheses:
  - Spherical pellet radius R_p; constant effective diffusivity D_eff; uniform catalyst and temperature.
  - Single irreversible first-order consumption r_A=k_v C_A, with k_v in s^-1 on pellet-volume basis.
  - No external film resistance; C_A(R_p)=C_A,s and dC_A/dr=0 at r=0.
  equation: 'C_A(r)/C_A,s = (R_p/r) sinh(Φ r/R_p)/sinh(Φ), where Φ=R_p sqrt(k_v/D_eff); η = 3/Φ^2(Φ coth(Φ)−1).'
  units: Φ and η dimensionless; R_p in m; k_v in s^-1; D_eff in m^2 s^-1.
  conclusion: The stated closed-form spherical effectiveness factor follows under the listed model assumptions; Φ>1 alone does not determine the direction of a multireaction selectivity change.
  limitations:
  - No target pellet radius, diffusivity, first-order rate constant or spherical geometry has been established.
  - Nonlinear competitive-adsorption kinetics require solving the nonlinear pellet boundary-value problem rather than using this closed-form η(Φ).
  human_verification_status: not_verified
- derivation_id: DRV-B4-CARBERRY-DIMENSION
  input_source_id: berger2008
  input_locator: Printed p. 11, Table 2 and printed p. 5 Nomenclature
  claim_ids:
  - CLM-external_film_transfer-001
  method: Substitute the source's stated units for the observed rate, film coefficient, specific particle surface area and bulk concentration into the Carberry expression.
  hypotheses:
  - The dimension check assumes r_obs is volumetric rate on the particle-volume basis, mol m^-3_particle s^-1, matching a' in m^2_particle/m^3_particle; Berger's nomenclature reports the rate basis as m^3_cat.
  - k_g is m s^-1; c_b is mol m^-3_gas.
  equation: "[k_g a' c_b] = (m s^-1)(m^-1)(mol m^-3) = mol m^-3 s^-1; therefore C_a = r_obs/(k_g a' c_b) is dimensionless if the rate-volume bases match."
  units: C_a dimensionless; source screening value C_a<0.05 is listed in Table 2 under its definitions.
  conclusion: The Carberry expression is dimensionally consistent conditional on matching the source's catalyst-volume rate basis to its particle-volume specific-area basis; it is distinct from the inherited Mears formula.
  limitations:
  - This checks the source's units, not whether its particle geometry or threshold applies to the BEP reactor.
  - No target k_g, particle size, surface area or matched rate basis was checked.
  human_verification_status: not_verified

- derivation_id: DRV-B14-STOICHIOMETRIC-SUPERFICIAL-VELOCITY
  input_source_id: di_giuliano_pellegrino2019
  input_locator: "Introduction, Eqs. (1)–(3); summed gas balance under BEP two-reaction stoichiometry"
  claim_ids:
  - CLM-ph_variable_superficial_velocity-002
  method: >-
    Sum the gas-species balances in the conservative ADPFR form. Under constant total gas concentration, the axial-dispersion term for total concentration vanishes; substitute the net gas-mole stoichiometry of each stated BEP reaction.
  hypotheses:
  - Ideal gas and spatially uniform pressure and temperature, so C_T = P/(R T) is constant.
  - All gas species use one consistent molar-concentration and volume basis; the source term R_T is expressed on that same basis.
  - Common axial dispersion is assumed as in the summed model form; gas holdup is fixed.
  - Only C2H2 + H2 -> C2H4 and C2H4 + H2 -> C2H6 are included; r1 and r2 are nonnegative forward extent rates.
  equation: >-
    Σ_i ∂C_i/∂t = D_R ∂²C_T/∂z² - ∂(u C_T)/∂z + Σ_i r_i;
    for constant C_T and steady local total accumulation, C_T ∂u/∂z = Σ_i r_i.
    Since each forward reaction has Δν_gas = -1, Σ_i r_i = -(r1+r2), giving ∂u/∂z = -(r1+r2)/C_T.
  units: "∂u/∂z has s^-1; each rate density divided by C_T has s^-1."
  conclusion: >-
    Under the stated model and fixed P,T conditions, positive forward rates in the two-step network imply a local downstream decline in u. This is a conditional stoichiometric consequence, not a calculated or measured BEP flow profile.
  limitations:
  - Pressure drop, temperature gradients, varying bed/particle voidage, side reactions, reverse rates, changing gas-basis definitions or inconsistent catalyst-mass versus gas-volume rate bases change the derivation.
  - Axial dispersion was assumed common across species; a different species-dependent transport closure needs its own total-balance derivation.
  - The result does not establish that the velocity variation is large enough to alter BEP selectivity or controller performance.
  human_verification_status: not_verified
