- derivation_id: DRV-B1-AMRE-METRIC
  input_source_id: dehghani2019_pdag_alphaal2o3
  input_locator: printed p. 8, Eq. (26)
  claim_ids:
  - CLM-c1_pdag_industrial_lhhw_decay-003
  method: Read the denominator and normalization in the displayed equation.
  hypotheses:
  - N is positive; each y_exp(i) is nonzero.
  equation: AMRE = (100/N) Σ_i |y_exp(i) − y_model(i)|/y_exp(i)
  units: percent; dimensionless relative residual
  conclusion: Eq. (26) is mean relative absolute error in percent; it is not an unnormalized MAE.
  limitations:
  - No error distribution or parameter-uncertainty information follows from this scalar objective.
  human_verification_status: not_verified
- derivation_id: DRV-B1-ERGUN-SIGN
  input_source_id: dehghani2019_pdag_alphaal2o3
  input_locator: printed p. 8, Eq. (25); nomenclature pp. 20–21
  claim_ids:
  - CLM-c1_pdag_industrial_lhhw_decay-004
  method: Evaluate signs and dimensions of both printed RHS terms under the stated conditional convention.
  hypotheses:
  - z increases downstream; V is positive downstream superficial velocity; 0<ε<1; μ, ρ, D_p and φ are positive;
    φ dimensionless.
  equation: RHS(25)>0, while the conventional pressure-drop form under these conventions is −dP/dz=RHS>0, hence
    dP/dz<0.
  units: Each RHS term has pressure-per-length dimensions when V is m/s, μ is Pa·s, ρ is kg/m³ and D_p is m.
  conclusion: The positive printed sign conflicts with a downstream pressure decrease under the conditional convention;
    the source convention is insufficiently defined to declare an unconditional typographical error.
  limitations:
  - The paper nomenclature does not define V or φ, and labels ε only “porosity”.
  - No author clarification was obtained.
  human_verification_status: not_verified
