  - Table 4.1 reports 0.025, 0.05 and 0.1 wt% Pd with 5 wt% Ag; “Pd0 Ag” is the lowest-Pd sample label, not a zero-Pd catalyst.
  - §4.2 reports 80 °C for the experiment while the abstract and §6.1/Table 6.1 report 100 °C; this source-internal condition conflict remains unresolved.
