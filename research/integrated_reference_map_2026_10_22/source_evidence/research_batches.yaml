  scientific_results:
  - The 2000 paper's observed H2-normalized rate trends at 343 K motivate A/E families but do not directly image site geometry; its own mechanistic model aggregates previously distinguished A1/A2 sites.
  - The 2000 Appendix A imposes algebraic equilibrium/steady-state reductions, drops selected coverage terms, and assumes a much smaller stationary E-site population; it does not describe finite-rate within-cycle coverage or evolving deposits.
  - The 2000 model's highest F_c is among four stated comparator equations fitted to that paper's commercial Pd/alpha-Al2O3 dataset; the authors say this is not decisive proof and report two parameter-pair correlations above 0.8.
  - Appendix A Eq. (A.45) and Table 1 model 5 print different denominator powers (3 versus 2) for the k2-prime ethylene-hydrogenation term. This was missed in first pass and is now represented in separate page-specific evidence records and an open uncertainty.
  - The pressure product and dimensionless competitive denominator imply k2-prime in kPa^-2; Table 3 agrees while the Table 1 footnote says kPa^-3. This independent unit discrepancy remains open.
  - The 2006 article is a review synthesis: it discusses A/E/deposit interpretations, oligomer/coke formation, pore-diffusion changes, and hydride/carbide evolution. It emphasizes catalyst/support/condition dependence and unresolved or contradictory results.
  - The review's Weisz-Prater criterion and nearly tenfold ethyne-diffusivity effect are secondary-source context; the underlying primary references and BEP particle inputs were not independently checked in this batch.
  - Cross-source comparison reuses B2 passage URM19-P06-SINGLE-VS-TWO-SITE: Urmes et al. (2019) found the second-site regression terms non-significant when comparing the Borodzinski-Cybulski model against their own 0.05 wt% Pd/alpha-Al2O3 dataset; the authors allow that sites may be indistinguishable under their tested conditions. This is not a refit to the 2000 dataset or a universal rejection of two-site models.
  remaining:
  - Reopen primary studies cited by the 2006 review for deposit, hydride, carbide and diffusion claims before using those details as independent evidence.
  - Clarify the Table 1 versus Appendix A denominator-power mismatch and Table 1/Table 3 k2-prime unit discrepancy before reproducing or transferring the model.
  - Do not infer target PdAg A/E sites, hydride/carbide states, catalyst aging rates or pellet diffusion from either Pd source.
  validation: >-
    Both validators pass at the B3 second-pass checkpoint: validate_source_evidence.py reports 46 passages, 28/28 quote checks, 34 current links with passage evidence, 306 without, and zero errors; validate_data.py reports 143 nodes, 340 claims, 96 historical attachments, 24 uncertainties and zero graph errors. This is integrity and provenance validation, not scientific truth or human review.
