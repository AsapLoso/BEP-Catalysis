  findings:
  - >-
    Equations (17)–(18) give the source's local first-order covariance approximation and Fisher-information matrix as
    sensitivity outer products weighted by inverse measurement-error variance. The design minimizes the determinant
    of expected covariance over bounded linear-ramp variables; this is a parameter-precision objective, not reactor
    performance.
  - >-
    The likelihood and design are conditional on a selected kinetic structure, controlled inputs, a Gaussian residual
    model, nominal parameter values and experimental bounds. The authors regard their prior estimates as useful and
    state that high parameter uncertainty can make nominal MBDoE suboptimal; robust design is an alternative, not
    demonstrated for the BEP.
  - >-
    The homogeneous benzoic-acid/ethanol esterification case reports more precise estimates for compared MBDoE ramps.
    A two-hour flow-and-temperature ramp achieved precision similar to the compared eight-hour steady campaigns when
    good initial estimates were available. This is experiment efficiency and identification evidence, not higher product
    yield/selectivity under transient operation.
  - >-
    Cross-predictions match the studied transient and steady data within reported measurement error, but one Ramp FT
    MBDoE confidence region fails to overlap two comparison regions; unknown disturbance or measurement-error
    assumption misspecification remain possible explanations. The article itself warns that model accuracy in new
    regions needs additional testing.
  - >-
    The transient-PFR-to-batch ODE treatment assumes ideal PFR behavior and timing information. The setup uses HPLC
    samples every seven minutes and corrects the 44.2 microlitre downstream tubing dead volume; these choices cannot
    set the BEP's sensor bandwidth or time-alignment model.
  - >-
    The authors restrict their rapid transient-estimation method to systems with a sufficiently fast catalyst response
    relative to the ramp. This is a method applicability caveat, not a universal requirement for performance gains:
    finite surface memory could be central to a dynamic hydrogenation model and would require explicit states.
  - >-
    The Introduction characterizes cited sinusoidal kinetic-probing protocols as harder to implement and without
    significant advantage over ramps in that experiment-design context. The article does not test sinusoidal forcing
    here, and the comparison says nothing about cycle-average reactor performance.
