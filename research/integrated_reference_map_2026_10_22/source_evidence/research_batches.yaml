  - Selected parameter intervals use a finite-difference Jacobian and are described as approximate for nonlinear multiresponse regression; the article also identifies parameter coupling and limited temperature range.
  - Prediction comparisons use study-specific datasets; Urmès data are incorporated into combined model fitting. No periodic inlet policy or matched optimized-steady benchmark is tested.
