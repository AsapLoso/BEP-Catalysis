  - The paper compares 0.05 wt% Pd/α-Al2O3 diluted ethylene-rich tail-end conditions with a 1 wt% Pd/α-Al2O3 acetylene-rich post-plasma-like regime; metal loading, measured dispersion and feed differ.
  - Its single-site rate representation is explicitly scoped to near-atmospheric pressure, stated as 1–2 bar, and absence of CO. This differs from the Pd-Ag two-site model in Pachulski et al. (2012) by catalyst, support, feed and model assumptions; it is not a universal contradiction or direct site-population measurement.
