  scientific_results:
  - The local first page confirms Berger et al.'s Applied Catalysis A review and DOI 10.1016/j.apcata.2008.03.020; the retained Crossref correction receipt identifies the legacy Chemical Engineering Science DOI as an unrelated nanofluidization paper. Crossref was not re-queried during B4.
  - Berger distinguishes stimulus, reacting and analysis systems; it includes periodic programmed input as a method and describes SSITKA as changing isotope composition while preserving total concentrations and catalyst conditions.
  - The review explicitly distinguishes dynamic surface ODEs from an algebraic fast-surface assumption and presents a method-of-lines packed-bed example for SO2–NOx adsorption on Na/γ-Al2O3. This is cross-system modeling evidence, not a PdAg mechanism or target state model.
  - In that example, fractional coverages are normalized by sorbent site capacity. Seven four-response step experiments are fitted; Jacobian t-values depend strongly on finite-difference step size and the reported maximum binary correlation is source-specific.
  - Berger §5/Table 2 names Carberry, Wheeler–Weisz and Prater criteria, with extra transient diagnostics. It does not name Mears or derive a Thiele modulus/effectiveness factor; inherited formula attributions are narrowed and left open.
  - The separate post-commit pass corrected the Carberry surface-area notation from a_0 to the source's a' (prime), and made the dimensional check conditional on matching the m^3_cat rate basis to the particle-volume basis.
  - The centered Arrhenius Eq. (17) is a source-specific parameterization example; algebraic equivalence does not imply guaranteed identifiability improvement.
