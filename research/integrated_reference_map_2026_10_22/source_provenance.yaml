correction_notes:
- legacy_claim: Berger et al. 2008 Chemical Engineering Science 63, DOI 10.1016/j.ces.2008.08.012
  bibliographic_metadata_source_id: berger_wrong_doi_metadata
  corrected_source_id: berger2008
  basis: Crossref identifies the old DOI as Nanofluidization as affected by vibration and electrostatic fields;
    the local Berger PDF and Crossref identify Dynamic methods for catalytic kinetics as DOI 10.1016/j.apcata.2008.03.020.
- legacy_claim: Larsen MSc Thesis (2024)
  resolved_source_id: larsen_bep_pdf
  basis: Local PDF is present; title page labels the work BEP, but does not state a year or awarding institution.
    The filename contains 2024 and PDF metadata creation is 2026-06-26.
- legacy_claim: Bos & Westerterp (1993), selective hydrogenation review
  resolved_source_id: bos_westerterp_1993
  basis: Crossref title is Mechanism and kinetics of the selective hydrogenation of ethyne and ethene; source is
    not described as a review in the bibliographic record.
- record_id: SG-4-pass-1
  correction: Reclassified the Waldron MBDoE parameter-precision comparison from source_observation to source_model_result
    after re-reading the full methods/results; direct measurements and estimated/optimized outcomes remain separate.
  evidence: Full-text §§2–5, especially weighted sensitivity/Fisher approximation and results. This is an AI-authored
    second-pass correction, not human verification.
research_additions:
- legacy_claim: No prior integrated-map source record; accessible local primary PDF assessed in SG-1 research wave.
  resolved_source_id: stytsenko2022
  basis: Full article read from local repository PDF; source-specific Pd–Mn observations and proposed adsorption-substitution
    model added with bounded support. No claim was promoted to human-verified.
- legacy_claim: No prior integrated-map source record; accessible local primary PDF assessed in SG-1 research wave.
  resolved_source_id: wang2023_pdag_descriptors
  basis: Full ACS Catalysis article read from the local repository PDF and selected printed pp. 434–441 reopened from
    SHA-256-identified local `ref_17.pdf`. DFT/PSSA assumptions, source-specific PdAg surface families, descriptor
    equations and steady tests are passage-linked. SI details remain unavailable locally; the stated descriptor-energy
    pressure conditions differ from the fixed-bed test total pressure, so rate/model transfer remains bounded.
- legacy_claim: No prior integrated-map source record; local primary full-text article added in SG-1 catalyst source
    comparison.
  resolved_source_id: dehghani2019_pdag_alphaal2o3
  basis: Full Processes article read from local PDF and publisher record. Source-specific industrial Pd–Ag kinetics
    and campaign activity model added; equation sign/unit ambiguities explicitly retained.
- legacy_claim: No prior integrated-map source record; full primary numerical-model text assessed in SG-2 transport/numerics
    research.
  resolved_source_id: di_giuliano_pellegrino2019
  basis: Full open-access PMC article read. Its variable-velocity packed-bed equations, method-of-lines implementation,
    explicit-step limits, model comparisons and catalyst-independent scope are recorded source-specifically.
- legacy_claim: No prior integrated-map source record; boundary-condition alternative checked at publisher-abstract
    scope in SG-2.
  resolved_source_id: mott_green2015
  basis: Publisher abstract only. Competing continuity/flux interpretation is recorded as a proposal requiring full-text
    inspection; no revised equation is inferred from inaccessible full text.
- legacy_claim: No prior integrated-map source record; open-access RSC full-text article read during SG-3 experiment-design
    research.
  resolved_source_id: waldron2020_transient_flow_mbdoe
  basis: Full article read from UCL repository; verified metadata against RSC page. Added bounded Fisher-information/MBDoE
    and source-specific esterification results, without transfer to heterogeneous acetylene kinetics.
- legacy_claim: No prior integrated-map source record; bibliographic and abstract record inspected during SG-3 periodic-system-identification
    research.
  resolved_source_id: schoukens1994_periodic_excitation_identification
  basis: VUB institutional record checked for author/conference metadata and abstract. Full proceedings text was
    unavailable; only the abstract-level scope is used.
