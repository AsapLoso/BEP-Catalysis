- id: urmes2022
  type: primary_research_article
  authors: Caroline Urmès, Cécile Daniel, Jean-Marc Schweitzer, Amandine Cabiac, Carine Julcour, Yves Schuurman
  year: 2022
  title: Microkinetic Modeling of Acetylene Hydrogenation Under Periodic Reactor Operation
  journal: ChemCatChem
  volume: '14'
  issue: '8'
  article_number: e202101826
  doi: 10.1002/cctc.202101826
  url: https://doi.org/10.1002/cctc.202101826
  locator: Publisher abstract and first-page preview were the only recorded source-text access. A local filename
    inventory on 2026-10-22 found no matching article or Urmès-specific Supporting Information under Articles; this
    was an access check, not a full-text audit, and an unidentifiable local copy is not excluded.
  access_status: abstract_and_preview
  verification: ai_checked_metadata_publisher_abstract_and_preview
  applicability: Direct periodic acetylene-hydrogenation precedent on Pd/α-Al2O3 using small-amplitude flow oscillations
    for parameter estimation and outlet-composition modeling. Does not establish a performance gain. Whether the
    transient model resolves axial transport remains unknown from the accessible abstract and preview.
  claims:
  - locator: Publisher abstract
    supports: The abstract reports small-amplitude flow oscillations for a Pd/α-Al2O3 acetylene-hydrogenation study
      and the use of resulting dynamic data to estimate parameters for a source-specific single-site microkinetic
      mechanism.
  - locator: Publisher abstract
    supports: The authors report that their optimized transient model reproduces measured outlet reactant/product
      molar-fraction histories for the tested modulation amplitudes and frequencies; this is a model-result claim,
      not an independent performance comparison.
  - locator: Publisher abstract
    supports: The authors interpret hydrogen adsorption and hydrogenation of a surface-vinyl intermediate to adsorbed
      ethylene as controlling acetylene conversion in their selected mechanism; the abstract does not establish
      these as directly observed elementary events.
  - locator: Preview introduction
    supports: Context for periodic excitation as a kinetic-identification method; the full methods and Supporting
      Information were not inspected.
  does_not_support: Does not, from the accessible abstract/preview, establish a distributed axial PDE, PdAg applicability,
    a universal resonance window, or BEP yield improvement.
  citations: []
- id: urmes2019
  type: primary_research_article
  authors: Caroline Urmès, Jean-Marc Schweitzer, Amandine Cabiac, Yves Schuurman
  year: 2019
  title: Kinetic Study of the Selective Hydrogenation of Acetylene over Supported Palladium under Tail-End Conditions
  journal: Catalysts
  volume: '9'
  issue: '2'
  article_number: '180'
  doi: 10.3390/catal9020180
  url: https://doi.org/10.3390/catal9020180
  locator: Full article PDF reviewed; printed pp. 2–6 and 9–11, including Tables 2–5 and mechanistic discussion.
  access_status: full_text_read
  verification: ai_checked_metadata_and_full_text
  applicability: Full-text 0.05 wt% Pd/α-Al₂O₃ tail-end steady-kinetics study. Its selected single-site model and
    exclusion of C4 products are conditional on the catalyst, detection limits and tested conditions; not a PdAg
    transient model.
  claims:
  - locator: Printed p. 2, §2
    supports: No C4 products were observed in the reported experiments, so the fitted analysis was restricted to
      acetylene-to-ethylene and ethylene-to-ethane rates under those conditions.
  - locator: Printed pp. 3–6, Table 3 and rate-equation discussion
    supports: The selected Pd/α-Al₂O₃ model uses one site family and a Horiuti–Polanyi-derived sequence; hydrogen
      dissociation in the elementary scheme uses two neighboring vacancies.
  - locator: Printed pp. 9–11, discussion/conclusions
    supports: The selected model describes that study's steady tail-end data; parameter constraints and catalyst-specific
      scope limit transfer.
  does_not_support: Does not establish a universal reaction network, PdAg mechanism, transient coverage times, or
    dynamic performance gain.
  citations: []
