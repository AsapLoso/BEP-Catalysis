  journal: 'Applied Catalysis A: General'
  volume: '198'
  issue: '1'
  pages: 51–66
  doi: 10.1016/S0926-860X(99)00498-6
  url: https://doi.org/10.1016/S0926-860X(99)00498-6
  locator: Local full-text PDF `Academics/BEP/Catalysis/Articles/acquired_pdfs/borodzinskiKineticModelHydrogenation2000.pdf`
    (SHA-256 1a18bd894485c1e4f457c2db6b54dc37befff703183c20b5b11332abe7e5b3e0); printed pp. 52–65 selectively
    reopened for source equations, observations, assumptions and regression comparisons.
  access_status: full_text_read
