  applicability: Commercial Pd/α-Al₂O₃ acetylene–ethylene-mixture kinetics in a gradientless reactor at 343 K; proposes
    and fits deposit-associated A/E site families and algebraic rate closures. Catalyst- and regime-specific; the
    paper's site geometry is a kinetic interpretation, and calculated coverages are not direct coverage measurements.
  claims:
  - locator: Abstract
    supports: Reported kinetic study and two active-site populations associated with carbonaceous deposits.
  - locator: Printed p. 55, Figs. 2–3 and §3.2; printed pp. 56–58, §§3.3–3.4
    supports: Measured rate patterns used to motivate the A/E site-family hypothesis and its distinction from competing
      candidate models.
  - locator: Printed p. 53, Table 1; printed pp. 63–65, Appendix A, Eqs. (A.1)–(A.3), (A.13), (A.27), (A.47)–(A.49)
    supports: Source-specific algebraic A/E rate equations, occupancy assumptions, quasi-steady/equilibrium reductions,
      partial-pressure basis and rate normalization.
  - locator: Printed pp. 59–60, Table 2 and §§3.5–3.6
    supports: Weighted multiresponse model comparison for the source dataset; authors report the best statistic
      among four comparator equations, but explicitly state that the fit is not decisive proof of full mechanistic
      adequacy and note two parameter pairs correlated above 0.8.
  - locator: Printed p. 53 Table 1 footnote and printed p. 60 Table 3
    supports: Table 1 and Table 3 report different units for k2-prime; dimensional analysis of the displayed r2 equation
      agrees with Table 3's kPa^-2 and conflicts with the Table 1 footnote's kPa^-3.
  does_not_support: Does not establish the same site model for PdAg or transient forcing.
  citations: []
