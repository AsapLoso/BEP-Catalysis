- id: stytsenko2022
  type: primary_research_article
  authors: Valentine D. Stytsenko, Dmitry P. Melnikov, Aleksandr P. Glotov, Vladimir A. Vinokurov
  year: 2022
  title: Kinetic regularities and mechanism of acetylene hydrogenation over PdMn catalyst
  journal: Molecular Catalysis
  volume: '533'
  article_number: '112750'
  doi: 10.1016/j.mcat.2022.112750
  url: https://doi.org/10.1016/j.mcat.2022.112750
  locator: Local full-text PDF Academics/BEP/Catalysis/Articles/acquired_pdfs/stytsenkoKineticRegularitiesMechanism2022.pdf;
    pp. 1–7, especially §§2–4, Table 1, Figs. 1–7 and Eqs. (1)–(18). Publisher record and DOI checked.
  access_status: full_text_read
  verification: ai_checked_metadata_and_full_text
  applicability: Pd–Mn/Al2O3 source-specific kinetic and adsorption-substitution proposal at atmospheric pressure
    and 303–323 K. It contrasts with Langmuir adsorption-equilibrium models; its proposed pathways and apparent
    rates do not transfer to PdAg or the BEP catalyst.
  claims:
  - locator: §2; Table 1; Fig. 1; printed pp. 2–3
    supports: The study tested 0.068 wt% Pd/Al2O3 variants with Mn promoters, pre-reduced catalysts, two H2/C2H2/C2H4/Ar
      feeds, atmospheric pressure and 303–323 K; reported conversion versus contact time and feed-composition comparisons.
  - locator: §3.3, Fig. 2; §3.4, Fig. 4; printed pp. 3–4
    supports: Within this study, TPD detected partial H2 desorption around 523 K but no C2H2/C2H4 or fragment desorption
      through the reported heating range; a QMS experiment showed gas acetylene displacing chemisorbed ethylene
      with ethylene release. These observations motivate a catalyst-specific irreversible-adsorption/substitution
      picture.
  - locator: §3.3, Fig. 3; §4.1, Fig. 5 and assumptions 1–4; printed pp. 3–4
    supports: DRIFTS bands were assigned by the authors to strongly chemisorbed semi-hydrogenated acetylene species;
      the key C2H4Z2 intermediate, fast/irreversible formation, and hypothetical step 5 are mechanistic interpretations/assumptions,
      not all directly identified elementary events.
  - locator: §4.2–4.3, Eqs. (7)–(18), Figs. 6–7; printed pp. 4–6
    supports: The authors fit a conversion/contact-time model below about 75–80% acetylene conversion and a separate
      selectivity/conversion model at higher conversion, assigning initial parallel ethylene/ethane formation and
      later sequential ethylene hydrogenation; reported constants and extrapolations are study-specific model results.
  does_not_support: Does not establish adsorption irreversibility or the substitution mechanism for Pd/alpha-Al2O3,
    PdAg or the BEP target; does not provide an explicit general dynamic coverage ODE or periodic-operation gain.
