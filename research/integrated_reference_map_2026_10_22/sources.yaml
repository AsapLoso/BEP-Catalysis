- id: danckwerts1953
  type: primary_theoretical_article
  authors: P. V. Danckwerts
  year: 1953
  title: 'Continuous Flow Systems: Distribution of Residence Times'
  journal: Chemical Engineering Science
  volume: '2'
  issue: '1'
  pages: 1–13
  doi: 10.1016/0009-2509(53)80001-1
  url: https://doi.org/10.1016/0009-2509(53)80001-1
  locator: Full 13-page original PDF reopened; selected passages on printed pp. 1–11, equations and figures inspected
  access_status: full_original_pdf_selected_pages_reopened
  verification: ai_checked_pdf_identity_and_selected_pages; inherited DOI metadata not independently rechecked in
    B6
  applicability: Classical RTD definitions, packed-tube apparent longitudinal dispersion, tracer flow characterization,
    and conditional first-order steady-reactor calculations. The source gives its own steady axial flux equations
    under declared assumptions; it is historical transport theory, not a target PdAg kinetic or periodic-operation
    result.
  claims:
  - locator: Printed pp. 1–4, Eqs. (1)–(14)
    supports: Defines step-response F-diagrams, internal/exit age distributions, impulse-tracer C-diagrams, normalization,
      mean age and hold-back; notes the full F-diagram can be needed to calculate reactor performance.
  - locator: Printed pp. 5–7, Eqs. (15)–(22), Fig. 9
    supports: Develops an empirical longitudinal-dispersion analogy for packed-bed RTD and compares one water/Raschig-ring
      column with tracer data.
  - locator: Printed pp. 9–11, Eqs. (27)–(32)
    supports: Shows RTD conversion for a spatially uniform first-order or pseudo-first-order steady reactor; derives
      a steady axial-dispersion balance with inlet flux matching and zero-gradient outlet; limits RTD-only prediction
      for non-first-order or spatially varying kinetics.
  - locator: Printed pp. 11–12, Eqs. (39)–(49)
    supports: Derives a linear concentration-history convolution for a continuous-flow blender with stationary E(θ),
      and relates input autocorrelation and RTD shape to outlet fluctuation variance.
  does_not_support: Does not identify the BEP superficial/interstitial dispersion convention, PdAg surface mechanism
    or kinetic constants, intrapellet/film transport, target apparatus transfer functions, nonlinear selectivity
    from RTD alone, periodic gain, or a best-feasible-steady comparison.
  citations: []
