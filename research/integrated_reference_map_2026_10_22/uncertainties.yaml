  - Reproduce Eq. (18) on the source data with the recovered basis and check the dimensions of b^0.5 k6/k2.
  - Keep the source-specific apparent values separate from any per-catalyst-mass or packed-bed source term until normalization is explicit.
  linked_nodes:
