  - c2_surface_kinetic_closure_choices
- id: wang2023_model_experiment_condition_alignment
  priority: high
  status: source_details_and_transfer_open
  question: Can the Wang et al. (2023) PdAg microkinetic/descriptor ranking be reproduced and evaluated at its fixed-bed test conditions using the exact Supporting Information model?
  why_open: The main text states DFT/descriptor conditions of T = 333 K and partial pressures p_C2H2 = 0.2 atm,
    p_H2 = 4 atm, p_C2H4 = 9 atm, while the supported fixed-bed experiment reports a total pressure of 0.2 MPa
    (about 2 atm). These are not matched absolute pressure conditions. The paper points to Supporting Information
    Section S2 for the detailed microkinetic equations and to SI tables for descriptor fits, outliers and numerical
    comparisons; no matching SI file was present in the local article inventory. The main text also does not state the
    empirical radius unit convention used in phi_CH3. Thus, its qualitative within-set rank agreement cannot by itself
    establish quantitative rate/coverage validity at the test pressure or reproducibility of the descriptor fit.
  evidence_needed:
  - Inspect the article's SI and reconstruct the exact elementary rate laws, standard states, fit coefficients,
    numerical errors and atomic-radius conventions.
  - Confirm whether the stated 0.2 MPa test pressure is absolute or gauge and recover the unreported balance-gas,
    catalyst-mass and bed-normalization details.
  - Recompute the microkinetic predictions at both the article's listed descriptor conditions and the measured feed
    conditions, then assess which rank statements remain robust without conflating model outputs and measured yields.
  linked_nodes:
  - c1_pdag_descriptor_mkm
  - c1_catalyst_identity
  - c2_surface_kinetic_closure_choices
  - ph_metrics
  - reactor_operating_window
