- id: borodzinski2000_acetylene_pressure_range
  priority: medium
  status: unresolved_primary_source_internal_discrepancy
  question: "Which acetylene partial-pressure upper bound belongs to the fitted 2000 Borodziński–Cybulski dataset: 0.078 or 0.78 kPa?"
  why_open: The full-text results paragraph on printed p. 54 reports 0.0035–0.078 kPa, while the Table 3 footnote on printed p. 60 and Fig. 6 caption report 0.0035–0.78 kPa. The Fig. 2 axis only reaches 0.15 kPa. This may be a source typographical error or reflect distinct subsets; it cannot be silently harmonized.
  evidence_needed:
  - Compare the article's figure points, underlying data, and any published correction/supporting file.
  - If exact reproduction matters, obtain an author clarification rather than selecting a range from context alone.
  linked_nodes:
  - c1_borodzinski_ae_site_hypothesis
  - c1_borodzinski_ae_effective_rates
- id: borodzinski2000_k2_rate_constant_units
  priority: high
  status: unresolved_primary_source_dimensional_discrepancy
  question: Is the k'₂ unit in the 2000 paper's ethylene-to-ethane rate footnote misprinted, or is a pressure normalization absent from the displayed equation?
  why_open: Table 1 model 5 and Appendix A Eq. (A.45) each give the k'₂ ethylene-hydrogenation term a p_C₂H₄p_H₂ pressure product and dimensionless adsorption denominator, requiring k'₂ in kPa⁻² under the stated mol-C₂H₆ mol-Pd⁻¹ s⁻¹ rate basis. The Table 1 notation footnote prints kPa⁻³, but Table 3's k'₂ row prints kPa⁻². The paper does not explain the footnote discrepancy; a separate uncertainty records the different denominator powers printed in Table 1 and Eq. (A.45).
  evidence_needed:
  - Check the article correction, original regression code/data, or author clarification.
  - Preserve both the printed unit and equation-derived unit until resolved; do not use the parameter numerically as an absolute target constant.
  linked_nodes:
  - c1_borodzinski_ae_effective_rates
- id: borodzinski2000_r2_denominator_exponent_conflict
  priority: high
  status: unresolved_primary_source_equation_discrepancy
  question: >-
    Which competitive-denominator power is intended for the k'₂ ethylene-hydrogenation term in the Borodziński–Cybulski (2000) model: power 2 in Table 1 model 5 or power 3 in Appendix A Eq. (A.45)?
  why_open: Both expressions use the same k'₂ pressure product and dimensionless competitive adsorption terms, but the primary source prints different denominator powers. The paper does not reconcile the table and derivation or state which form was used in the regression implementation.
  evidence_needed:
  - Check an article correction, original regression code/data, or author clarification.
  - Re-derive Eq. (A.45) from the stated elementary steps and compare that derivation with the fitted Table 1 expression without silently replacing either source form.
  linked_nodes:
  - c1_borodzinski_ae_effective_rates
