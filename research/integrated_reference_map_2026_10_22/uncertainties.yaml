- id: target_boundary_domain_and_flux_closure
  priority: high
  status: unresolved_apparatus_and_model_choice
  question: Which upstream and downstream domains and flux boundary conditions represent the target packed
    bed and measurement apparatus?
  why_open: The proposal says Danckwerts-type but omits the actual equations and apparatus boundary volumes.
    A common zero-gradient outlet encodes a convective external domain; Mott and Green's abstract proposes
    a competing continuity/flux formulation, but their full derivation was not checked. Mixer, line, bed
    and analyzer dynamics can otherwise be misassigned.
  evidence_needed:
  - Inspect the full Mott and Green derivation and evaluate its assumptions against the target flow geometry.
  - Measure inlet and outlet tracer/inert responses and identify tubing, mixer, valve and analyzer volumes.
  - Compare isolated-bed and explicitly coupled-domain formulations on the same measured boundary data.
  linked_nodes:
