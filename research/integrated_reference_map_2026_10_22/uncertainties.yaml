  priority: high
  status: source_parameter_basis_unresolved
  question: What concentration convention and numerical basis define the Stytsenko et al. hydrogen concentration C_H2, adsorption parameter b, and reported b^0.5 k6/k2 term?
  why_open: The source prints the algebraic hydrogen-coverage closure and composite parameter values but does not state the concentration units or b basis in the inspected text; this prevents dimensional reproduction and quantitative transfer.
  evidence_needed:
