- id: target_total_flow_velocity_closure
  priority: high
  status: target_feed_and_pressure_data_missing
  question: Does reaction and forcing change total molar flow enough that superficial velocity must vary
    in the BEP balance?
  why_open: The reaction network can have nonzero net gas stoichiometry, while the total-flow trajectory
    also depends on inlet dilution, conversion, adsorption storage, pressure, temperature and possible
    pressure drop. The proposal baseline does not provide enough target data to assess a constant-velocity
    approximation. A CO2-capture source illustrates method consequences but does not quantify this reactor.
  evidence_needed:
  - Measure or reconstruct component inlet/outlet molar flows, pressure and temperature over the operating
    range.
  - Use the selected gas stoichiometric matrix and rate basis to calculate total gas production/consumption
    with adsorbed inventory accounted for.
  - Compare constant-u_s and coupled total-flow closures against target tracer and flow data.
  linked_nodes:
  - ph_variable_superficial_velocity
  - ph_axial_balance
  - ma_gas_pde
  - ma_stoichiometry
