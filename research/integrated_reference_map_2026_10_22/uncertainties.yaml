- id: transport_criterion_primary_sources_and_basis
  priority: high
  status: source_gap
  question: Which primary sources and exact rate, density, length and geometry conventions support the inherited Thiele, Weisz–Prater and Mears transport formulae and thresholds, and which are applicable to the BEP catalyst?
  why_open: Berger et al. (2008) reviews Carberry, Wheeler–Weisz and Prater criteria but does not derive the inherited Thiele modulus/effectiveness factor or Mears expression. Its Carberry nomenclature gives a' per particle volume while r_obs is reported per m^3_cat, so the dimensional check requires a matched volume-basis convention. The legacy Mears candidate uses a catalyst-density basis that has not been traced to its original definition; no target particle data are available.
  evidence_needed:
  - Reopen the original sources for each named transport criterion and transcribe variable definitions, units, basis and limiting assumptions.
  - Check dimensions and reconcile catalyst-mass, particle-volume, bed-volume and external-area bases before comparing threshold numbers.
  - Obtain target particle radius/geometry, porosity/tortuosity, species diffusivities, gas properties and flow regime; evaluate both internal and external transfer limits at the target rate.
  linked_nodes:
  - internal_diffusion_thiele
  - external_film_transfer
  - ph_pellet_transport
  - ph_boundary_measurement
- id: larsen_experimental_temperature_discrepancy
  priority: high
  status: source_internal_conflict
  question: 'Which temperature was actually used for the Larsen thesis'' PdAg catalytic tests: 80 °C or 100 °C?'
  why_open: Section 4.2 printed p. 15 states that the reactor was maintained at 80 °C during the experiment, while
    the abstract and §6.1/Table 6.1 printed pp. 1 and 23 report test conditions of 100 °C and 1000 mbar. The thesis
    does not reconcile the discrepancy, so its fitted kinetic parameters cannot be assigned to one temperature from
    this PDF alone.
  evidence_needed:
  - Check experiment logs, controller records or the author's original data/code for the test temperature.
  - Keep the 80 °C and 100 °C statements separately labelled until the run conditions are confirmed.
  linked_nodes:
  - lhhw_kinetics
  - reactor_operating_window
- id: larsen_balance_basis_and_parameter_units
  priority: high
  status: source_basis_unresolved
  question: What rate units/material basis, support-density definition, cross-sectional area, and pressure units are used in the Larsen thesis kinetic model?
  why_open: Equations (4.6)–(4.9) multiply rates by ρ_support A but the inspected equations do not state the units or
    whether ρ_support is a bed, support or catalyst density. Appendix F is a code appendix whose implementation is
    embedded as raster images; the available OCR did not establish these values. Parameter transfer and quantitative
    conversion reconstruction therefore remain unsupported.
  evidence_needed:
  - Inspect the original model code or higher-quality source images for definitions of ρ_support, A, catalyst mass and rate basis.
  - Recover units for partial pressures, adsorption constants, fitted rates and r1,max from the implementation or author documentation.
  - Check dimensional consistency of each molar balance and compare the code's catalyst/support mass basis with Table 4.1.
  linked_nodes:
  - ma_gas_pde
  - ma_pde_ode_coupling
  - lhhw_kinetics
- id: larsen_hydrogen_adsorption_form
  priority: medium
  status: source_model_form_unresolved
  question: What adsorption/site convention reconciles the thesis' description of dissociative H2 adsorption with its linear K_H2 p_H2 denominator term?
  why_open: Under simple quasi-equilibrium dissociative adsorption on equivalent sites, hydrogen coverage is proportional
    to the square root of hydrogen partial pressure. The thesis calls H2 adsorption dissociative but prints a linear
    K_H2 p_H2 contribution; alternative site conventions or empirical lumping are possible and the equations do not
    determine which interpretation was intended.
  evidence_needed:
  - Inspect the original derivation or code for the hydrogen adsorption expression and rate normalization.
  - Compare an explicitly dissociative site-balance model, a molecular-adsorption closure and empirical power-law alternatives against source data.
  - Keep the functional form source-specific until the site inventory and model equations are documented.
  linked_nodes:
  - lhhw_kinetics
  - c2_surface_kinetic_closure_choices
