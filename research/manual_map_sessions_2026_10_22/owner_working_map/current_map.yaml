      "rationale": "Explain where surface-bound H*, the second LH reacting partner, comes from; place under Tier5 Adsorption, not inside LH because it is a separate elementary adsorption/activation process.",
      "summary": "Hydrogen activation on the catalyst includes basic H₂ dissociation, neighboring-site requirements, adsorption equilibrium, activation energetics and competition for vacancies; these aspects have different understanding levels.",
      "notes": "STRUCTURAL MATURITY RECONCILIATION 2026-10-23: This broad Tier6 is now Idea because only its Tier7 Basic H₂ Dissociation Mechanism is owner-worked-out. Four other child aspects have their own AI/Idea maturity; do not infer whole-umbrella human mastery from the original combined node. Math equation content links to Mathematical Modeling and physical site types to the catalyst branch.\n\nOWNER-UNDERSTOOD CORE (qualitative; no informal prose stage was requested): In the supported-Pd reaction scheme, molecular H₂ must be activated before it supplies adsorbed H atoms for successive acetylene hydrogenation. Hydrogen can split into two H* atoms on the metal surface, with the idealized elementary step H₂(g) + 2* ⇌ 2H*. In this particular description, there must be two suitable free neighboring sites; the sites do not need to be of two different kinds. The available free positions matter: if the surface is occupied, it can be harder for H₂ to find the required pair. Gas pressure can affect surface availability of hydrogen, but the owner's qualitative understanding does not amount to a derived adsorption or selectivity equation.\n\nAI REFERENCE EXPLANATION — detailed and separately scoped (not all owner-verified): There are *two separable subjects in this present combined node*: (A) **H₂ activation chemistry:** H–H bond cleavage and formation of adsorbed H*, reversible surface binding, mechanistic alternatives and possible activation barriers; (B) **geometric/kinetic site requirements:** adjacent vacancy pairs, surface-site family versus site count, effects of coverage and blockage, catalyst composition and surface atomic ensembles. In Urmès et al. 2019 (Catalysts 9(2), 180, Table 3, step 1), H₂+2* ⇌2H* explicitly consumes two free adjacent sites. Its one-'site' model assumes one class/family of sites in the effective kinetics; this does not mean one H₂ molecule requires only one site, and does not establish that all PdAg surface positions are equivalent.\n\nWhy pressure appears: In a simplest ideal mean-field quasi-equilibrium dissociative adsorption model, θ_H/θ_* = √(K_H p_H₂). This equation relates surface hydrogen occupancy to vacant-site occupancy; K_H includes adsorption/desorption equilibrium under a specified convention. It is **not** an expression for conversion or ethylene selectivity. The pressure and available-site effects connect to competitive adsorption, site saturation and poisoning/deactivation. Pair vacancy probability may be approximated by θ_*² only under independence/mixing assumptions; clustering, alloying, steps or defects can alter pair accessibility. Binding energy/free energy, equilibrium adsorption constant, sticking probability and pressure are distinguishable quantities or drivers, not interchangeable synonyms.\n\nStructure not yet split: candidate **H₂ Activation Chemistry** and **Neighboring Site-Pair Requirements** could become two subnodes below or near the existing Tier6 node, but are currently queued as an owner-unresolved taxonomy choice, NOT placed or promoted. Likewise, **Types of Active Sites** should belong to a broader future catalyst-structure branch and be cross-linked to the neighbor pair issue, not inserted by treating the two-site step as two site types.\n\nSource bounds: [Urmès et al. 2019, Table 3 and kinetics derivation](https://doi.org/10.3390/catal9020180) is a specific Pd/α-Al₂O₃ supported-catalyst model. The pinned AI reference nodes `c1_dissociative_h2_adsorption`, `c1_adjacent_site_requirement`, `ph_site_ensembles`, and `ph_lh_rates` give additional AI-qualified explanations. These do not verify the actual BEP PdAg surface, atomistic barrier, coverage distribution, rate constant or observed pressure/selectivity trend.",
