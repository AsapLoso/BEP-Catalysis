<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 170" width="480" height="170" role="img" aria-labelledby="er-title er-desc">
<title id="er-title">Gas–surface encounter, broadly called Eley–Rideal-type</title><desc id="er-desc">Generic sketch: A is bound to a surface site while gas-phase B collides with it. Strict Eley–Rideal versus Langmuir–Rideal terminology requires additional distinction.</desc>
<rect width="480" height="170" rx="12" fill="#f7fafb"/><text x="240" y="27" text-anchor="middle" fill="#1c2d39" font-family="Arial,sans-serif" font-size="16" font-weight="bold">Gas–surface (ER-type)</text>
<text x="240" y="51" text-anchor="middle" fill="#375264" font-family="Arial,sans-serif" font-size="13">Only A bound; B approaches from above</text>
<path d="M35 138 H445" stroke="#67788a" stroke-width="3"/><g fill="#9ba9b3"><rect x="75" y="119" width="62" height="18" rx="4"/><rect x="209" y="119" width="62" height="18" rx="4"/><rect x="343" y="119" width="62" height="18" rx="4"/></g>
<circle cx="106" cy="101" r="17" fill="#efb366" stroke="#9a6530" stroke-width="2"/><text x="106" y="106" text-anchor="middle" fill="#13202a" font-family="Arial,sans-serif" font-size="16" font-weight="bold">A</text>
<circle cx="237" cy="70" r="17" fill="#75c7bf" stroke="#387e77" stroke-width="2"/><text x="237" y="75" text-anchor="middle" fill="#13202a" font-family="Arial,sans-serif" font-size="16" font-weight="bold">B</text>
<path d="M216 78 L133 96" stroke="#516978" stroke-width="2" stroke-dasharray="6 5"/><path d="M138 89 L129 97 L141 99" stroke="#516978" stroke-width="2" fill="none"/><text x="349" y="77" text-anchor="middle" fill="#375264" font-size="12" font-family="Arial,sans-serif">gas-phase B</text><text x="349" y="102" text-anchor="middle" fill="#375264" font-size="12" font-family="Arial,sans-serif">not yet adsorbed</text><text x="240" y="158" text-anchor="middle" fill="#52697b" font-family="Arial,sans-serif" font-size="11">Concept schematic · ER/Langmuir–Rideal terminology deferred</text></svg>