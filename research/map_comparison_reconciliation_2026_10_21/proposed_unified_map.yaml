- id: u_ph_kinetics
  parent: physics
  title: Kinetic law, thermal dependence and surface-memory closures
  kind: proposed_theme
  status: proposed_ai_reference
  maturity: ai_worked_out
  summary: An algebraic effective rate law and explicit dynamic coverages are alternative closures; a dynamic reactor
    does not require dynamic surface states.
  explanation: A PSSA/Langmuir–Hinshelwood model can map local gas composition and temperature to rates instantaneously
    while gas-phase bed states remain transient. Explicit coverage ODEs require an elementary mechanism, site balances,
    adsorption/desorption constants and identifiable parameters. Preserve the original centered-Arrhenius correction
    and validity conditions. Parameter estimation under excitation is distinct from evidence of improved production.
  equations:
  - dθ/dt = S_s r_s(θ,c,T), subject to site balance
  - k(T)=k(T_ref) exp[−E_a/R (1/T−1/T_ref)] (reference-rate Arrhenius form)
  assumptions:
  - PSSA is a local closure, not a claim that the whole reactor is steady.
  - Rate basis and gas/adsorbate coupling must be dimensionally and stoichiometrically consistent.
  limitations:
  - Published kinetics are conditioned on catalyst, feed and fitted data.
  - Two original claims misbind the Berger DOI; correcting the citation does not validate the target rate law.
  open_questions:
  - Which closure is identifiable from target-catalyst transient data?
  - Are adsorption and surface relaxation times comparable to feasible forcing periods?
