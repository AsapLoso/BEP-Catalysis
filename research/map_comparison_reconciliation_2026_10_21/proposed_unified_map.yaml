- id: u_ma_numerics
  parent: mathematics
  title: Discretization, stiff integration and numerical verification
  kind: proposed_theme
  status: proposed_ai_reference
  maturity: ai_worked_out
  summary: A transient discretized model needs spatial, temporal and periodic-orbit convergence evidence before small
    predicted gains can be interpreted physically.
  explanation: The method of lines converts PDEs to potentially stiff ODE/DAE systems. Convection-dominated transport
    can cause numerical diffusion or oscillation; switching inputs challenge error control and event handling. Verify
    grid/time refinement, conservation, physical bounds, periodic residuals, tolerances and suitable alternative discretizations.
    Verification is not validation against data.
  equations:
  - 'MOL: dx_h/dt = F_h(x_h,u,t)'
  - 'Periodic residual: ||x(T)−x(0)|| ≤ stated tolerance'
  assumptions:
  - Solver choice follows stiffness and smoothness diagnostics.
  - Input switching times are represented consistently.
  limitations:
  - No solver, grid or simulation is executed or endorsed here.
  - The proposal numerical plan is prospective.
  open_questions:
  - What refinement and balance tolerances are small relative to the claimed difference?
  - Do alternative schemes converge to the same periodic objective?
