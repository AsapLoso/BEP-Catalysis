- id: u_ma_periodic
  parent: mathematics
  title: Periodic orbits, mean response and no-gain limits
  kind: proposed_theme
  status: proposed_ai_reference
  maturity: ai_worked_out
  summary: The sign of periodic-operation effects is conditional; mathematical limits and contrasting model-specific
    studies rule out universal benefit claims.
  explanation: At settled periodic response, a stable LTI system has mean output equal to its DC response to mean
    input. A static concave response obeys Jensen’s no-gain bound at fixed mean. Nonlinear stateful systems may rectify
    forcing positively, negatively or not at all. A strict advantage is not implied by nonlinearity or a frequency
    window in one pellet model. Separately, if the periodic feasible set contains all steady controls under identical
    constraints and objective, its global optimum cannot be worse; this does not prove a strict gain or real-world
    feasibility.
  equations:
  - 'Stable LTI: mean(y)=G(0) mean(u) at settled periodic response'
  - 'Static concave f: E[f(u)]≤f(E[u])'
  - U_s⊆U_p ⇒ max_(u∈U_p)J(u)≥max_(u∈U_s)J(u), for identical objective/constraints
  assumptions:
  - LTI result requires stability and settled periodic response.
  - Jensen requires a memoryless concave response and fixed-mean input.
  - Set inclusion requires matched resource, safety and campaign constraints.
  limitations:
  - Gain and no-gain examples use different models and are not a contradiction for one target plant.
  - No theorem fixes the gain sign for the proposed nonlinear reactor.
  open_questions:
  - Which nonlinear memory/transport mechanisms survive target-specific tests?
  - Does periodic operation beat the optimized steady point after uncertainty and actuator limits?
  source_map_refs:
    original:
    - math_dynamical_systems
    independent_v2:
