claim_reconciliations:
- claim_id: periodic_gain_sign
  position: unresolved_conditional
  synthesis: No universal improvement follows. Stable-LTI and static-concave cases give no-gain under stated assumptions;
    nonlinear diffusion-limited and sufficient-condition studies are model-specific.
  source_ids:
  - feimer1982
  - horn_bailey1971
  - ziegelhoeffer1972
  - espinoza2022
  - kaps2026
  do_not_infer: The examples establish sign or magnitude for the target reactor.
- claim_id: periodic_acetylene_novelty
  position: narrowed_gap
  synthesis: Urmès et al. 2022 is periodic acetylene precedent on Pd/α-Al2O3 for estimation and outlet prediction;
    accessible evidence recorded in v2 does not establish optimized net ethylene gain for target PdAg.
  source_ids:
  - urmes2022
  do_not_infer: No periodic acetylene model or experiment exists.
