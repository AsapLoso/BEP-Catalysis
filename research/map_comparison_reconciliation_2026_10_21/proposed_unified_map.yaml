  - urakawa2008
  - espinoza2022
  - urmes2022
- id: u_sc_feasibility
  parent: systems_control
  title: Feasibility, robustness and evidence ladder
  kind: proposed_theme
  status: proposed_ai_reference
  maturity: ai_worked_out
  summary: The periodic feasible set includes hardware, process, safety, uncertainty and campaign constraints; scientific
    claims need staged numerical and experimental evidence.
  explanation: Bound inlet composition, total flow, pressure, temperature, slew, cycling frequency, runaway, catalyst
    health and sensor bandwidth from apparatus evidence. Separate numerical verification, parameter estimation, held-out
    validation and prospective performance comparison. A local optimizer solution is not global unless established.
    Model predictions are conditional on applicability; robustness across plausible parameters and model alternatives
    matters when gains are small.
  equations:
  - U_p should encode amplitude, mean feed, flow, pressure, slew, temperature and safety; U_s uses compatible resource
    accounting.
  assumptions:
  - Operating limits and uncertainty distributions are target-specific.
  - Evidence stages answer different questions and are not interchangeable.
  limitations:
  - No simulator, optimizer, validation experiment or safety study is executed in this task.
  - Proposal plans are not results.
  open_questions:
  - Which constraints define the admissible periodic set?
  - What held-out evidence is needed for a credible gain?
  - How should degradation and campaign duration enter?
  source_map_refs:
    original:
