  explanation: Separate conversion, selectivity, yield and productivity; state carbon basis, inlet-product subtraction,
    horizon, catalyst-mass normalization, conversion floor and resource constraints. Compare periodic cycle performance
    to the best feasible steady point, not an arbitrary nominal point. Feasible-set nesting gives weak no-worse ordering
    only if objective and constraints match; strict gain still needs evidence and uncertainty separation.
  equations:
  - N_E,net=∫(F_E,out−F_E,in)dt; N_A,cons=∫(F_A,in−F_A,out)dt
  - S_E=N_E,net/N_A,cons under a stated carbon/selectivity convention; productivity=N_E,net/(m_cat T)
  assumptions:
  - Both cases use matched feed, conversion, pressure, thermal, safety and campaign constraints.
  - Integrate after a declared periodic-orbit/startup criterion.
  limitations:
  - The exact objective and feasible set remain project decisions.
  - Different objective definitions may reverse the ranking.
  open_questions:
  - Net production, selectivity at conversion floor, productivity or Pareto objective?
  - Include startup, cycle duration, energy, aging and inlet ethylene?
  source_map_refs:
    original:
    - math_optimization_theory
    - system_control_optimization
    independent_v2:
    - ph_metrics
    - sc_baseline
    - sc_benchmark_nesting
    - sc_optimization
    - sc_objective
    - sc_local_search
  primary_source_ids:
  - proposal_main
  - lan2025
  - urmes2022
- id: u_sc_observation
  parent: systems_control
  title: Measurements, observability and state estimation
  kind: proposed_theme
  status: proposed_ai_reference
  maturity: ai_worked_out
  summary: Outlet analyzers observe filtered boundary signals; bed concentration and coverage profiles are latent
    without additional measurements or a validated observer.
  explanation: Model sensor response, sampling, calibration, delay, noise and detection limits before fitting transients
    or evaluating cycles. Observability depends on model, sensors and trajectory; EKF/UKF is a future method, not
    proof that latent coverages are recoverable. Modulation spectroscopy may associate periodic signals with surface
    response but requires catalyst-specific assignments and temporal resolution.
  equations:
  - τ_a dy_m/dt+y_m=y_out is a first-order analyzer model only if experimentally supported.
  assumptions:
  - Measurement dynamics belong to the observation model.
  - Observability is conditional on model, input and outputs.
  limitations:
  - No analyzer response, noise, sensor layout or observer performance is validated here.
  - Spectra or gas analysis do not directly identify every intermediate.
  open_questions:
  - Which states can actual measurements distinguish?
  - What analyzer delay, bandwidth, sampling and detection limits apply?
  source_map_refs:
    original:
    - physics_experiments_measurements
    - system_filtering_estimation
    - state_observer_mpc
    independent_v2:
    - ph_measurement
    - ph_boundary_measurement
    - ph_operando_spectroscopy
    - sc_output_model
    - sc_state_estimation
    - sc_observability
    - sc_ekf_ukf
  primary_source_ids:
