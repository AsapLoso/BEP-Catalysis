- id: u_ph_reaction
  parent: physics
  title: Reaction network, pathways and products
  kind: proposed_theme
  status: proposed_ai_reference
  maturity: ai_worked_out
  summary: The sequential C2H2 → C2H4 → C2H6 backbone defines the desired intermediate and principal over-hydrogenation
    loss; microscopic routes and side products remain catalyst- and condition-dependent.
  explanation: Keep net stoichiometry, elementary pathways and measured product accounting distinct. Pd/PdAg calculations
    and catalyst-specific fits support alternatives such as vinyl, ethyl, ethylidene and ethylene desorption/readsorption,
    but do not establish the BEP working surface. Include inlet ethylene, ethane, C4+ products and deposits in the
    carbon boundary when measurements warrant. A forcing benefit is a hypothesis about joint pathway and transport
    response, not a consequence of the reaction sequence.
  equations:
  - C2H2 + H2 → C2H4; C2H4 + H2 → C2H6 (net stoichiometry, not elementary mechanism)
  - R_g = N r (state the stoichiometric matrix and rate basis)
  assumptions:
  - The C2 sequence is a minimum accounting scaffold, not a complete catalyst mechanism.
  - Products below detection are unobserved, not necessarily absent.
  limitations:
  - Surface intermediates and competing products are source/catalyst specific.
  - An incomplete carbon balance can misstate selectivity and deposition.
  open_questions:
  - Which products and carbon sinks are measurable over the forcing envelope?
  - Does the target catalyst support any proposed Pd/PdAg route?
