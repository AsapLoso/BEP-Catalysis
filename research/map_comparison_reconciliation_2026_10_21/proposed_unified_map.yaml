- id: u_ph_catalyst
  parent: physics
  title: Catalyst identity, active sites and working-surface state
  kind: proposed_theme
  status: proposed_ai_reference
  maturity: ai_worked_out
  summary: Nominal Pd:Ag composition does not uniquely specify working-surface structure, site ensembles, support
    interactions, pretreatment, adsorbate inventory or history.
  explanation: Keep single-site, multisite, alloy-ensemble, hydride and changing-surface models as competing families.
    Dissociative H2 adsorption may require adjacent vacancies in a chosen mechanism; site-count and coverage conventions
    must follow that mechanism. The 2019 Pd catalyst, modeled Pd/PdAg surfaces, a studied PdAg/TiO2 catalyst and the
    BEP catalyst are not interchangeable evidence objects. Surface-state and deposit hypotheses should remain explicit
    and testable.
  equations:
  - 'For a specified site family s: Σ_j θ_(j,s) = 1; multisite models need a balance for each family.'
  assumptions:
  - A site balance is model-specific; one vacancy fraction is not universal.
  - Static characterization constrains structure but does not alone determine transient rates.
  limitations:
  - Target catalyst/support, preparation, pretreatment, particle geometry and working state are unresolved.
  - PdAg ensemble effects cannot be transferred quantitatively without evidence.
  open_questions:
  - What exact catalyst formulation, support and preparation define the BEP?
  - Do hydrogen storage, segregation, deposits or deactivation evolve on the forcing timescale?
