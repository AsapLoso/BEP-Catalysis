- id: u_ph_transport
  parent: physics
  title: Packed-bed, pellet and interphase transport
  kind: proposed_theme
  status: proposed_ai_reference
  maturity: ai_worked_out
  summary: The bed-plane forcing seen by catalyst particles can differ from a commanded inlet because of mixing, residence-time
    distribution, dispersion and gas–solid transport.
  explanation: Represent axial convection and optional dispersion with a declared coordinate and flux convention;
    assess external-film and intraparticle resistance before choosing an effectiveness-factor or lumped-rate model.
    Tracer response and pellet transport can filter or phase-shift a waveform. Danckwerts boundary conditions are
    tied to a flux formulation and should not be copied into an incompatible PDE convention.
  equations:
  - ∂(ε c_i)/∂t + ∂(u_s c_i)/∂z = ∂/∂z(D_ax ∂c_i/∂z) + (1−ε)ρ_cat R_i (stated basis required)
  assumptions:
  - One-dimensional axial geometry is a reduction.
  - Neglect of dispersion, film or pellet gradients requires a scale argument or data.
  limitations:
  - Target bed dimensions, tracer response, particle properties and transport coefficients are unresolved.
  - A frequency window from one diffusion-limited pellet example is not universal.
  open_questions:
  - What is the measured command-to-bed-plane transfer function?
  - Are axial, film or pellet timescales material at candidate frequencies?
