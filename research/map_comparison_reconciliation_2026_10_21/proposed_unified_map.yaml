pending_project_decisions:
- id: target_catalyst
  question: Exact Pd:Ag ratio, support, geometry, preparation, pretreatment, feed and operating window?
  why: Controls transferability of mechanism, kinetics and transport.
- id: performance_objective
  question: Net productivity/yield, selectivity at conversion floor or multiobjective? Include inlet ethylene, startup,
    energy, aging and horizon?
  why: Different objectives can rank operation differently.
- id: control_set
  question: Which inputs are actuated and what bandwidth, slew, total-flow coupling, pressure and safety limits apply?
  why: Defines periodic and matched steady feasible sets.
- id: model_fidelity
  question: PSSA LHHW or explicit dynamic coverages, and which dispersion/pellet/film/thermal/aging states are justified?
  why: Determines gain mechanisms, identifiability and numerical burden.
- id: evidence_threshold
  question: What target data, held-out transient tests and uncertainty separation are required before a gain claim?
  why: Separates fit, validation and performance evidence.
