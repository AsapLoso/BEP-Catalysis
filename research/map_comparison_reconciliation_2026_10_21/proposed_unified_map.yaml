- id: u_ph_thermal
  parent: physics
  title: Energy balance, thermal dynamics and catalyst evolution
  kind: proposed_theme
  status: proposed_ai_reference
  maturity: ai_worked_out
  summary: An isothermal model is a falsifiable baseline; reaction heat, heat exchange and catalyst evolution can
    add memory and constrain safe operation.
  explanation: Assess an energy balance using measured heat release, bed heat capacity, wall/jacket transfer and spatial
    temperature evidence before treating temperature as fixed. Thermal runaway limits and jacket dynamics couple physical
    chemistry to operating constraints. Deposits or aging may be slow states; if they evolve across cycles, a one-cycle
    objective can hide campaign-scale loss.
  equations:
  - C_eff ∂T/∂t + heat transport = heat exchange + (−ΔH_r) r (schematic; consistent basis required)
  assumptions:
  - Isothermal operation is a comparison model, not established target behavior.
  - Thermal and aging states can be omitted only when their effects and timescales are bounded.
  limitations:
  - Target heat-transfer coefficients, thermocouple response, exotherm and aging times are not established.
  - Runaway boundaries are not transferable without matching parameters and geometry.
  open_questions:
  - Are temperature oscillations material to kinetic sensitivity and selectivity margins?
  - Should productivity include aging and utility costs over repeated cycles?
