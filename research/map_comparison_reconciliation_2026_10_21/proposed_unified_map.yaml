- id: u_sc_plant
  parent: systems_control
  title: Plant, input realization and model boundary
  kind: proposed_theme
  status: proposed_ai_reference
  maturity: ai_worked_out
  summary: The command, realized bed-plane composition, reactor states and measured outputs form an input–state–output
    boundary.
  explanation: Trace feed commands through controllers, mixer/manifold, total-flow and pressure coupling, inlet volume
    and bed dispersion to forcing at the particles. Include output sampling and analyzer dynamics. Distinguish plant
    from equipment and observation dynamics; a reduced model is acceptable only for the question and bandwidth it
