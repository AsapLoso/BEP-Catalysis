- id: u_ma_scaling
  parent: mathematics
  title: Dimensionless groups and timescale hierarchy
  kind: proposed_theme
  status: proposed_ai_reference
  maturity: ai_worked_out
  summary: Dimensionless ratios organize transport and forcing regimes but are not evidence of resonance or gain by
    themselves.
  explanation: Use axial Péclet, Damköhler, forcing/residence, pellet Thiele and relevant thermal or adsorption timescale
    ratios to screen regimes and justify reductions. Define every group from the chosen dimensional equations; conventions
    can invert ratios or change prefactors. Scaling should guide experiment design and numerical resolution, then
    be checked against measured plant response.
  equations:
  - Pe_ax = uL/D_ax (convention-dependent)
  - Da = k_eff C_ref L/u (illustrative; rate-law dependent)
  - St = f τ_res or ω τ_res (state frequency convention)
  - φ = R_p sqrt(k/D_eff) (illustrative first-order pellet scaling)
  assumptions:
