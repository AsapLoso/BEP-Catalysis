- id: u_ma_inverse
  parent: mathematics
  title: Identifiability, sensitivity and uncertainty
  kind: proposed_theme
  status: proposed_ai_reference
  maturity: ai_worked_out
  summary: A model reproducing one transient need not uniquely identify parameters or predict a robust optimum.
  explanation: Separate structural and practical identifiability, sensitivity and uncertainty propagation. Correlated
    kinetic parameters, uncertain catalyst state, latent profiles and analyzer filtering can make models observationally
    similar. Excitation may improve discrimination, but must respect measurement bandwidth, noise and constraints.
    Propagate parameter and model uncertainty into the periodic-versus-steady difference.
  equations:
  - S_ij = ∂y_i/∂p_j; rank/conditioning is local and conditional on model, outputs and trajectory
  assumptions:
  - Identifiability depends on model, input, output and noise assumptions.
  - Parameter confidence is not model adequacy.
  limitations:
  - No target fit, posterior or sensitivity result is produced.
  - The original sensitivity threshold requires source- and model-specific checking.
  open_questions:
  - Which parameter combinations are practically identifiable?
  - What uncertainty bound makes a gain distinguishable from zero?
